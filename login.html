<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="/manifest-cliente.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaska.Climb">
<link rel="apple-touch-icon" href="/logo-192.png">
<meta name="theme-color" content="#1c211e">
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --stone-900:#1c211e;
    --stone-800:#262d28;
    --stone-700:#333b34;
    --chalk:#f2ede1;
    --chalk-dim:#c9c3b4;
    --chalk-faint:#8d9187;
    --moss:#7c9070;
    --moss-light:#a7bd98;
    --danger:#c9705b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    background: radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--stone-900) 55%, #121614 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative;
  }
  .fondo-logo{
    position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh;
    background-image:url('/logo.png');
    background-repeat:no-repeat; background-position:center; background-size:cover;
    opacity:0.2; z-index:0;
  }
  h1{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.5px; margin:0; }

  .card{
    position:relative; z-index:1;
    background:rgba(38,45,40,0.6); border:1px solid rgba(242,237,225,0.12);
    border-radius:22px; padding:40px 32px; max-width:380px; width:100%;
    text-align:center; backdrop-filter:blur(8px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px;
    font-weight:700; color:var(--moss-light); text-transform:uppercase; margin-bottom:6px;
  }
  .eyebrow::before, .eyebrow::after{ content:""; width:16px; height:2px; background:var(--moss-light); }
  h1{ font-size:26px; margin-bottom:10px; }
  h1 span{ color:var(--moss); }
  .sub{ font-size:13.5px; color:var(--chalk-dim); line-height:1.55; margin-bottom:30px; }

  #gBtn{ display:flex; justify-content:center; margin-bottom:10px; }

  .status{
    display:none; margin-top:20px; font-size:12.5px; color:var(--chalk-faint);
  }
  .status.show{ display:block; }

  .welcome{ display:none; }
  .welcome.show{ display:block; }
  .welcome img{ width:64px; height:64px; border-radius:50%; border:2px solid var(--moss); margin-bottom:14px; }
  .welcome .name{ font-size:18px; font-weight:800; color:var(--chalk); margin-bottom:2px; }
  .welcome .email{ font-size:12.5px; color:var(--chalk-faint); margin-bottom:20px; }
  .welcome .note{
    background:rgba(201,154,91,0.14); border:1px solid rgba(201,154,91,0.35);
    border-radius:12px; padding:12px 14px; font-size:12px; color:var(--chalk-dim); line-height:1.5; text-align:left;
  }
  .welcome .note strong{ color:#c99a5b; }
  .welcome .note.error{ background:rgba(201,112,91,0.16); border-color:rgba(201,112,91,0.4); }
  .welcome .note.error strong{ color:var(--danger); }

  .btn-reintentar{
    margin-top:16px; background:var(--stone-800); border:1px solid rgba(242,237,225,0.16); color:var(--chalk);
    padding:10px 18px; border-radius:10px; font-size:12.5px; font-weight:700; letter-spacing:0.3px;
    text-transform:uppercase; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-reintentar:hover{ background:var(--moss); border-color:var(--moss); color:var(--stone-900); }

  #loginBox.hide{ display:none; }
</style>
</head>
<body>
<div class="fondo-logo"></div>

<div class="card">
  <div id="loginBox">
    <div class="eyebrow">Kaska.Climb</div>
    <h1>Área de <span>Cliente</span></h1>
    <div class="sub">Inicia sesión con la cuenta de Google que usas con tu entrenador para acceder a tu semana y tus sesiones.</div>
    <div id="gBtn"></div>
    <div class="status" id="status">Cargando...</div>
  </div>

  <div class="welcome" id="welcome">
    <img id="wPhoto" src="" alt="">
    <div class="name" id="wName"></div>
    <div class="email" id="wEmail"></div>
    <div class="note" id="wNote">Comprobando tu cuenta de cliente...</div>
    <button class="btn-reintentar" id="btnReintentar" style="display:none;" type="button">Volver a intentar</button>
  </div>
</div>

<script>
  const CLIENT_ID = '750960934789-afud0r9hmq7fe700okgu0o0cer0cih1q.apps.googleusercontent.com';
  // Guardamos aquí el email+nombre ya verificados para no obligar a volver a
  // iniciar sesión con Google cada vez que se abre la app.
  const CLAVE_SESION = 'kaska_sesion_cliente';

  function decodeJwt(token){
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  }

  // Lee solo la caducidad de nuestro token de sesión (segundo tramo,
  // base64url) — comprobación de comodidad en el navegador para no lanzar
  // el botón de Google sin necesidad; la comprobación de verdad (firma
  // incluida) la hace cada endpoint en el servidor con la clave secreta,
  // que nunca sale de Vercel.
  function tokenSigueVivo(token){
    try{
      const partes = String(token).split('.');
      if(partes.length !== 3) return false;
      const pad = partes[1].length % 4 === 0 ? '' : '='.repeat(4 - (partes[1].length % 4));
      const caduca = Number(atob(partes[1].replace(/-/g,'+').replace(/_/g,'/') + pad));
      return caduca > Date.now();
    }catch(e){ return false; }
  }

  function mostrarBienvenida(nombre, email, foto){
    const wPhoto = document.getElementById('wPhoto');
    if(foto){ wPhoto.src = foto; wPhoto.style.display = ''; }
    else{ wPhoto.style.display = 'none'; }
    document.getElementById('wName').textContent = nombre || email;
    document.getElementById('wEmail').textContent = email;
    document.getElementById('loginBox').classList.add('hide');
    document.getElementById('welcome').classList.add('show');
  }

  function irASemana(cliente, nombre){
    const qs = new URLSearchParams({ cliente, nombre });
    window.location.href = '/cliente/semana.html?' + qs.toString();
  }

  async function verificarYRedirigir(idToken){
    const nota = document.getElementById('wNote');
    const btnReintentar = document.getElementById('btnReintentar');
    nota.classList.remove('error');
    nota.innerHTML = 'Comprobando tu cuenta de cliente...';
    btnReintentar.style.display = 'none';

    try{
      const res = await fetch('/api/verificar-cliente', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken }),
      });
      const data = await res.json();

      if(data.success){
        localStorage.setItem(CLAVE_SESION, JSON.stringify({
          email: data.cliente.email,
          nombreCompleto: data.cliente.nombreCompleto,
          token: data.token,
        }));
        nota.innerHTML = `<strong>¡Cuenta encontrada!</strong> Te llevamos a tu semana...`;
        setTimeout(() => irASemana(data.cliente.email, data.cliente.nombreCompleto), 1200);
      }else{
        // Si la sesión guardada ya no vale (p.ej. el entrenador desactivó al
        // cliente), la borramos para no quedarnos en bucle en la próxima visita.
        localStorage.removeItem(CLAVE_SESION);
        nota.classList.add('error');
        nota.innerHTML = `<strong>No hemos podido darte acceso.</strong> ${data.error || 'Ha ocurrido un error inesperado.'}`;
        btnReintentar.style.display = 'inline-block';
      }
    }catch(err){
      nota.classList.add('error');
      nota.innerHTML = `<strong>Error de red.</strong> ${err.message}`;
      btnReintentar.style.display = 'inline-block';
    }
  }

  function handleCredentialResponse(response){
    const payload = decodeJwt(response.credential);
    mostrarBienvenida(payload.name, payload.email, payload.picture);
    verificarYRedirigir(response.credential);
  }

  window.onload = function(){
    document.getElementById('btnReintentar').addEventListener('click', () => {
      document.getElementById('welcome').classList.remove('show');
      document.getElementById('loginBox').classList.remove('hide');
    });

    // Si ya tenemos un token de sesión propio vigente en este dispositivo,
    // nos saltamos el botón de Google directamente — el propio token (no un
    // correo suelto) es lo que demuestra quién eres en cada página/endpoint.
    const guardado = localStorage.getItem(CLAVE_SESION);
    if(guardado){
      try{
        const datos = JSON.parse(guardado);
        if(datos && datos.email && datos.token && tokenSigueVivo(datos.token)){
          mostrarBienvenida(datos.nombreCompleto, datos.email, null);
          irASemana(datos.email, datos.nombreCompleto);
          return;
        }
      }catch(e){ /* si está corrupto, seguimos con el login normal */ }
      localStorage.removeItem(CLAVE_SESION);
    }

    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById('gBtn'),
      { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 280 }
    );
  };

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
