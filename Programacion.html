<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Programación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="libs/mesociclos-config.js"></script>
<style>
  :root{
    --stone-900:#1c211e; --stone-800:#262d28; --stone-700:#333b34;
    --chalk:#f2ede1; --chalk-dim:#c9c3b4; --chalk-faint:#8d9187;
    --moss:#7c9070; --moss-light:#a7bd98; --moss-deep:#4d5c46;
    --amber:#c99a5b; --danger:#c9705b;
    --line:rgba(242,237,225,0.10); --line-strong:rgba(242,237,225,0.16);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--stone-900); color:var(--chalk); font-family:'Work Sans', sans-serif; }
  h1,h2{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.4px; margin:0; }

  .topbar{ position:sticky; top:0; z-index:40; background:rgba(28,33,30,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-strong); }
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px; font-weight:700; color:var(--moss-light); text-transform:uppercase; }
  .eyebrow::before{ content:""; width:16px; height:2px; background:var(--moss-light); }
  .brand h1{ font-size:22px; }
  .icon-btn{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; transition:all .2s ease;
  }
  .icon-btn:hover{ background:var(--moss); border-color:var(--moss); color:var(--stone-900); }

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
  .cabecera-pagina{ margin-bottom:22px; }
  .cabecera-pagina h2{ font-size:26px; }
  .cabecera-pagina p{ color:var(--chalk-dim); font-size:13.5px; margin:6px 0 0; max-width:70ch; }

  .card{ background:rgba(38,45,40,0.55); border:1px solid var(--line-strong); border-radius:18px; backdrop-filter:blur(8px); }
  .estado-carga, .vacio{ text-align:center; padding:60px 20px; color:var(--chalk-dim); }

  /* Una sola barra de desplazamiento para toda la rejilla (no una por
     cliente) — con muchos clientes, arrastrar el scroll fila a fila era
     tedioso; ahora todas se mueven juntas. width:max-content + min-width:100%
     en cada fila hace que el ancho real de la más larga determine el
     scrollWidth de este contenedor compartido. */
  #contenidoGrid{ overflow-x:auto; border-radius:18px; }

  .leyenda{ display:flex; flex-wrap:wrap; gap:14px; padding:18px 26px; border-bottom:1px solid var(--line-strong); font-size:11.5px; color:var(--chalk-dim); }
  .leyenda .item{ display:flex; align-items:center; gap:7px; }
  .leyenda .muestra{ width:14px; height:14px; border-radius:4px; flex:0 0 auto; }
  .leyenda .muestra.pendiente{ background:transparent; border:2px solid var(--danger); }
  .leyenda .muestra.historica{ background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); }

  .fila-cliente{ display:flex; border-bottom:1px solid var(--line); width:max-content; min-width:100%; }
  .fila-cliente:last-child{ border-bottom:none; }
  .nombre-cliente-grid{
    position:sticky; left:0; z-index:1; background:var(--stone-800); flex:0 0 190px;
    padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:2px;
    border-right:1px solid var(--line-strong);
  }
  .nombre-cliente-grid .nombre{ font-weight:700; font-size:13px; color:var(--chalk); }
  .nombre-cliente-grid .correo{ font-size:10.5px; color:var(--chalk-faint); }
  .semanas-scroll{ display:flex; gap:5px; padding:14px 16px; align-items:center; flex:0 0 auto; }
  .semana-celda{
    flex:0 0 38px; height:42px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; color:var(--stone-900); cursor:pointer; position:relative;
    transition:transform .1s ease;
  }
  .semana-celda:hover{ transform:translateY(-2px); }
  .semana-celda.pendiente{ background:transparent; border:2px solid var(--danger); color:var(--danger); }
  .semana-celda.historica{ background:rgba(255,255,255,0.05); border:1px solid var(--line-strong); color:var(--chalk-faint); }
  .semana-celda.hoy{ box-shadow:0 0 0 2px var(--chalk); }

  .overlay-semana{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay-semana.abierto{ display:flex; }
  .modal-semana{
    background:var(--stone-800); border:1px solid var(--line-strong); border-radius:16px;
    max-width:460px; width:100%; padding:22px 24px; box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .modal-semana h3{ font-size:16px; color:var(--chalk); margin-bottom:2px; }
  .modal-semana .sub-modal{ font-size:11.5px; color:var(--chalk-faint); margin-bottom:16px; }
  .fila-dia{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .fila-dia:last-child{ border-bottom:none; }
  .nombre-dia small{ display:block; font-weight:400; color:var(--chalk-faint); font-size:10.5px; margin-top:1px; }
  .contenido-dia{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .etiqueta-meso{
    font-size:10.5px; font-weight:800; color:var(--stone-900); padding:4px 9px; border-radius:99px;
    border:2px solid transparent; cursor:pointer; font-family:inherit; transition:transform .1s ease;
  }
  .etiqueta-meso:hover{ transform:translateY(-1px); }
  .etiqueta-meso.activa{ border-color:var(--chalk); }
  .sin-publicar{ font-size:11.5px; color:var(--chalk-faint); font-style:italic; }

  .detalle-sesion{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line-strong);
    max-height:280px; overflow-y:auto;
  }
  .detalle-sesion .cab-detalle{ font-size:11px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; color:var(--chalk-faint); margin-bottom:10px; }
  .detalle-sesion .sin-datos{ font-size:12.5px; color:var(--chalk-faint); font-style:italic; }
  .bloque-programado{ margin-bottom:14px; }
  .bloque-programado:last-child{ margin-bottom:0; }
  .titulo-bloque{ font-weight:700; font-size:13px; color:var(--chalk); }
  .desc-bloque{ font-size:11.5px; color:var(--chalk-faint); margin-top:2px; margin-bottom:6px; }
  .fila-ejercicio{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .fila-ejercicio .nombre-ej{ color:var(--chalk); }
  .fila-ejercicio .series-ej{ color:var(--chalk-dim); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .notas-ej{ font-size:11px; color:var(--chalk-faint); font-style:italic; padding:0 0 5px; margin-top:-3px; }
  .modal-semana .btn-cerrar-modal{
    margin-top:18px; background:var(--moss); color:var(--stone-900); border:none; font-weight:800;
    font-size:12px; letter-spacing:0.4px; text-transform:uppercase; padding:10px 18px; border-radius:9px;
    cursor:pointer; font-family:inherit;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="eyebrow">Kaska.Climb</div>
      <h1>Programación</h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="icon-btn" href="Seguimiento.html">Seguimiento</a>
      <a class="icon-btn" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Inicio
      </a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="cabecera-pagina">
    <h2 style="color:var(--moss-light);">Semanas programadas por cliente</h2>
    <p>Una fila por cliente activo con macrociclo — cada casilla es una semana de su plan, coloreada por fase. Desplázate dentro de cada fila para ver el macrociclo completo.</p>
  </div>

  <div class="card">
    <div class="leyenda" id="leyenda"></div>
    <div id="contenidoGrid"><div class="estado-carga">Cargando programación…</div></div>
  </div>
</div>

<div class="overlay-semana" id="overlaySemana">
  <div class="modal-semana">
    <h3 id="modalSemanaTitulo">Semana</h3>
    <div class="sub-modal" id="modalSemanaSub"></div>
    <div id="modalSemanaDias"></div>
    <div id="modalSemanaDetalleSesion"></div>
    <button class="btn-cerrar-modal" id="btnCerrarModalSemana">Cerrar</button>
  </div>
</div>

<script>
function escapeHtml(str){
  return (str == null ? '' : String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const { CATEGORIA_VISUAL } = window.MESOCICLOS_CONFIG || {};

function lunesDeHoy(){
  const hoy = new Date();
  const diaSemana = hoy.getDay();
  const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
  const lunes = new Date(hoy);
  lunes.setDate(lunes.getDate() + offset);
  return `${String(lunes.getDate()).padStart(2,'0')}/${String(lunes.getMonth()+1).padStart(2,'0')}/${lunes.getFullYear()}`;
}

function pintarLeyenda(){
  const fases = ['FMAX','REOX','DESOX','AERO','TAPERING'];
  document.getElementById('leyenda').innerHTML = fases.map(f => `
    <div class="item"><span class="muestra" style="background:${(CATEGORIA_VISUAL && CATEGORIA_VISUAL[f] && CATEGORIA_VISUAL[f].color) || '#888'}"></span>${f}</div>
  `).join('') + `
    <div class="item"><span class="muestra pendiente"></span>Sin publicar</div>
    <div class="item"><span class="muestra historica"></span>Histórica / sin datos fiables</div>
  `;
}

async function cargarGrid(){
  const cont = document.getElementById('contenidoGrid');
  try {
    const res = await fetch('/api/macrociclo?accion=grid');
    const data = await res.json();
    if (!data.success) {
      cont.innerHTML = `<div class="vacio">${escapeHtml(data.error || 'No se pudo cargar la programación.')}</div>`;
      return;
    }
    if (!data.clientes.length) {
      cont.innerHTML = `<div class="vacio">Ningún cliente activo tiene un macrociclo publicado todavía.</div>`;
      return;
    }
    const hoyStr = lunesDeHoy();
    cont.innerHTML = data.clientes.map(c => `
      <div class="fila-cliente">
        <div class="nombre-cliente-grid">
          <span class="nombre">${escapeHtml(c.nombre || c.correo)}</span>
          <span class="correo">${escapeHtml(c.correo)}</span>
        </div>
        <div class="semanas-scroll" data-cliente="${escapeHtml(c.correo)}">
          ${c.semanas.map(s => {
            const esHoy = s.fechaLunes === hoyStr;
            let clase = 'semana-celda';
            let estilo = '';
            if (s.historica) {
              clase += ' historica';
            } else if (!s.publicada) {
              clase += ' pendiente';
            } else {
              estilo = `background:${(CATEGORIA_VISUAL && CATEGORIA_VISUAL[s.mesociclo] && CATEGORIA_VISUAL[s.mesociclo].color) || '#888'}`;
            }
            if (esHoy) clase += ' hoy';
            const titulo = `Semana ${s.semanaGlobal} · ${s.mesociclo || '—'} · ${s.fechaLunes}${s.publicada ? ' · publicada' : (s.historica ? ' · sin datos' : ' · sin publicar')}`;
            return `<div class="${clase}" style="${estilo}" title="${escapeHtml(titulo)}" data-hoy="${esHoy ? '1' : ''}"
              data-correo="${escapeHtml(c.correo)}" data-nombre="${escapeHtml(c.nombre || c.correo)}"
              data-fecha-lunes="${escapeHtml(s.fechaLunes)}" data-semana="${escapeHtml(String(s.semanaGlobal))}">${s.semanaGlobal}</div>`;
          }).join('')}
        </div>
      </div>`).join('');

    // Centra la vista en la semana de "hoy" al cargar, para no tener que
    // buscarla a mano en macrociclos largos. El scroll ahora es uno solo para
    // toda la rejilla, así que basta con centrar en la primera que encontremos
    // (normalmente coincide entre clientes con macrociclos parecidos).
    const primeraCeldaHoy = cont.querySelector('[data-hoy="1"]');
    if (primeraCeldaHoy) primeraCeldaHoy.scrollIntoView({ inline: 'center', block: 'nearest' });
  } catch (e) {
    cont.innerHTML = `<div class="vacio">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

// Detalle de una semana concreta: días + qué está publicado cada día. Reusa
// /api/obtener-semana (el mismo que ya usa cliente/semana.html), pasándole el
// lunes de la semana pulsada como fecha de referencia — no hace falta ningún
// endpoint nuevo para esto.
const DIAS_SEMANA = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const overlaySemana = document.getElementById('overlaySemana');

let clienteActualCorreo = null;

async function abrirDetalleSemana(correo, nombre, fechaLunes, semanaGlobal){
  clienteActualCorreo = correo;
  document.getElementById('modalSemanaTitulo').textContent = `Semana ${semanaGlobal}`;
  document.getElementById('modalSemanaSub').textContent = `${nombre} · semana del ${fechaLunes}`;
  document.getElementById('modalSemanaDias').innerHTML = '<div class="estado-carga" style="padding:20px;">Cargando…</div>';
  document.getElementById('modalSemanaDetalleSesion').innerHTML = '';
  overlaySemana.classList.add('abierto');
  try {
    const res = await fetch('/api/obtener-semana?' + new URLSearchParams({ cliente: correo, fecha: fechaLunes }));
    const data = await res.json();
    const cont = document.getElementById('modalSemanaDias');
    if (!data.success) {
      cont.innerHTML = `<div class="vacio" style="padding:16px 0;">${escapeHtml(data.error || 'No se pudo cargar.')}</div>`;
      return;
    }
    const porFecha = new Map();
    (data.sesiones || []).forEach(s => {
      if (!porFecha.has(s.fecha)) porFecha.set(s.fecha, []);
      porFecha.get(s.fecha).push(s.mesociclo);
    });
    cont.innerHTML = data.dias.map((fecha, i) => {
      const mesos = porFecha.get(fecha) || [];
      const contenido = mesos.length
        ? mesos.map(m => `<button class="etiqueta-meso" style="background:${(CATEGORIA_VISUAL && CATEGORIA_VISUAL[m] && CATEGORIA_VISUAL[m].color) || '#888'}" data-fecha="${escapeHtml(fecha)}" data-mesociclo="${escapeHtml(m)}">${escapeHtml(m)}</button>`).join('')
        : '<span class="sin-publicar">Sin publicar</span>';
      return `<div class="fila-dia"><span class="nombre-dia">${DIAS_SEMANA[i]}<small>${escapeHtml(fecha)}</small></span><span class="contenido-dia">${contenido}</span></div>`;
    }).join('');
  } catch (e) {
    document.getElementById('modalSemanaDias').innerHTML = `<div class="vacio" style="padding:16px 0;">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

document.getElementById('contenidoGrid').addEventListener('click', (e) => {
  const celda = e.target.closest('.semana-celda');
  if (!celda) return;
  abrirDetalleSemana(celda.dataset.correo, celda.dataset.nombre, celda.dataset.fechaLunes, celda.dataset.semana);
});

// Sesión PROGRAMADA (lo que diseñó el entrenador), no los datos que haya
// rellenado el cliente — se pincha una etiqueta de mesociclo dentro del
// detalle de semana y se trae el guion exacto de ese día vía
// /api/obtener-sesion (el mismo formato que exporta Sesiones.html: partes de
// tipo "bloque_ejercicios" con su lista de ejercicios, o "cabecera_separadora"
// como simple título de sección).
function renderSesionProgramada(mesociclo, fecha, sesion){
  const cabecera = `<div class="cab-detalle">${escapeHtml(mesociclo)} · ${escapeHtml(fecha)}</div>`;
  const partes = (sesion && sesion.partes) || [];
  const bloques = partes.filter(p => p.tipo === 'bloque_ejercicios');

  if (!bloques.length) {
    return `<div class="detalle-sesion">${cabecera}<div class="sin-datos">${escapeHtml((sesion && sesion.tituloPrincipal) || 'Sin bloques de ejercicios en esta sesión.')}</div></div>`;
  }

  return `<div class="detalle-sesion">${cabecera}
    ${bloques.map(b => `
      <div class="bloque-programado">
        <div class="titulo-bloque">${escapeHtml(b.titulo || '—')}</div>
        ${b.descripcion ? `<div class="desc-bloque">${escapeHtml(b.descripcion)}</div>` : ''}
        ${(b.ejercicios || []).map(ej => `
          <div class="fila-ejercicio">
            <span class="nombre-ej">${escapeHtml(ej.nombre || '—')}</span>
            <span class="series-ej">${escapeHtml(ej.series || '—')}</span>
          </div>
          ${ej.notas ? `<div class="notas-ej">${escapeHtml(ej.notas)}</div>` : ''}
        `).join('')}
      </div>`).join('')}
  </div>`;
}

async function mostrarDetalleSesion(fecha, mesociclo, boton){
  document.querySelectorAll('.etiqueta-meso.activa').forEach(b => b.classList.remove('activa'));
  boton.classList.add('activa');
  const cont = document.getElementById('modalSemanaDetalleSesion');
  cont.innerHTML = `<div class="detalle-sesion"><div class="cab-detalle">${escapeHtml(mesociclo)} · ${escapeHtml(fecha)}</div><div class="sin-datos">Cargando…</div></div>`;

  try {
    const res = await fetch('/api/obtener-sesion?' + new URLSearchParams({ cliente: clienteActualCorreo, fecha, mesociclo }));
    const data = await res.json();
    if (!data.success) {
      cont.innerHTML = `<div class="detalle-sesion"><div class="cab-detalle">${escapeHtml(mesociclo)} · ${escapeHtml(fecha)}</div><div class="sin-datos">${escapeHtml(data.error || 'No se pudo cargar.')}</div></div>`;
      return;
    }
    cont.innerHTML = renderSesionProgramada(mesociclo, fecha, data.sesion);
  } catch (e) {
    cont.innerHTML = `<div class="detalle-sesion"><div class="cab-detalle">${escapeHtml(mesociclo)} · ${escapeHtml(fecha)}</div><div class="sin-datos">Error de red: ${escapeHtml(e.message)}</div></div>`;
  }
}

document.getElementById('modalSemanaDias').addEventListener('click', (e) => {
  const boton = e.target.closest('.etiqueta-meso');
  if (!boton) return;
  mostrarDetalleSesion(boton.dataset.fecha, boton.dataset.mesociclo, boton);
});

function cerrarDetalleSemana(){ overlaySemana.classList.remove('abierto'); }
document.getElementById('btnCerrarModalSemana').addEventListener('click', cerrarDetalleSemana);
overlaySemana.addEventListener('click', (e) => { if (e.target === overlaySemana) cerrarDetalleSemana(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarDetalleSemana(); });

pintarLeyenda();
cargarGrid();
</script>
</body>
</html>
