<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Programación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="libs/mesociclos-config.js"></script>
<style>
  :root{
    --stone-900:#1c211e; --stone-800:#262d28; --stone-700:#333b34;
    --chalk:#f2ede1; --chalk-dim:#c9c3b4; --chalk-faint:#8d9187;
    --moss:#7c9070; --moss-light:#a7bd98; --moss-deep:#4d5c46;
    --amber:#c99a5b; --danger:#c9705b;
    --line:rgba(242,237,225,0.10); --line-strong:rgba(242,237,225,0.16);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--stone-900); color:var(--chalk); font-family:'Work Sans', sans-serif; }
  h1,h2{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.4px; margin:0; }

  .topbar{ position:sticky; top:0; z-index:40; background:rgba(28,33,30,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-strong); }
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px; font-weight:700; color:var(--moss-light); text-transform:uppercase; }
  .eyebrow::before{ content:""; width:16px; height:2px; background:var(--moss-light); }
  .brand h1{ font-size:22px; }
  .icon-btn{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; transition:all .2s ease;
  }
  .icon-btn:hover{ background:var(--moss); border-color:var(--moss); color:var(--stone-900); }

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
  .cabecera-pagina{ margin-bottom:22px; }
  .cabecera-pagina h2{ font-size:26px; }
  .cabecera-pagina p{ color:var(--chalk-dim); font-size:13.5px; margin:6px 0 0; max-width:70ch; }

  .card{ background:rgba(38,45,40,0.55); border:1px solid var(--line-strong); border-radius:18px; backdrop-filter:blur(8px); overflow:hidden; }
  .estado-carga, .vacio{ text-align:center; padding:60px 20px; color:var(--chalk-dim); }

  .leyenda{ display:flex; flex-wrap:wrap; gap:14px; padding:18px 26px; border-bottom:1px solid var(--line-strong); font-size:11.5px; color:var(--chalk-dim); }
  .leyenda .item{ display:flex; align-items:center; gap:7px; }
  .leyenda .muestra{ width:14px; height:14px; border-radius:4px; flex:0 0 auto; }
  .leyenda .muestra.pendiente{ background:transparent; border:2px solid var(--danger); }
  .leyenda .muestra.historica{ background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); }

  .fila-cliente{ display:flex; border-bottom:1px solid var(--line); }
  .fila-cliente:last-child{ border-bottom:none; }
  .nombre-cliente-grid{
    position:sticky; left:0; z-index:1; background:var(--stone-800); flex:0 0 190px;
    padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:2px;
    border-right:1px solid var(--line-strong);
  }
  .nombre-cliente-grid .nombre{ font-weight:700; font-size:13px; color:var(--chalk); }
  .nombre-cliente-grid .correo{ font-size:10.5px; color:var(--chalk-faint); }
  .semanas-scroll{ display:flex; gap:5px; overflow-x:auto; padding:14px 16px; align-items:center; }
  .semana-celda{
    flex:0 0 38px; height:42px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; color:var(--stone-900); cursor:default; position:relative;
  }
  .semana-celda.pendiente{ background:transparent; border:2px solid var(--danger); color:var(--danger); }
  .semana-celda.historica{ background:rgba(255,255,255,0.05); border:1px solid var(--line-strong); color:var(--chalk-faint); }
  .semana-celda.hoy{ box-shadow:0 0 0 2px var(--chalk); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="eyebrow">Kaska.Climb</div>
      <h1>Programación</h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="icon-btn" href="Clientes.html">Clientes</a>
      <a class="icon-btn" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Inicio
      </a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="cabecera-pagina">
    <h2 style="color:var(--moss-light);">Semanas programadas por cliente</h2>
    <p>Una fila por cliente activo con macrociclo — cada casilla es una semana de su plan, coloreada por fase. Desplázate dentro de cada fila para ver el macrociclo completo.</p>
  </div>

  <div class="card">
    <div class="leyenda" id="leyenda"></div>
    <div id="contenidoGrid"><div class="estado-carga">Cargando programación…</div></div>
  </div>
</div>

<script>
function escapeHtml(str){
  return (str == null ? '' : String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const { CATEGORIA_VISUAL } = window.MESOCICLOS_CONFIG || {};

function lunesDeHoy(){
  const hoy = new Date();
  const diaSemana = hoy.getDay();
  const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
  const lunes = new Date(hoy);
  lunes.setDate(lunes.getDate() + offset);
  return `${String(lunes.getDate()).padStart(2,'0')}/${String(lunes.getMonth()+1).padStart(2,'0')}/${lunes.getFullYear()}`;
}

function pintarLeyenda(){
  const fases = ['FMAX','REOX','DESOX','AERO','TAPERING'];
  document.getElementById('leyenda').innerHTML = fases.map(f => `
    <div class="item"><span class="muestra" style="background:${(CATEGORIA_VISUAL && CATEGORIA_VISUAL[f] && CATEGORIA_VISUAL[f].color) || '#888'}"></span>${f}</div>
  `).join('') + `
    <div class="item"><span class="muestra pendiente"></span>Sin publicar</div>
    <div class="item"><span class="muestra historica"></span>Histórica / sin datos fiables</div>
  `;
}

async function cargarGrid(){
  const cont = document.getElementById('contenidoGrid');
  try {
    const res = await fetch('/api/macrociclo?accion=grid');
    const data = await res.json();
    if (!data.success) {
      cont.innerHTML = `<div class="vacio">${escapeHtml(data.error || 'No se pudo cargar la programación.')}</div>`;
      return;
    }
    if (!data.clientes.length) {
      cont.innerHTML = `<div class="vacio">Ningún cliente activo tiene un macrociclo publicado todavía.</div>`;
      return;
    }
    const hoyStr = lunesDeHoy();
    cont.innerHTML = data.clientes.map(c => `
      <div class="fila-cliente">
        <div class="nombre-cliente-grid">
          <span class="nombre">${escapeHtml(c.nombre || c.correo)}</span>
          <span class="correo">${escapeHtml(c.correo)}</span>
        </div>
        <div class="semanas-scroll" data-cliente="${escapeHtml(c.correo)}">
          ${c.semanas.map(s => {
            const esHoy = s.fechaLunes === hoyStr;
            let clase = 'semana-celda';
            let estilo = '';
            if (s.historica) {
              clase += ' historica';
            } else if (!s.publicada) {
              clase += ' pendiente';
            } else {
              estilo = `background:${(CATEGORIA_VISUAL && CATEGORIA_VISUAL[s.mesociclo] && CATEGORIA_VISUAL[s.mesociclo].color) || '#888'}`;
            }
            if (esHoy) clase += ' hoy';
            const titulo = `Semana ${s.semanaGlobal} · ${s.mesociclo || '—'} · ${s.fechaLunes}${s.publicada ? ' · publicada' : (s.historica ? ' · sin datos' : ' · sin publicar')}`;
            return `<div class="${clase}" style="${estilo}" title="${escapeHtml(titulo)}" data-hoy="${esHoy ? '1' : ''}">${s.semanaGlobal}</div>`;
          }).join('')}
        </div>
      </div>`).join('');

    // Centra cada fila en la semana de "hoy" al cargar, para no tener que
    // buscarla a mano en macrociclos largos.
    cont.querySelectorAll('.semanas-scroll').forEach(fila => {
      const celdaHoy = fila.querySelector('[data-hoy="1"]');
      if (celdaHoy) celdaHoy.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  } catch (e) {
    cont.innerHTML = `<div class="vacio">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

pintarLeyenda();
cargarGrid();
</script>
</body>
</html>
