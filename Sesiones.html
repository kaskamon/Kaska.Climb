<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaska.Climb">
<link rel="apple-touch-icon" href="/logo-192.png">

<meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaska.Climb | Sesiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===================================================
           DISEÑO EXCLUSIVO PREMIUM COMPACTO — KASKA.CLIMB
           =================================================== */
        :root{
            --stone-900:#1c211e;
            --stone-700:#333b34;
            --chalk-dim:#6b7268;
            --line:#ddd9cb;
            --paper-dim:#f7f5ef;
            --moss:#7c9070;
            --moss-light:#a7bd98;
            --moss-deep:#4d5c46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--stone-900); 
            padding: 16px 30px 30px 30px; 
            -webkit-font-smoothing: antialiased;
            background-color: #ffffff;
            position: relative;
        }

        .eyebrow{
            display:inline-flex; align-items:center; gap:10px;
            font-size:11px; letter-spacing:3px; font-weight:700;
            color:var(--moss-deep); text-transform:uppercase; margin-bottom:8px;
        }
        .eyebrow::before, .eyebrow::after{ content:""; width:18px; height:2px; background:var(--moss-deep); }

        .cuerpo-app {
            position: relative;
            min-height: 99vh;
        }

        .marca-agua-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 99vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; 
            transform: scale(0.88); 
            opacity: 0.35; 
            z-index: 0; 
            pointer-events: none; 
        }

        .contenedor-entreno {
            position: relative;
            z-index: 1;
        }

        .cabecera-principal-empresa {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            padding-top: 0px; 
            margin-top: 0px;  
            margin-bottom: 20px; 
            gap: 40px;
            padding-bottom: 12px; 
            border-bottom: 2px solid var(--moss-deep); 
        }

        #contenedor-partes .cabecera-principal-empresa {
            margin-top: 20px; 
        }

        .contenedor-titulo-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 2px; 
        }

        .input-titulo-gran-formato {
            width: 100%;
            font-family: 'Anton', sans-serif;
            font-size: 30px; 
            font-weight: 400;
            text-transform: uppercase;
            border: none;
            background: transparent;
            color: var(--stone-900);
            letter-spacing: 0.3px;
            outline: none;
            line-height: 1.15;
        }

        .zona-botones {
            margin-bottom: 25px; 
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Formato unificado de botones */
        .btn-principal {
            color: #ffffff;
            background-color: var(--stone-900);
            padding: 8px 14px; 
            border: 1px solid var(--stone-900);
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Work Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-size: 11px; 
            transition: all 0.15s ease-in-out;
        }

        .btn-principal:hover {
            background-color: var(--moss);
            border-color: var(--moss);
        }

        .btn-inicio-sesiones {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--stone-900);
            color: #ffffff;
            border: 1px solid var(--stone-900);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Work Sans', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.15s ease-in-out;
        }

        .btn-inicio-sesiones:hover {
            background: var(--moss);
            color: #ffffff;
            border-color: var(--moss);
        }

        .bloque-parte {
            background: rgba(247, 245, 239, 0.85); 
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px 4px 16px; 
            margin-bottom: 12px; 
            border-left: 5px solid var(--moss-deep); 
            position: relative;
            overflow: hidden; 
        }

        .cabecera-parte {
            display: flex;
            gap: 15px;
            margin-bottom: 8px; 
            align-items: center; 
            background-color: rgba(124, 144, 112, 0.1); 
            padding: 6px 12px; 
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .celda-cabecera-editable {
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            font-size: 13px;
        }

        .input-titulo {
            font-size: 14px; 
            font-weight: 800;
            flex: 2;
            color: var(--stone-900);
            letter-spacing: 0.02em;
        }

        .input-descripcion {
            flex: 4;
            color: var(--chalk-dim);
            font-size: 12px; 
            font-style: italic;
            border-left: 1px solid var(--line);
            padding-left: 12px;
            background: transparent;
        }

        .celda-cabecera-editable:focus, .celda-editable:focus, .input-titulo-gran-formato:focus {
            box-shadow: 0 1px 0 0 var(--moss); 
        }

        .zona-ordenar {
            display: flex;
            gap: 2px;
        }

        .btn-orden {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            color: var(--chalk-dim);
            transition: color 0.1s ease;
        }

        .btn-orden:hover { color: var(--moss-deep); }

        .tabla-ejercicios {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0px; 
            table-layout: fixed; 
            background: transparent;
        }

        .tabla-ejercicios th {
            color: var(--stone-900);
            padding: 4px 4px; 
            text-align: left;
            font-size: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 800;
            border-bottom: 2px solid var(--moss-deep); 
        }

        /* MODIFICADO LIGERAMENTE PARA QUE QUEPAN LAS FLECHAS */
        .tabla-ejercicios th:nth-child(1), .tabla-ejercicios td:nth-child(1) { width: 30%; } 
        .tabla-ejercicios th:nth-child(2), .tabla-ejercicios td:nth-child(2) { width: 25%; } 
        .tabla-ejercicios th:nth-child(3), .tabla-ejercicios td:nth-child(3) { width: 30%; } 
        .tabla-ejercicios th:nth-child(4), .tabla-ejercicios td:nth-child(4) { width: 15%; text-align: right; } 

        .tabla-ejercicios td {
            padding: 5px 4px 5px 0; 
            vertical-align: top; 
        }

        .celda-editable {
            outline: none;
            font-size: 12px; 
            white-space: pre-wrap;       
            word-wrap: break-word;       
            word-break: break-word;
            min-height: 18px;
        }

        .celda-editable:empty:before, .celda-cabecera-editable:empty:before {
            content: attr(placeholder);
            color: #a8a294;
            font-weight: normal;
        }

        .tabla-ejercicios tr td:first-child {
            font-weight: 600;
            color: var(--stone-900);
        }

        .btn-accion {
            padding: 4px 8px; 
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            font-size: 10px; 
        }

        .btn-añadir-ejercicio {
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--stone-900);
            border: 1px solid var(--line);
        }

        .btn-añadir-ejercicio:hover { background-color: var(--moss); color: #ffffff; border-color: var(--moss); }
        .btn-eliminar { background-color: transparent; color: #a8a294; text-align: right; }
        .btn-eliminar:hover { color: #b3564a; }
        .btn-eliminar-parte { background-color: rgba(255, 255, 255, 0.7); color: var(--chalk-dim); border: 1px solid var(--line); }
        .btn-eliminar-parte:hover { background-color: #f6e3e0; color: #b3564a; border-color: #f0d0cb; }

        .panel-publicar {
            background: rgba(124, 144, 112, 0.08);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .campo-publicar { display: flex; flex-direction: column; gap: 4px; }
        .campo-publicar label {
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--chalk-dim);
        }
        .campo-publicar input, .campo-publicar select {
            font-family: 'Work Sans', sans-serif; font-size: 12.5px;
            padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
            background: #ffffff; color: var(--stone-900);
        }
        .panel-desox-alt { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--stone-900); }
        .panel-desox-alt[hidden] { display: none; }
        .panel-desox-alt label { display: flex; align-items: center; gap: 4px; font-weight: 600; cursor: pointer; }
        .estado-publicar { flex-basis: 100%; font-size: 12px; color: var(--chalk-dim); min-height: 16px; }
        .estado-publicar.ok { color: var(--moss-deep); font-weight: 700; }
        .estado-publicar.error { color: #b3564a; font-weight: 700; }

        @page { size: A4 portrait; margin: 8mm 15mm 15mm 15mm; }

        @media print {
            .cuerpo-app { padding: 0 !important; padding-top: 0mm !important; }
            body { background: #ffffff !important; padding: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .marca-agua-fondo { display: block !important; position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; transform: scale(0.88) !important; opacity: 0.20 !important; z-index: 0 !important; }
            .cabecera-principal-empresa { padding-top: 0 !important; margin-top: 0 !important; padding-bottom: 8px !important; margin-bottom: 20px !important; border-bottom: 2px solid #1c211e !important; display: flex !important; align-items: center !important; page-break-after: avoid !important; break-after: avoid !important; }
            .contenedor-titulo-principal { margin-top: 0 !important; }
            .eyebrow { margin-bottom: 4px !important; }
            .zona-botones, .btn-añadir-ejercicio, .btn-eliminar-parte, .zona-ordenar, th:last-child, td:last-child, .no-print { display: none !important; }
            .celda-editable, .celda-cabecera-editable, .input-titulo-gran-formato { border: none !important; color: #1c211e !important; font-size: 11px !important; }
            .input-titulo-gran-formato { font-size: 24px; }
            .eyebrow { color: #4d5c46 !important; }
            .eyebrow::before, .eyebrow::after { background: #4d5c46 !important; }
            .bloque-parte { background: rgba(247, 245, 239, 0.85) !important; border: none !important; border-left: 5px solid #4d5c46 !important; border-radius: 8px !important; padding: 8px 0px 2px 14px !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            .tabla-ejercicios tr { page-break-inside: avoid !important; break-inside: avoid !important; }
            .tabla-ejercicios th { border-bottom: 2px solid #4d5c46 !important; }
        }
    </style>
</head>
<body>

    <div id="vistaPrincipalApp" class="cuerpo-app">
        
        <div id="img-logo-fondo" class="marca-agua-fondo"></div>

        <div class="contenedor-entreno">
            <div class="cabecera-principal-empresa">
                <div class="contenedor-titulo-principal">
                    <div class="eyebrow">Kaska.Climb</div>
                    <input type="text" id="titulo-entreno-principal" class="input-titulo-gran-formato" placeholder="Pon aquí el título de tu tabla...">
                </div>
            </div>
            
            <div class="zona-botones">
                <button id="btn-nueva-parte" class="btn-principal">Añadir Nueva Parte</button>
                <button id="btn-exportar" class="btn-principal" onclick="exportarComoPDF()">Guardar como PDF</button>
                <button id="btn-descargar-json" class="btn-principal">Guardar Tabla Modificable</button>
                
                <input type="file" id="input-cargar-json" accept=".json" style="display: none;">
                <button id="btn-cargar-visual" class="btn-principal" onclick="document.getElementById('input-cargar-json').click()">Abrir Tabla Existente</button>

                <input type="file" id="input-unir-json" accept=".json" style="display: none;">
                <button id="btn-unir-visual" class="btn-principal" onclick="document.getElementById('input-unir-json').click()">Unir con Otra Tabla</button>

                <input type="file" id="input-cambiar-logo" accept="image/*" style="display: none;">
                <button id="btn-config-logo" class="btn-principal" onclick="document.getElementById('input-cambiar-logo').click()">Cambiar Logo de Fondo</button>
		        <a href="index.html" class="btn-inicio-sesiones no-print">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Inicio
                </a>
            </div>

            <div class="panel-publicar no-print">
                <div class="campo-publicar">
                    <label>Cliente</label>
                    <select id="publicarCliente"><option value="">Cargando clientes...</option></select>
                </div>
                <div class="campo-publicar">
                    <label>Mesociclo</label>
                    <select id="publicarMesociclo">
                        <option value="">— Elegir —</option>
                        <option value="REOX">REOX</option>
                        <option value="AERO">AERO</option>
                        <option value="DESOX">DESOX</option>
                        <option value="FMAX">FMAX</option>
                        <option value="GYM-FMAX">GYM-FMAX</option>
                        <option value="GYM-ANTAGONISTAS">GYM-ANTAGONISTAS</option>
                        <option value="TAPERING">TAPERING</option>
                    </select>
                </div>
                <div class="panel-desox-alt" id="panelDesoxAlternativa" hidden>
                    <span style="font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:0.06em; color:var(--chalk-dim);">Bloque integrado:</span>
                    <label><input type="radio" name="desoxAlternativa" value="traves" checked> Traves sin sueltas</label>
                    <label><input type="radio" name="desoxAlternativa" value="multibloque"> Multibloque</label>
                </div>
                <button id="btn-cargar-ultimo" class="btn-principal" type="button">Cargar último publicado</button>
                <button id="btn-publicar" class="btn-principal" type="button">Publicar sesión</button>
                <div class="estado-publicar" id="estadoPublicar"></div>
            </div>

            <div id="contenedor-partes"></div>
		
        </div>
    </div>

    <script src="libs/clientes-selector.js"></script>
    <script>
        // Comprobamos si la página se está viendo dentro de una vista previa (iframe),
        // ya que en ese caso el navegador bloquea window.print() por seguridad y no pasa nada al pulsar el botón.
        function exportarComoPDF() {
            const dentroDeIframe = (window.self !== window.top);
            if (dentroDeIframe) {
                alert('Para guardar como PDF, abre este archivo directamente en tu navegador (fuera de la vista previa) y vuelve a pulsar "Guardar como PDF".');
                return;
            }
            window.print();
        }

        const btnNuevaParte = document.getElementById('btn-nueva-parte');
        const contenedorPartes = document.getElementById('contenedor-partes');
        const inputTituloPrincipal = document.getElementById('titulo-entreno-principal');
        const btnDescargarJson = document.getElementById('btn-descargar-json');
        const inputCargarJson = document.getElementById('input-cargar-json');
        const btnCargarVisual = document.getElementById('btn-cargar-visual');
        const btnUnirVisual = document.getElementById('btn-unir-visual');
        const inputUnirJson = document.getElementById('input-unir-json');
        const btnConfigLogo = document.getElementById('btn-config-logo');
        const inputCambiarLogo = document.getElementById('input-cambiar-logo');

        let contadorPartes = 0;
        
        // Función centralizada para Auto-Guardado en LocalStorage
        function autoGuardar() {
            const datosEntreno = obtenerDatosEstructura();
            localStorage.setItem('kaska_sesion_auto', JSON.stringify(datosEntreno));
        }

        // Detecta cualquier cambio de escritura en los inputs y celdas editables para autoguardar
        document.addEventListener('input', (e) => {
            if (e.target.matches('.celda-editable, .celda-cabecera-editable, .input-titulo-gran-formato, .input-titulo, .input-descripcion')) {
                autoGuardar();
            }
        });

        function obtenerDatosEstructura() {
            const datosEntreno = { tituloPrincipal: inputTituloPrincipal.value, partes: [] };
            const elementos = contenedorPartes.querySelectorAll('.bloque-parte, .cabecera-principal-empresa');
            
            elementos.forEach(el => {
                if (el.classList.contains('cabecera-principal-empresa')) {
                    datosEntreno.partes.push({
                        tipo: 'cabecera_separadora',
                        tituloPrincipal: el.querySelector('.input-titulo-gran-formato').value
                    });
                } else {
                    const ejercicios = [];
                    el.querySelectorAll('.cuerpo-tabla-ejercicios tr').forEach(fila => {
                        const celdas = fila.querySelectorAll('.celda-editable');
                        if(celdas.length >= 3) {
                            ejercicios.push({
                                nombre: celdas[0].innerText,
                                series: celdas[1].innerText,
                                notas: celdas[2].innerText
                            });
                        }
                    });
                    datosEntreno.partes.push({
                        tipo: 'bloque_ejercicios',
                        titulo: el.querySelector('.input-titulo').innerText,
                        descripcion: el.querySelector('.input-descripcion').innerText,
                        ejercicios: ejercicios
                    });
                }
            });
            return datosEntreno;
        }

        // CREADOR DE CABECERAS (MODIFICADO PARA PERMITIR MOVER/BORRAR)
        function crearCabeceraUI(tituloTexto) {
            const div = document.createElement('div');
            div.className = 'cabecera-principal-empresa';
            div.innerHTML = `
                <div class="contenedor-titulo-principal">
                    <input type="text" class="input-titulo-gran-formato" value="${tituloTexto}">
                </div>
                <div class="zona-ordenar no-print" style="gap: 5px; align-items:center;">
                    <button class="btn-orden btn-subir-cabecera" title="Subir">▲</button>
                    <button class="btn-orden btn-bajar-cabecera" title="Bajar">▼</button>
                    <button class="btn-accion btn-eliminar btn-eliminar-cabecera" style="margin-left:5px;">✖</button>
                </div>
            `;
            contenedorPartes.appendChild(div);

            div.querySelector('.btn-eliminar-cabecera').addEventListener('click', () => { div.remove(); autoGuardar(); });
            div.querySelector('.btn-subir-cabecera').addEventListener('click', () => {
                const ant = div.previousElementSibling;
                if (ant) { contenedorPartes.insertBefore(div, ant); autoGuardar(); }
            });
            div.querySelector('.btn-bajar-cabecera').addEventListener('click', () => {
                const sig = div.nextElementSibling;
                if (sig) { contenedorPartes.insertBefore(sig, div); autoGuardar(); }
            });
            autoGuardar();
        }

        // CREADOR DE PARTES (MODIFICADO EL ORDENAMIENTO Y EL BORRADO)
        function crearParteUI(tituloVal = '', descripcionVal = '', ejerciciosLista = []) {
            contadorPartes++;
            const bloqueParte = document.createElement('div');
            bloqueParte.className = 'bloque-parte';
            
            bloqueParte.innerHTML = `
                <div class="cabecera-parte">
                    <div class="zona-ordenar">
                        <button class="btn-orden btn-subir-parte" title="Subir parte">▲</button>
                        <button class="btn-orden btn-bajar-parte" title="Bajar parte">▼</button>
                    </div>
                    <div class="input-titulo celda-cabecera-editable" contenteditable="true" placeholder="Ej: Parte ${contadorPartes} - Movilidad">${tituloVal}</div>
                    <div class="input-descripcion celda-cabecera-editable" contenteditable="true" placeholder="Explicación general de esta parte...">${descripcionVal}</div>
                    <button class="btn-accion btn-eliminar btn-eliminar-parte">Eliminar Parte</button>
                </div>
                <table class="tabla-ejercicios">
                    <thead>
                        <tr>
                            <th>Ejercicio</th>
                            <th>Series / Tiempo</th>
                            <th>Notas</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody class="cuerpo-tabla-ejercicios"></tbody>
                </table>
                <button class="btn-accion btn-añadir-ejercicio">＋ Añadir Ejercicio</button>
            `;
            
            contenedorPartes.appendChild(bloqueParte);
            const cuerpoTabla = bloqueParte.querySelector('.cuerpo-tabla-ejercicios');
            
            // CREADOR DE EJERCICIOS (MODIFICADO CON FLECHAS)
            function añadirFilaEjercicio(ej = {nombre:'', series:'', notas:''}) {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td class="celda-editable" contenteditable="true" placeholder="Nombre del ejercicio">${ej.nombre}</td>
                    <td class="celda-editable" contenteditable="true" placeholder="Ej: 3x10">${ej.series}</td>
                    <td class="celda-editable" contenteditable="true" placeholder="Notas...">${ej.notas}</td>
                    <td style="white-space: nowrap;">
                        <button class="btn-orden btn-subir-ej" title="Subir ejercicio">▲</button>
                        <button class="btn-orden btn-bajar-ej" title="Bajar ejercicio">▼</button>
                        <button class="btn-accion btn-eliminar btn-eliminar-ejercicio">✖</button>
                    </td>
                `;
                cuerpoTabla.appendChild(fila);
                
                fila.querySelector('.btn-eliminar-ejercicio').addEventListener('click', () => { fila.remove(); autoGuardar(); });
                fila.querySelector('.btn-subir-ej').addEventListener('click', () => {
                    const ant = fila.previousElementSibling;
                    if (ant) { fila.parentNode.insertBefore(fila, ant); autoGuardar(); }
                });
                fila.querySelector('.btn-bajar-ej').addEventListener('click', () => {
                    const sig = fila.nextElementSibling;
                    if (sig) { fila.parentNode.insertBefore(sig, fila); autoGuardar(); }
                });
                autoGuardar();
            }

            bloqueParte.querySelector('.btn-subir-parte').addEventListener('click', () => {
                const ant = bloqueParte.previousElementSibling;
                if (ant) { contenedorPartes.insertBefore(bloqueParte, ant); autoGuardar(); }
            });

            bloqueParte.querySelector('.btn-bajar-parte').addEventListener('click', () => {
                const sig = bloqueParte.nextElementSibling;
                if (sig) { contenedorPartes.insertBefore(sig, bloqueParte); autoGuardar(); }
            });

            bloqueParte.querySelector('.btn-añadir-ejercicio').addEventListener('click', () => añadirFilaEjercicio());
            bloqueParte.querySelector('.btn-eliminar-parte').addEventListener('click', () => { bloqueParte.remove(); autoGuardar(); });

            if(ejerciciosLista.length > 0) {
                ejerciciosLista.forEach(ej => añadirFilaEjercicio(ej));
            } else {
                añadirFilaEjercicio();
            }
            autoGuardar();
        }

        function renderizarTodaLaTabla(appDatos) {
            contenedorPartes.innerHTML = '';
            contadorPartes = 0;
            inputTituloPrincipal.value = appDatos.tituloPrincipal || '';
            
            if(appDatos.partes && appDatos.partes.length > 0) {
                appDatos.partes.forEach(p => {
                    if (p.tipo === 'cabecera_separadora') {
                        crearCabeceraUI(p.tituloPrincipal);
                    } else {
                        crearParteUI(p.titulo, p.descripcion, p.ejercicios);
                    }
                });
            } else {
                crearParteUI();
            }
        }

        btnNuevaParte.addEventListener('click', () => crearParteUI());

        // LÓGICA ORIGINAL INTACTA
        btnDescargarJson.addEventListener('click', async () => {
            const datos = obtenerDatosEstructura();
            const textoJson = JSON.stringify(datos, null, 2);
            const nombreSugerido = (inputTituloPrincipal.value.trim() || 'tabla-entrenamiento').toLowerCase().replace(/[^a-z0-9]/gi, '_') + '.json';

            const blob = new Blob([textoJson], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const enlace = document.createElement('a');
            enlace.href = url;
            enlace.download = nombreSugerido;
            
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            setTimeout(() => URL.revokeObjectURL(url), 100);
        });

        inputCargarJson.addEventListener('change', (e) => {
            const archivos = e.target.files;
            if (!archivos || archivos.length === 0) return;
            const lector = new FileReader();
            lector.onload = function(evt) {
                try {
                    renderizarTodaLaTabla(JSON.parse(evt.target.result));
                    inputCargarJson.value = '';
                    autoGuardar(); // Guardar lo cargado
                } catch (error) { alert('El archivo seleccionado no es válido.'); }
            };
            lector.readAsText(archivos[0]);
        });

        inputUnirJson.addEventListener('change', (e) => {
            const archivos = e.target.files;
            if (!archivos || archivos.length === 0) return;
            const lector = new FileReader();
            lector.onload = function(evt) {
                try {
                    const datosNuevos = JSON.parse(evt.target.result);
                    if(datosNuevos.partes && datosNuevos.partes.length > 0) {
                        if (datosNuevos.tituloPrincipal && datosNuevos.tituloPrincipal !== inputTituloPrincipal.value) {
                            crearCabeceraUI(datosNuevos.tituloPrincipal);
                        }
                        datosNuevos.partes.forEach(p => {
                            if (p.tipo === 'cabecera_separadora') {
                                crearCabeceraUI(p.tituloPrincipal);
                            } else {
                                crearParteUI(p.titulo, p.descripcion, p.ejercicios);
                            }
                        });
                    }
                    inputUnirJson.value = '';
                    autoGuardar(); // Guardar al unir
                } catch (error) { alert('No se pudo unir la tabla.'); }
            };
            lector.readAsText(archivos[0]);
        });

        inputCambiarLogo.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const lectorImg = new FileReader();
                lectorImg.onload = function(e) {
                    localStorage.setItem('empresa_logo_real', e.target.result);
                    document.getElementById('img-logo-fondo').style.backgroundImage = "url('" + e.target.result + "')";
                };
                lectorImg.readAsDataURL(this.files[0]);
            }
        });

        /* ================= PUBLICAR EN LA NUBE (para el motor genérico de sesión) ================= */
        const inputPublicarCliente = document.getElementById('publicarCliente');
        const selectPublicarMesociclo = document.getElementById('publicarMesociclo');
        const panelDesoxAlt = document.getElementById('panelDesoxAlternativa');
        const estadoPublicar = document.getElementById('estadoPublicar');

        cargarSelectorClientes(inputPublicarCliente);

        selectPublicarMesociclo.addEventListener('change', () => {
            panelDesoxAlt.hidden = selectPublicarMesociclo.value !== 'DESOX';
        });

        function mostrarEstadoPublicar(texto, clase) {
            estadoPublicar.textContent = texto;
            estadoPublicar.classList.remove('ok', 'error');
            if (clase) estadoPublicar.classList.add(clase);
        }

        document.getElementById('btn-cargar-ultimo').addEventListener('click', async () => {
            const cliente = inputPublicarCliente.value.trim();
            const mesociclo = selectPublicarMesociclo.value;
            if (!cliente || !mesociclo) {
                alert('Indica el cliente y el mesociclo antes de cargar la última versión publicada.');
                return;
            }
            mostrarEstadoPublicar('Cargando última versión publicada...', null);
            try {
                const qs = new URLSearchParams({ cliente, mesociclo });
                const res = await fetch('/api/ultima-sesion-publicada?' + qs.toString());
                const data = await res.json();
                if (data.success) {
                    renderizarTodaLaTabla(data.sesion);
                    autoGuardar();
                    mostrarEstadoPublicar(`✓ Cargada la última sesión publicada de ${mesociclo} para ${cliente} (era del ${data.fecha}). Edítala y publica de nuevo cuando esté lista.`, 'ok');
                } else {
                    mostrarEstadoPublicar(data.error || 'No se encontró ninguna versión previa — empieza desde la plantilla que tengas cargada.', 'error');
                }
            } catch (e) {
                mostrarEstadoPublicar('Error de red: ' + e.message, 'error');
            }
        });

        document.getElementById('btn-publicar').addEventListener('click', async () => {
            const cliente = inputPublicarCliente.value.trim();
            const mesociclo = selectPublicarMesociclo.value;
            if (!cliente || !mesociclo) {
                alert('Indica cliente y mesociclo antes de publicar.');
                return;
            }
            // La fecha no se usa para enlazar con Semanas.html (eso va por
            // cliente+mesociclo, gana siempre la versión más reciente) — se
            // manda solo porque la columna la exige, con la fecha de hoy.
            const hoy = new Date();
            const fecha = `${String(hoy.getDate()).padStart(2,'0')}/${String(hoy.getMonth()+1).padStart(2,'0')}/${hoy.getFullYear()}`;

            let datos = obtenerDatosEstructura();

            // DESOX: Traves sin sueltas y Multibloque son alternativas — solo se publica la elegida.
            if (mesociclo === 'DESOX') {
                const elegido = document.querySelector('input[name="desoxAlternativa"]:checked');
                if (elegido) {
                    const excluirTitulo = elegido.value === 'traves' ? 'multibloque' : 'traves sin sueltas';
                    datos = {
                        ...datos,
                        partes: datos.partes.filter(p =>
                            !(p.tipo === 'bloque_ejercicios' && (p.titulo || '').trim().toLowerCase() === excluirTitulo)
                        ),
                    };
                }
            }

            mostrarEstadoPublicar('Publicando...', null);
            try {
                const res = await fetch('/api/publicar-sesion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente, fecha, mesociclo, sesion: datos }),
                });
                const data = await res.json();
                if (data.success) {
                    mostrarEstadoPublicar(`✓ Publicado para ${cliente} — ${fecha} (${mesociclo}). El motor genérico ya puede leerlo.`, 'ok');
                } else {
                    mostrarEstadoPublicar('✗ ' + (data.error || 'Error al publicar.'), 'error');
                }
            } catch (e) {
                mostrarEstadoPublicar('✗ Error de red: ' + e.message, 'error');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const logoGuardado = localStorage.getItem('empresa_logo_real');
            if(logoGuardado) {
                document.getElementById('img-logo-fondo').style.backgroundImage = "url('" + logoGuardado + "')";
            }
            
            // Lógica de carga del autoguardado al entrar a la página
            const autoGuardado = localStorage.getItem('kaska_sesion_auto');
            if (autoGuardado) {
                try {
                    renderizarTodaLaTabla(JSON.parse(autoGuardado));
                } catch (e) {
                    crearParteUI();
                }
            } else {
                crearParteUI();
            }
        });
    </script>
</body>
</html>
