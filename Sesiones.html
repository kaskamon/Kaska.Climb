<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaska.Climb">
<link rel="apple-touch-icon" href="/logo-192.png">

<meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaska.Climb | Sesiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===================================================
           DISEÑO EXCLUSIVO PREMIUM COMPACTO — KASKA.CLIMB
           =================================================== */
        :root{
            --stone-900:#1c211e;
            --stone-700:#333b34;
            --chalk-dim:#6b7268;
            --line:#ddd9cb;
            --paper-dim:#f7f5ef;
            --moss:#7c9070;
            --moss-light:#a7bd98;
            --moss-deep:#4d5c46;
            --danger:#b5453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--stone-900); 
            padding: 16px 30px 30px 30px; 
            -webkit-font-smoothing: antialiased;
            background-color: #ffffff;
            position: relative;
        }

        .eyebrow{
            display:inline-flex; align-items:center; gap:10px;
            font-size:11px; letter-spacing:3px; font-weight:700;
            color:var(--moss-deep); text-transform:uppercase; margin-bottom:8px;
        }
        .eyebrow::before, .eyebrow::after{ content:""; width:18px; height:2px; background:var(--moss-deep); }

        .cuerpo-app {
            position: relative;
            min-height: 99vh;
        }

        .marca-agua-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 99vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; 
            transform: scale(0.88); 
            opacity: 0.35; 
            z-index: 0; 
            pointer-events: none; 
        }

        .contenedor-entreno {
            position: relative;
            z-index: 1;
        }

        .cabecera-principal-empresa {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            padding-top: 0px; 
            margin-top: 0px;  
            margin-bottom: 20px; 
            gap: 40px;
            padding-bottom: 12px; 
            border-bottom: 2px solid var(--moss-deep); 
        }

        #contenedor-partes .cabecera-principal-empresa {
            margin-top: 20px; 
        }

        .contenedor-titulo-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 2px; 
        }

        .input-titulo-gran-formato {
            width: 100%;
            font-family: 'Anton', sans-serif;
            font-size: 30px; 
            font-weight: 400;
            text-transform: uppercase;
            border: none;
            background: transparent;
            color: var(--stone-900);
            letter-spacing: 0.3px;
            outline: none;
            line-height: 1.15;
        }

        .zona-botones {
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .estado-guardar {
            font-size: 11px;
            font-weight: 700;
            color: var(--chalk-dim);
        }
        .estado-guardar.ok { color: var(--moss-deep); }
        .estado-guardar.error { color: var(--danger); }

        /* Formato unificado de botones */
        .btn-principal {
            color: #ffffff;
            background-color: var(--stone-900);
            padding: 8px 14px; 
            border: 1px solid var(--stone-900);
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Work Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-size: 11px; 
            transition: all 0.15s ease-in-out;
        }

        .btn-principal:hover {
            background-color: var(--moss);
            border-color: var(--moss);
        }

        .btn-inicio-sesiones {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--stone-900);
            color: #ffffff;
            border: 1px solid var(--stone-900);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Work Sans', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.15s ease-in-out;
        }

        .btn-inicio-sesiones:hover {
            background: var(--moss);
            color: #ffffff;
            border-color: var(--moss);
        }

        .bloque-parte {
            background: rgba(247, 245, 239, 0.85); 
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px 4px 16px; 
            margin-bottom: 12px; 
            border-left: 5px solid var(--moss-deep); 
            position: relative;
            overflow: hidden; 
        }

        .cabecera-parte {
            display: flex;
            gap: 15px;
            margin-bottom: 8px; 
            align-items: center; 
            background-color: rgba(124, 144, 112, 0.1); 
            padding: 6px 12px; 
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .celda-cabecera-editable {
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            font-size: 13px;
        }

        .input-titulo {
            font-size: 14px; 
            font-weight: 800;
            flex: 2;
            color: var(--stone-900);
            letter-spacing: 0.02em;
        }

        .input-descripcion {
            flex: 4;
            color: var(--chalk-dim);
            font-size: 12px; 
            font-style: italic;
            border-left: 1px solid var(--line);
            padding-left: 12px;
            background: transparent;
        }

        .celda-cabecera-editable:focus, .celda-editable:focus, .input-titulo-gran-formato:focus {
            box-shadow: 0 1px 0 0 var(--moss); 
        }

        .zona-ordenar {
            display: flex;
            gap: 2px;
        }

        .btn-orden {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            color: var(--chalk-dim);
            transition: color 0.1s ease;
        }

        .btn-orden:hover { color: var(--moss-deep); }

        .tabla-ejercicios {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0px; 
            table-layout: fixed; 
            background: transparent;
        }

        .tabla-ejercicios th {
            color: var(--stone-900);
            padding: 4px 4px; 
            text-align: left;
            font-size: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 800;
            border-bottom: 2px solid var(--moss-deep); 
        }

        /* MODIFICADO LIGERAMENTE PARA QUE QUEPAN LAS FLECHAS */
        .tabla-ejercicios th:nth-child(1), .tabla-ejercicios td:nth-child(1) { width: 30%; } 
        .tabla-ejercicios th:nth-child(2), .tabla-ejercicios td:nth-child(2) { width: 25%; } 
        .tabla-ejercicios th:nth-child(3), .tabla-ejercicios td:nth-child(3) { width: 30%; } 
        .tabla-ejercicios th:nth-child(4), .tabla-ejercicios td:nth-child(4) { width: 15%; text-align: right; } 

        .tabla-ejercicios td {
            padding: 5px 4px 5px 0; 
            vertical-align: top; 
        }

        .celda-editable {
            outline: none;
            font-size: 12px; 
            white-space: pre-wrap;       
            word-wrap: break-word;       
            word-break: break-word;
            min-height: 18px;
        }

        .celda-editable:empty:before, .celda-cabecera-editable:empty:before {
            content: attr(placeholder);
            color: #a8a294;
            font-weight: normal;
        }

        .tabla-ejercicios tr td:first-child {
            font-weight: 600;
            color: var(--stone-900);
        }

        .btn-accion {
            padding: 4px 8px; 
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            font-size: 10px; 
        }

        .btn-añadir-ejercicio {
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--stone-900);
            border: 1px solid var(--line);
        }

        .btn-añadir-ejercicio:hover { background-color: var(--moss); color: #ffffff; border-color: var(--moss); }
        .btn-eliminar { background-color: transparent; color: #a8a294; text-align: right; }
        .btn-eliminar:hover { color: #b3564a; }
        .btn-eliminar-parte { background-color: rgba(255, 255, 255, 0.7); color: var(--chalk-dim); border: 1px solid var(--line); }
        .btn-eliminar-parte:hover { background-color: #f6e3e0; color: #b3564a; border-color: #f0d0cb; }

        .selector-plantilla {
            background-color: var(--stone-900);
            color: #ffffff;
            padding: 8px 14px;
            border: 1px solid var(--stone-900);
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Work Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-size: 11px;
        }
        .selector-plantilla:hover { background-color: var(--moss); border-color: var(--moss); }
    </style>
</head>
<body>

    <div id="vistaPrincipalApp" class="cuerpo-app">
        
        <div id="img-logo-fondo" class="marca-agua-fondo"></div>

        <div class="contenedor-entreno">
            <div class="cabecera-principal-empresa">
                <div class="contenedor-titulo-principal">
                    <div class="eyebrow">Kaska.Climb</div>
                    <input type="text" id="titulo-entreno-principal" class="input-titulo-gran-formato" placeholder="Pon aquí el título de tu tabla...">
                </div>
            </div>
            
            <div class="zona-botones">
                <button id="btn-nueva-sesion" class="btn-principal">Crear Nueva Sesión</button>
                <button id="btn-nueva-parte" class="btn-principal">Añadir Nueva Parte</button>
                <button id="btn-guardar" class="btn-principal">Guardar</button>
                <div class="estado-guardar" id="estadoGuardar"></div>

                <select id="selectorPlantilla" class="selector-plantilla">
                    <option value="">Abrir tabla existente…</option>
                </select>

		        <a href="index.html" class="btn-inicio-sesiones">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Inicio
                </a>
            </div>

            <div id="contenedor-partes"></div>
		
        </div>
    </div>

    <script src="libs/editor-sesion.js"></script>
    <script>
        const btnNuevaSesion = document.getElementById('btn-nueva-sesion');
        const btnNuevaParte = document.getElementById('btn-nueva-parte');
        const btnGuardar = document.getElementById('btn-guardar');
        const estadoGuardar = document.getElementById('estadoGuardar');
        const selectorPlantilla = document.getElementById('selectorPlantilla');

        function escapeHtml(str) {
            return (str == null ? '' : String(str)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Función centralizada para Auto-Guardado en LocalStorage
        function autoGuardar() {
            const datosEntreno = obtenerDatosEstructura();
            localStorage.setItem('kaska_sesion_auto', JSON.stringify(datosEntreno));
        }

        btnNuevaParte.addEventListener('click', () => crearParteUI());

        // Empieza una tabla en blanco de verdad, desenganchada de la
        // plantilla que estuviera cargada — sin esto, "Guardar" seguía
        // sobrescribiendo la última plantilla abierta para siempre (incluso
        // tras recargar la página, por el localStorage), sin forma de crear
        // una completamente nueva salvo borrando datos del navegador a mano.
        btnNuevaSesion.addEventListener('click', () => {
            if (!confirm('Esto vacía la tabla actual (lo ya guardado como plantilla no se toca). ¿Continuar?')) return;
            renderizarTodaLaTabla({ tituloPrincipal: '', partes: [] });
            fijarPlantillaActual(null);
            mostrarEstadoGuardar('', null);
            autoGuardar();
        });

        function mostrarEstadoGuardar(texto, clase) {
            estadoGuardar.textContent = texto;
            estadoGuardar.classList.remove('ok', 'error');
            if (clase) estadoGuardar.classList.add(clase);
        }

        // -- Guardar / Abrir Tabla Existente, como filas de una pestaña
        // propia del Sheet (Plantillas_Sesiones) en vez de archivos sueltos --
        // Mismo mecanismo en cualquier dispositivo/navegador (a diferencia de
        // la File System Access API de antes, que ni siquiera existe en
        // Android).
        //
        // "Guardar" sobrescribe la plantilla de la que vino la tabla (la que
        // se abrió con el desplegable), no la que diga el título — el título
        // es solo el nombre visible dentro de la sesión (en varias plantillas
        // antiguas siempre pone "CALENTAMIENTO", el título del primer bloque,
        // nada que ver con qué plantilla es). Si no se ha abierto ninguna
        // (tabla nueva), usa el título para crear una plantilla nueva la
        // primera vez, y a partir de ahí sigue sobrescribiendo esa misma.
        // Se recuerda en localStorage para que sobreviva a un refresco de página.
        let nombrePlantillaActual = localStorage.getItem('kaska_plantilla_actual') || null;

        function fijarPlantillaActual(nombre) {
            nombrePlantillaActual = nombre;
            if (nombre) localStorage.setItem('kaska_plantilla_actual', nombre);
            else localStorage.removeItem('kaska_plantilla_actual');
        }

        async function cargarListaPlantillas() {
            try {
                const res = await fetch('/api/plantillas-sesion');
                const data = await res.json();
                if (!data.success) return;
                selectorPlantilla.innerHTML = '<option value="">Abrir tabla existente…</option>' +
                    data.plantillas.map(p => `<option value="${escapeHtml(p.nombre)}">${escapeHtml(p.nombre)}</option>`).join('');
            } catch (error) { /* el desplegable se queda solo con la opción por defecto */ }
        }

        btnGuardar.addEventListener('click', async () => {
            let nombre = nombrePlantillaActual;
            if (!nombre) {
                nombre = inputTituloPrincipal.value.trim();
                if (!nombre) {
                    mostrarEstadoGuardar('Ponle un título a la tabla antes de guardar.', 'error');
                    return;
                }
            }
            mostrarEstadoGuardar('Guardando...', null);
            try {
                const res = await fetch('/api/plantillas-sesion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, datos: obtenerDatosEstructura() }),
                });
                const data = await res.json();
                if (data.success) {
                    fijarPlantillaActual(nombre);
                    mostrarEstadoGuardar(`Guardado ✓ (${nombre})`, 'ok');
                    cargarListaPlantillas();
                } else {
                    mostrarEstadoGuardar(data.error || 'No se pudo guardar.', 'error');
                }
            } catch (error) {
                mostrarEstadoGuardar('Error de red: ' + error.message, 'error');
            }
        });

        selectorPlantilla.addEventListener('change', async () => {
            const nombre = selectorPlantilla.value;
            if (!nombre) return;
            mostrarEstadoGuardar('Cargando...', null);
            try {
                const res = await fetch('/api/plantillas-sesion?' + new URLSearchParams({ nombre }));
                const data = await res.json();
                if (data.success) {
                    renderizarTodaLaTabla(data.datos);
                    fijarPlantillaActual(nombre);
                    autoGuardar(); // Guardar lo cargado
                    mostrarEstadoGuardar(`Editando: ${nombre}`, null);
                } else {
                    mostrarEstadoGuardar(data.error || 'No se pudo cargar esa plantilla.', 'error');
                }
            } catch (error) {
                mostrarEstadoGuardar('Error de red: ' + error.message, 'error');
            }
            selectorPlantilla.value = ''; // vuelve al placeholder, para poder reabrir la misma otra vez
        });

        window.addEventListener('DOMContentLoaded', () => {
            cargarListaPlantillas();

            const logoGuardado = localStorage.getItem('empresa_logo_real');
            if(logoGuardado) {
                document.getElementById('img-logo-fondo').style.backgroundImage = "url('" + logoGuardado + "')";
            }

            // Lógica de carga del autoguardado al entrar a la página
            const autoGuardado = localStorage.getItem('kaska_sesion_auto');
            if (autoGuardado) {
                try {
                    renderizarTodaLaTabla(JSON.parse(autoGuardado));
                } catch (e) {
                    crearParteUI();
                }
            } else {
                crearParteUI();
            }
        });
    </script>
</body>
</html>
