<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="libs/clientes-selector.js"></script>
<script src="libs/mesociclos-config.js"></script>
<script src="libs/planificacion-semanas.js"></script>
<style>
  :root{
    --stone-900:#1c211e; --stone-800:#262d28; --stone-700:#333b34;
    --chalk:#f2ede1; --chalk-dim:#c9c3b4; --chalk-faint:#8d9187;
    --moss:#7c9070; --moss-light:#a7bd98; --moss-deep:#4d5c46;
    --amber:#c99a5b; --danger:#c9705b;
    --meso-fmax:#c17c74; --meso-reox:#7c9070; --meso-desox:#70908c; --meso-aero:#93859e; --meso-tapering:#c99a5b;
    --line:rgba(242,237,225,0.10); --line-strong:rgba(242,237,225,0.16);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:#494d4b; color:var(--chalk); font-family:'Work Sans', sans-serif; }
  h1,h2,h3{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.4px; margin:0; }

  .topbar{ position:sticky; top:0; z-index:40; background:rgba(28,33,30,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-strong); }
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px; font-weight:700; color:var(--moss-light); text-transform:uppercase; }
  .eyebrow::before{ content:""; width:16px; height:2px; background:var(--moss-light); }
  .brand h1{ font-size:22px; }
  .icon-btn{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; transition:all .2s ease;
  }
  .icon-btn:hover{ background:var(--moss); border-color:var(--moss); color:var(--stone-900); }
  .icon-btn:disabled{ opacity:0.4; cursor:default; pointer-events:none; }

  .wrap-campana{ position:relative; }
  /* Punto verde (no un número) en la esquina de la campana, a la altura donde
     irían unas comillas de apertura — la propia campana también se pone en
     verde mientras haya alguna notificación sin leer; vuelve a su aspecto
     normal (el mismo de siempre) en cuanto no queda ninguna. */
  #btnNotificaciones.tiene-nuevas{ color:var(--moss-light); border-color:var(--moss-light); }
  .badge-notif{
    position:absolute; top:-3px; right:-3px; width:9px; height:9px;
    background:var(--moss-light); border-radius:50%; border:2px solid var(--stone-800);
  }
  .badge-notif[hidden]{ display:none; }
  .panel-notif{
    display:none; position:absolute; top:calc(100% + 10px); right:0; z-index:50; width:340px; max-height:420px;
    overflow-y:auto; background:var(--stone-800); border:1px solid var(--line-strong); border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4); padding:6px;
  }
  .panel-notif.abierto{ display:block; }
  .panel-notif .cab-notif{ padding:10px 12px 8px; font-size:11px; font-weight:800; letter-spacing:0.6px; text-transform:uppercase; color:var(--chalk-faint); }
  .panel-notif .cab-notif:not(:first-child){ margin-top:6px; border-top:1px solid var(--line-strong); padding-top:14px; }
  .fila-notif{
    padding:10px 12px; border-radius:9px; font-size:12.5px; cursor:pointer;
    border:none; background:none; width:100%; text-align:left; font-family:inherit; display:block;
  }
  .fila-notif:hover{ background:rgba(242,237,225,0.06); }
  .fila-notif + .fila-notif{ margin-top:2px; }
  .fila-notif.no-leida{ background:rgba(124,144,112,0.10); }
  .fila-notif.no-leida:hover{ background:rgba(124,144,112,0.16); }
  .fila-notif .linea1{ font-weight:700; color:var(--chalk); }
  .fila-notif.no-leida .linea1{ color:var(--moss-light); font-weight:800; }
  .fila-notif .linea2{ color:var(--chalk-faint); font-size:11px; margin-top:2px; }
  /* Notificación de "cliente pasó a Inactivo" o "vence esta semana" — mismo
     patrón que las de sesión, pero en ámbar en vez de verde: no son una
     actividad positiva, son algo que igual conviene revisar (¿baja real, o
     hay que renovarle?). */
  .fila-notif.tipo-inactivo.no-leida, .fila-notif.tipo-vence.no-leida{ background:rgba(201,154,91,0.12); }
  .fila-notif.tipo-inactivo.no-leida:hover, .fila-notif.tipo-vence.no-leida:hover{ background:rgba(201,154,91,0.18); }
  .fila-notif.tipo-inactivo.no-leida .linea1, .fila-notif.tipo-vence.no-leida .linea1{ color:var(--amber); }
  .vacio-notif{ padding:24px 14px; text-align:center; color:var(--chalk-faint); font-size:12.5px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
  .cabecera-pagina{ margin-bottom:22px; }
  .cabecera-pagina h2{ font-size:26px; }
  .cabecera-pagina p{ color:var(--chalk-dim); font-size:13.5px; margin:6px 0 0; max-width:64ch; }

  .card{ background:rgba(38,45,40,0.55); border:1px solid var(--line-strong); border-radius:18px; backdrop-filter:blur(8px); padding:26px 28px 30px; }

  .selector-fila{ display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; margin-bottom:26px; }
  .selector-cliente{ display:flex; flex-direction:column; gap:6px; }
  .grupo-variable-exportar{ display:flex; align-items:flex-end; gap:10px; }
  .selector-cliente label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--chalk-faint); }
  .selector-cliente select{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    border-radius:10px; padding:11px 14px; font-size:13.5px; font-weight:600; min-width:230px; font-family:inherit;
  }
  .tabs-meso{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-meso{
    font-size:11.5px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase;
    padding:9px 15px; border-radius:9px; border:1px solid var(--line-strong); color:var(--chalk-dim);
    cursor:pointer; transition:all .15s ease; background:none; font-family:inherit;
  }
  .tab-meso.activo{ color:var(--stone-900); border-color:transparent; }

  .estado-panel{ color:var(--chalk-dim); font-size:13px; padding:30px 0; text-align:center; }

  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .stat-tile{ background:var(--stone-800); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat-tile .k{ font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--chalk-faint); }
  .stat-tile .v{ font-family:'Anton',sans-serif; font-size:26px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-tile .v small{ font-family:'Work Sans',sans-serif; font-size:13px; font-weight:700; color:var(--chalk-faint); margin-left:3px; }
  .stat-tile .delta{ font-size:11.5px; font-weight:700; margin-top:4px; }
  .stat-tile .delta.up{ color:var(--moss-light); }
  .stat-tile .delta.down{ color:var(--danger); }

  .chart-shell{ background:var(--stone-800); border:1px solid var(--line); border-radius:16px; padding:22px 22px 12px; margin-bottom:26px; }
  .chart-shell .leyenda{ display:flex; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .leyenda .item{
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--chalk-dim); font-weight:600;
    background:none; border:1px solid var(--line-strong); border-radius:99px; padding:5px 12px 5px 9px;
    cursor:pointer; font-family:inherit; transition:all .15s ease;
  }
  .leyenda .item:hover{ border-color:var(--chalk-faint); }
  .leyenda .item.off{ color:var(--chalk-faint); opacity:0.55; }
  .leyenda .item.off .sw{ opacity:0.4; }
  .leyenda .sw{ width:14px; height:3px; border-radius:2px; flex:0 0 auto; }
  .chart-holder{ position:relative; }
  .chart-holder svg{ display:block; width:100%; height:auto; overflow:visible; }
  .grafica .eje-label{ font-size:10.5px; fill:var(--chalk-faint); font-family:'Work Sans',sans-serif; }
  .grafica .grid-linea{ stroke:rgba(242,237,225,0.08); stroke-width:1; }
  .grafica .punto-final{ stroke:var(--stone-800); stroke-width:2; }

  .tabla-datos-wrap{ overflow-x:auto; }
  table.tabla-datos{ width:100%; border-collapse:collapse; }
  table.tabla-datos th{ text-align:left; font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--chalk-faint); font-weight:700; padding:10px 14px; white-space:nowrap; border-bottom:1px solid var(--line-strong); }
  table.tabla-datos td{ padding:10px 14px; font-size:12.5px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.tabla-datos td.no-entrenada{ color:var(--chalk-faint); font-style:italic; }
  .nota-marcador{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase;
    color:var(--moss-light); background:rgba(124,144,112,0.14); border:1px solid rgba(124,144,112,0.35);
    border-radius:20px; padding:3px 9px; cursor:help;
  }
  table.tabla-datos tbody tr:last-child td{ border-bottom:none; }

  /* Informe imprimible (botón "Exportar") — oculto en pantalla, se rellena
     justo antes de llamar a window.print() y solo se muestra dentro de
     @media print, reutilizando los mismos pintarPanelX() que la vista
     interactiva (misma factura visual, sin duplicar el dibujado). */
  #areaImpresion{ display:none; }
  /* Franja oscura como la del topbar de la propia app — se saca del padding
     de #areaImpresion con márgenes negativos para que llegue de borde a
     borde de la página, en vez de quedar como un bloque más flotando sobre
     el fondo claro. Márgenes negativos ajustados al padding actual de
     #areaImpresion (14mm arriba, 10mm a los lados) para que siga llegando
     justo al borde; padding reducido para que la franja sea más fina. */
  #areaImpresion .marca-informe{
    background:rgba(28,33,30,0.92); margin:-14mm -10mm 14px; padding:5mm 10mm 4mm;
  }
  #areaImpresion .marca-informe .eyebrow{ margin-bottom:6px; }
  #areaImpresion .marca-informe h4{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.4px; font-size:17px; color:var(--chalk-dim); margin:0; }
  #areaImpresion h1{ font-size:28px; margin-bottom:20px; }
  #areaImpresion h1 span{ color:var(--moss); }
  /* El color real lo pone inline cada sección (uno por mesociclo, vía
     MESO_COLORS) — aquí solo el tratamiento común: caja resaltada con
     borde de color a la izquierda, en vez de un simple título con una
     línea gris encima. */
  #areaImpresion h2{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:19px;
    margin:0 0 16px; padding:11px 16px; border-left:5px solid; border-radius:8px;
    background:rgba(0,0,0,0.16);
  }
  #areaImpresion .seccion-impresion:not(:first-of-type){ margin-top:28px; }
  #areaImpresion h2 .meso-rango{
    font-family:'Work Sans',sans-serif; font-weight:600; font-size:12.5px;
    text-transform:none; letter-spacing:0; color:var(--chalk-faint);
  }
  #areaImpresion h3{ font-family:'Work Sans',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.4px; text-transform:uppercase; color:var(--chalk-dim); margin:0 0 10px; }
  #areaImpresion .bloque-impresion{ margin-bottom:24px; }

  @media print {
    /* margin:0 — @page solo puede PEDIR más margen del mínimo que el
       dispositivo/impresora ya reserva, nunca menos. En tablets (impresión
       nativa de iOS/Android) ese mínimo no se puede quitar desde CSS por
       mucho margen que se pida aquí; dejarlo en 0 evita sumar 16mm extra
       de blanco encima del mínimo que el propio dispositivo ya fuerza. El
       espacio visual real lo da el padding de #areaImpresion de abajo. */
    @page { size: landscape; margin: 0; }
    /* Mismo fondo y colores oscuros que la app en pantalla — por defecto el
       navegador imprime sin fondos/colores ("ahorro de tinta"), así que hay
       que pedírselo explícitamente o el informe saldría en blanco. */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body > *:not(#areaImpresion){ display:none !important; }
    body{ background:#494d4b; margin:0; }
    /* Con @page en 0, este padding es ahora el único margen visual real
       entre el fondo oscuro y el borde de la página (antes lo daba @page,
       pero ese margen no se puede bajar del mínimo que ya reserva cada
       dispositivo, así que sumaba blanco de más en vez de restarlo). */
    #areaImpresion{ display:block; background:#494d4b; padding:14mm 10mm; }
    /* Nada de "page-break-before:always" por sección ni "avoid" sobre todo
       el bloque: con una tabla larga (muchas sesiones) dentro, forzar a que
       ni la sección ni el bloque se corten empuja TODO a la página
       siguiente en cuanto no cabe entero, dejando la anterior casi en
       blanco. Solo se protege lo que de verdad no puede partirse a media
       altura (el propio gráfico y las 4 casillas de estadísticas) — la
       tabla, en cambio, puede fluir con normalidad entre páginas, con cada
       fila intacta. */
    /* page-break-after:avoid en las casillas y el gráfico: si al llegar a
       ese punto no queda hueco para empezar también la tabla justo debajo,
       el navegador mueve el grupo entero (casillas + gráfico + arranque de
       tabla) a la página siguiente en vez de dejar el gráfico solo al
       final de una página y la tabla arrancando sola en la siguiente. Es
       un "evitar si se puede", no un salto forzado — por eso no reproduce
       el problema de páginas casi en blanco que dio el page-break-before
       a saco de antes. */
    .chart-shell{ page-break-inside:avoid; page-break-after:avoid; }
    .stat-tiles{ page-break-inside:avoid; page-break-after:avoid; }
    .bloque-impresion > h3{ page-break-after:avoid; }
    table.tabla-datos tr{ page-break-inside:avoid; }
    /* Orden en impresión = mismo orden que en pantalla (casillas, gráfico,
       tabla). No se reordena por columnas: solo se protege lo que no puede
       partirse a media altura (gráfico y casillas); la tabla fluye normal
       entre páginas, con cada fila intacta. */
    /* Cuando una tabla larga sí se parte entre dos páginas, la cabecera
       (thead) no se repetía en la página nueva — la fila con "Fecha",
       "PFinicial (N)"... solo salía arriba del todo, así que las filas de
       la página siguiente se veían sin saber qué columna es cuál.
       table-header-group hace que el navegador la repita en cada página
       nueva que reciba filas de esa misma tabla, como cualquier
       "encabezado repetido" de un documento impreso normal. */
    table.tabla-datos thead{ display:table-header-group; }
    /* Tablas anchas: en pantalla se resuelven con scroll horizontal, pero
       imprimir no puede "hacer scroll" — lo que no cabe se cortaría en
       silencio. En vez de eso, se encoge la tipografía y se deja que el
       texto de cada celda pueda partirse en dos líneas si hace falta. */
    /* overflow-x:auto en pantalla, sin overflow-y explícito, hace que el
       navegador calcule overflow-y como "auto" también (regla de CSS: si
       uno de los dos ejes no es "visible", el otro deja de serlo) — un
       contenedor con scroll implícito, que muchos motores de impresión
       tratan como una región que no se puede partir entre páginas y
       simplemente recortan lo que no cabe. Poniendo los dos ejes en
       "visible" explícitamente, la tabla vuelve a ser contenido normal que
       sí puede fluir entre páginas. */
    .tabla-datos-wrap{ overflow-x:visible; overflow-y:visible; }
    table.tabla-datos{ font-size:9.5px; }
    table.tabla-datos th, table.tabla-datos td{ padding:5px 7px; white-space:normal; }
  }

  .overlay-exportar{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay-exportar.abierto{ display:flex; }
  .modal-exportar{
    background:var(--stone-800); border:1px solid var(--line-strong); border-radius:16px;
    max-width:420px; width:100%; padding:24px 26px; box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .modal-exportar h3{ font-size:16px; color:var(--chalk); margin-bottom:8px; }
  .modal-exportar-desc{ font-size:12.5px; color:var(--chalk-faint); line-height:1.6; margin:0 0 18px; }
  .lista-macrociclos{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; max-height:260px; overflow-y:auto; }
  .macrociclo-opt{
    display:flex; align-items:center; gap:10px; background:var(--stone-700); border:1px solid var(--line-strong);
    border-radius:9px; padding:11px 13px; cursor:pointer; font-size:13px; color:var(--chalk); transition:border-color .15s ease;
  }
  .macrociclo-opt:has(input:checked){ border-color:var(--moss); }
  .macrociclo-opt input{ accent-color:var(--moss); width:15px; height:15px; flex-shrink:0; }
  .macrociclo-opt small{ color:var(--chalk-faint); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin-left:4px; }
  .acciones-exportar{ display:flex; justify-content:flex-end; gap:10px; }
  .btn-cancelar-exportar{
    background:transparent; border:1px solid var(--line-strong); color:var(--chalk-dim); font-weight:700;
    font-size:12px; letter-spacing:0.4px; text-transform:uppercase; padding:10px 18px; border-radius:9px; cursor:pointer; font-family:inherit;
  }
  .btn-generar-exportar{
    background:var(--moss); color:var(--stone-900); border:none; font-weight:800; font-size:12px;
    letter-spacing:0.4px; text-transform:uppercase; padding:10px 20px; border-radius:9px; cursor:pointer; font-family:inherit;
  }
  .btn-generar-exportar:hover{ background:var(--moss-light); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="eyebrow">Kaska.Climb</div>
      <h1>Seguimiento</h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="wrap-campana">
        <button class="icon-btn" id="btnNotificaciones" type="button" title="Notificaciones">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-notif" id="badgeNotificaciones" hidden></span>
        </button>
        <div class="panel-notif" id="panelNotificaciones">
          <div id="contenidoNotificaciones"><div class="vacio-notif">Cargando…</div></div>
        </div>
      </div>
      <a class="icon-btn" href="Programacion.html">Programación</a>
      <a class="icon-btn" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Inicio
      </a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="cabecera-pagina">
    <h2 style="color:var(--moss-light);">Progresión por mesociclo</h2>
  </div>

  <div class="card">
    <div class="selector-fila">
      <div class="selector-cliente">
        <label>Cliente</label>
        <select id="selectorCliente"><option value="">Cargando clientes…</option></select>
      </div>
      <div class="tabs-meso" id="tabsMeso">
        <button class="tab-meso" data-meso="REOX" style="--c:var(--meso-reox);">REOX</button>
        <button class="tab-meso" data-meso="AERO" style="--c:var(--meso-aero);">AERO</button>
        <button class="tab-meso" data-meso="DESOX" style="--c:var(--meso-desox);">DESOX</button>
        <button class="tab-meso" data-meso="FMAX" style="--c:var(--meso-fmax);">FMAX</button>
        <button class="tab-meso" data-meso="TAPERING" style="--c:var(--meso-tapering);">TAP</button>
      </div>
      <div class="grupo-variable-exportar">
        <div class="selector-cliente">
          <label>Variable</label>
          <select id="selectorVariable"></select>
        </div>
        <button class="icon-btn" id="btnExportar" type="button" disabled title="Genera un PDF con el resumen y la gráfica de fuerza de cada mesociclo">Exportar</button>
      </div>
    </div>

    <div id="panelDatos"><div class="estado-panel">Elige un cliente para ver su progresión.</div></div>
  </div>
</div>

<div id="areaImpresion"></div>

<div class="overlay-exportar" id="overlayExportar">
  <div class="modal-exportar">
    <h3>Exportar PDF</h3>
    <p class="modal-exportar-desc">Este cliente ha tenido más de un macrociclo contigo — elige cuál o cuáles incluir en el informe.</p>
    <div class="lista-macrociclos" id="listaMacrociclos"></div>
    <div class="acciones-exportar">
      <button type="button" class="btn-cancelar-exportar" id="btnCancelarExportar">Cancelar</button>
      <button type="button" class="btn-generar-exportar" id="btnGenerarExportar">Generar PDF</button>
    </div>
  </div>
</div>

<script>
const { parseFechaDDMMYYYY, formatFechaDDMMYYYY } = window.PLANIFICACION_SEMANAS;
let MACROCICLOS_DISPONIBLES = []; // los del cliente elegido, cargados al abrir el selector de exportar
const MESO_COLORS = { REOX:'#7c9070', AERO:'#93859e', DESOX:'#70908c', FMAX:'#c17c74', TAPERING:'#c99a5b' };
let PORMESOCICLO = null;
let MESO_ACTIVO = 'REOX';

// Qué líneas se ven en la gráfica — las 3 son informativas por igual
// (PFinicial y Fmax 5" mano der./izq.), así que se pueden activar y
// desactivar por separado en vez de forzar verlas siempre todas juntas.
const VARIABLES = {
  pfInicial: { label: 'PFinicial (test al empezar)', color: null }, // null = color del mesociclo activo
  fmaxDer:   { label: 'Fmax 5" mano derecha', color: '#c99a5b' },
  fmaxIzq:   { label: 'Fmax 5" mano izquierda', color: '#6f8ea6' },
};
const VARIABLES_ACTIVAS = { pfInicial: true, fmaxDer: true, fmaxIzq: true };
let HISTORIAL_ACTUAL = null;

// Además de la fuerza (siempre disponible), cada mesociclo lleva sus propios
// "campos" secundarios (series de suspensiones, campus, pegues bloque/trave,
// tiempo de escalada continua en AERO...) — mismo mapeo que ya usa
// cliente/sesion.html para pintar el formulario, así no hay que duplicarlo.
// VARIABLE_ACTIVA vale 'fuerza' o 'campo:<índice>' (índice dentro de
// FIELD_MAP[meso].campos, que coincide con el índice del array historial.campos).
let VARIABLE_ACTIVA = 'fuerza';

function camposDelMesoActivo(){
  const cfg = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP[MESO_ACTIVO];
  return (cfg && Array.isArray(cfg.campos)) ? cfg.campos : [];
}

function poblarSelectorVariable(){
  const sel = document.getElementById('selectorVariable');
  const cfgMeso = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP[MESO_ACTIVO];
  const opciones = [
    '<option value="fuerza">Fuerza (PFinicial / Fmax)</option>',
    '<option value="pfpct">PFinicial en % (control de carga)</option>',
  ];
  if(cfgMeso && cfgMeso.pfFinal){
    opciones.push('<option value="pffinalpct">PFfinal en % (fatiga de la sesión)</option>');
  }
  camposDelMesoActivo().forEach((c, i) => {
    opciones.push(`<option value="campo:${i}">${escapeHtml(c.label)} (${escapeHtml(c.match)})</option>`);
  });
  // Dominadas con lastre no es un campo propio de FMAX (se registra en los
  // días de gimnasio, no en la sesión de fuerza), pero el entrenador quiere
  // verla desde la pestaña FMAX — por eso se añade aparte, no vía
  // camposDelMesoActivo().
  if(MESO_ACTIVO === 'FMAX'){
    opciones.push('<option value="dominadas">Dominadas con lastre (días de gimnasio)</option>');
  }
  opciones.push('<option value="resumen">Resumen (todos los datos)</option>');
  sel.innerHTML = opciones.join('');
  VARIABLE_ACTIVA = 'fuerza';
  sel.value = 'fuerza';
}

// Los campos de tipo 'tiempo' se guardan en segundos totales (cliente/sesion.html
// los manda como min*60+seg) — aquí se formatean de vuelta a mm:ss para leerlos.
function formatCampoValor(v, tipo){
  if(v === undefined || v === null) return null;
  if(tipo === 'tiempo'){
    const m = Math.floor(v / 60), s = Math.round(v % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }
  // Series/pegues/campus son siempre recuentos enteros — redondeamos solo
  // las medias/ejes calculados, los valores tal cual introducidos no cambian.
  return String(Math.round(v * 10) / 10);
}

// Gráfica de una sola variable secundaria (series, pegues, campus, tiempo…) —
// misma factura visual que dibujarGrafica, pero sin las 3 líneas fijas de
// fuerza ni el eje en "N", ya que aquí la unidad cambia según el campo.
function dibujarGraficaCampo(svg, historial, indice, color, tipo){
  const M = { left:44, right:14, top:16, bottom:30 };
  const W = 640, H = 260;
  const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;

  const valores = historial.map(h => (h.campos || [])[indice]).filter(v => v !== undefined && v !== null);
  const hayValores = valores.length > 0;
  const rawMin = hayValores ? Math.min(...valores) : 0;
  const rawMax = hayValores ? Math.max(...valores) : 10;
  const margen = Math.max(tipo === 'tiempo' ? 5 : 1, (rawMax - rawMin) * 0.15);
  const yMin = Math.max(0, rawMin - margen);
  const yMax = rawMax + margen;

  const n = historial.length;
  const x = i => M.left + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);
  const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

  let svgStr = '';
  const pasosY = 4;
  for(let p = 0; p <= pasosY; p++){
    const valor = yMin + (yMax - yMin) * (p / pasosY);
    const yy = y(valor);
    svgStr += `<line class="grid-linea" x1="${M.left}" y1="${yy.toFixed(1)}" x2="${W - M.right}" y2="${yy.toFixed(1)}"/>`;
    svgStr += `<text class="eje-label" x="${M.left - 8}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle">${escapeHtml(formatCampoValor(valor, tipo))}</text>`;
  }

  const salto = Math.max(1, Math.ceil(n / 8));
  historial.forEach((h, i) => {
    if(i % salto !== 0 && i !== n - 1) return;
    svgStr += `<text class="eje-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(h.fecha)}</text>`;
  });

  const pts = [];
  historial.forEach((h, i) => {
    const v = (h.campos || [])[indice];
    if(v !== undefined && v !== null) pts.push([x(i), y(v)]);
  });
  if(pts.length >= 2){
    const area = `${M.left},${(M.top+plotH).toFixed(1)} ` + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') + ` ${pts[pts.length-1][0].toFixed(1)},${(M.top+plotH).toFixed(1)}`;
    svgStr += `<polygon points="${area}" fill="${color}" fill-opacity="0.14"/>`;
    svgStr += `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach(([px,py], idx) => {
    const esUltimo = idx === pts.length - 1;
    svgStr += `<circle class="${esUltimo?'punto-final':''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${esUltimo?4.5:3}" fill="${color}"/>`;
  });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgStr;
}

function escapeHtml(str){
  return (str == null ? '' : String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Gráfica de líneas dibujada a mano en SVG (mismo criterio que los radares de
// Batería test.html / cliente/perfil-fisiologico.html) — sin depender de
// ninguna librería externa.
function dibujarGrafica(svg, historial, colorPrincipal){
  const M = { left:44, right:14, top:16, bottom:30 };
  const W = 640, H = 260;
  const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;

  const soloValores = campo => historial.map(h => h[campo]).filter(v => v !== undefined && v !== null);
  const camposActivos = Object.keys(VARIABLES).filter(c => VARIABLES_ACTIVAS[c]);
  const todosLosValores = camposActivos.flatMap(soloValores);
  const hayValores = todosLosValores.length > 0;
  const rawMin = hayValores ? Math.min(...todosLosValores) : 0;
  const rawMax = hayValores ? Math.max(...todosLosValores) : 10;
  const margen = Math.max(6, (rawMax - rawMin) * 0.12);
  const yMin = Math.floor((rawMin - margen) / 5) * 5;
  const yMax = Math.ceil((rawMax + margen) / 5) * 5;

  const n = historial.length;
  const x = i => M.left + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);
  const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

  let svgStr = '';

  // Rejilla horizontal + etiquetas del eje Y (4 franjas).
  const pasosY = 4;
  for(let p = 0; p <= pasosY; p++){
    const valor = yMin + (yMax - yMin) * (p / pasosY);
    const yy = y(valor);
    svgStr += `<line class="grid-linea" x1="${M.left}" y1="${yy.toFixed(1)}" x2="${W - M.right}" y2="${yy.toFixed(1)}"/>`;
    svgStr += `<text class="eje-label" x="${M.left - 8}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle">${Math.round(valor)}N</text>`;
  }

  // Etiquetas del eje X — si hay muchos puntos, se muestra solo una de cada
  // varias para que no se amontonen.
  const salto = Math.max(1, Math.ceil(n / 8));
  historial.forEach((h, i) => {
    if(i % salto !== 0 && i !== n - 1) return;
    svgStr += `<text class="eje-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(h.fecha)}</text>`;
  });

  function trazado(valores, color, relleno){
    const pts = [];
    valores.forEach((v, i) => { if(v !== undefined && v !== null) pts.push([x(i), y(v)]); });
    if(pts.length < 2) return '';
    let s = `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(relleno){
      const area = `${M.left},${(M.top+plotH).toFixed(1)} ` + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') + ` ${pts[pts.length-1][0].toFixed(1)},${(M.top+plotH).toFixed(1)}`;
      s = `<polygon points="${area}" fill="${color}" fill-opacity="0.14"/>` + s;
    }
    pts.forEach(([px,py], idx) => {
      const esUltimo = idx === pts.length - 1;
      s += `<circle class="${esUltimo?'punto-final':''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${esUltimo?4.5:3}" fill="${color}"/>`;
    });
    return s;
  }

  if(VARIABLES_ACTIVAS.pfInicial) svgStr += trazado(historial.map(h=>h.pfInicial), colorPrincipal, true);
  if(VARIABLES_ACTIVAS.fmaxDer) svgStr += trazado(historial.map(h=>h.fmaxDer), VARIABLES.fmaxDer.color, false);
  if(VARIABLES_ACTIVAS.fmaxIzq) svgStr += trazado(historial.map(h=>h.fmaxIzq), VARIABLES.fmaxIzq.color, false);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgStr;
}

document.querySelectorAll('.tab-meso').forEach(tab => {
  tab.addEventListener('click', () => { MESO_ACTIVO = tab.dataset.meso; pintarTabs(); poblarSelectorVariable(); pintarDatos(); });
});
function pintarTabs(){
  document.querySelectorAll('.tab-meso').forEach(tab => {
    const on = tab.dataset.meso === MESO_ACTIVO;
    tab.classList.toggle('activo', on);
    tab.style.background = on ? tab.style.getPropertyValue('--c') : '';
  });
}
pintarTabs();

async function cargarCliente(email){
  const panel = document.getElementById('panelDatos');
  const btnExportar = document.getElementById('btnExportar');
  if(!email){ panel.innerHTML = '<div class="estado-panel">Elige un cliente para ver su progresión.</div>'; btnExportar.disabled = true; return; }
  panel.innerHTML = '<div class="estado-panel">Cargando historial…</div>';
  btnExportar.disabled = true;
  try{
    const res = await fetch('/api/obtener-historial?' + new URLSearchParams({ cliente: email }).toString());
    const data = await res.json();
    if(!data.success){
      panel.innerHTML = `<div class="estado-panel">${escapeHtml(data.error || 'No se pudo cargar el historial.')}</div>`;
      return;
    }
    PORMESOCICLO = data.porMesociclo;
    btnExportar.disabled = false;
    pintarDatos();
  }catch(e){
    panel.innerHTML = `<div class="estado-panel">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

function pintarDatos(){
  const panel = document.getElementById('panelDatos');
  if(!PORMESOCICLO) return;

  // Dominadas con lastre vive en su propia serie (días de gimnasio, no de
  // fuerza) — se pinta antes de mirar el historial de FMAX, que puede estar
  // vacío sin que eso signifique que no hay dominadas que enseñar.
  if(VARIABLE_ACTIVA === 'dominadas'){
    pintarPanelDominadas(panel);
    return;
  }

  const historial = (PORMESOCICLO[MESO_ACTIVO] || []).filter(h => h.entrenada);

  if(!historial.length){
    panel.innerHTML = '<div class="estado-panel">Este cliente todavía no tiene sesiones entrenadas de este mesociclo.</div>';
    return;
  }

  if(VARIABLE_ACTIVA === 'fuerza') pintarPanelFuerza(panel, historial);
  else if(VARIABLE_ACTIVA === 'pfpct') pintarPanelPfPct(panel, historial);
  else if(VARIABLE_ACTIVA === 'pffinalpct') pintarPanelPfFinalPct(panel, historial);
  else if(VARIABLE_ACTIVA === 'resumen') pintarPanelResumen(panel);
  else pintarPanelCampo(panel, historial, Number(VARIABLE_ACTIVA.split(':')[1]));
}

function pintarPanelFuerza(panel, historial){
  const ultimo = historial[historial.length - 1];
  const primero = historial[0];
  const media = Math.round(historial.reduce((s,h) => s + h.pfInicial, 0) / historial.length);
  // primero.pfInicial === 0 es un valor real (igual que en pintarPanelPfPct/
  // pintarPanelCampo) — con denominador 0 no hay % que calcular, así que se
  // muestra la diferencia absoluta en vez de forzar un "0%" que parecería
  // "sin cambios" cuando en realidad no se puede saber.
  const primerEsCero = primero.pfInicial === 0;
  const deltaAbsoluto = ultimo.pfInicial - primero.pfInicial;
  const tendenciaPct = primerEsCero ? null : ((ultimo.pfInicial - primero.pfInicial) / primero.pfInicial * 100);
  const tendenciaPositiva = primerEsCero ? deltaAbsoluto >= 0 : tendenciaPct >= 0;
  const tendenciaTexto = primerEsCero
    ? `${deltaAbsoluto >= 0 ? '+' : ''}${deltaAbsoluto}<small>N</small>`
    : `${tendenciaPct >= 0 ? '+' : ''}${tendenciaPct.toFixed(1)}<small>%</small>`;
  const noRecuperadas = (PORMESOCICLO[MESO_ACTIVO] || []).filter(h => !h.entrenada).length;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">PFinicial medio</div><div class="v">${media}<small>N</small></div></div>
      <div class="stat-tile">
        <div class="k">Tendencia (${historial.length} ses.)</div>
        <div class="v" style="color:${tendenciaPositiva?'var(--moss-light)':'var(--danger)'};">${tendenciaTexto}</div>
        <div class="delta ${tendenciaPositiva?'up':'down'}">${tendenciaPositiva?'↑ progresando':'↓ en descenso'}</div>
      </div>
      <div class="stat-tile"><div class="k">Última PFinicial</div><div class="v">${ultimo.pfInicial}<small>N</small></div></div>
      <div class="stat-tile"><div class="k">Sesiones no recuperadas</div><div class="v">${noRecuperadas}<small>/${historial.length + noRecuperadas}</small></div></div>
    </div>
    <div class="chart-shell">
      <div class="leyenda" id="leyendaVariables">
        ${Object.keys(VARIABLES).map(campo => {
          const v = VARIABLES[campo];
          const color = v.color || MESO_COLORS[MESO_ACTIVO];
          const off = !VARIABLES_ACTIVAS[campo];
          return `<button type="button" class="item${off?' off':''}" data-campo="${campo}"><span class="sw" style="background:${color};"></span>${escapeHtml(v.label)}</button>`;
        }).join('')}
      </div>
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260" width="640" height="260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>PFinicial (N)</th><th>Fmax izq. (N)</th><th>Fmax der. (N)</th><th>Sesión</th></tr></thead>
        <tbody>${(PORMESOCICLO[MESO_ACTIVO] || []).map(h => h.entrenada
          ? `<tr><td>${escapeHtml(h.fecha)}</td><td>${h.pfInicial}</td><td>${h.fmaxIzq ?? '—'}</td><td>${h.fmaxDer ?? '—'}</td><td>Entrenada</td></tr>`
          : `<tr><td>${escapeHtml(h.fecha)}</td><td>${h.pfInicial}</td><td class="no-entrenada">—</td><td class="no-entrenada">—</td><td class="no-entrenada">No recuperado</td></tr>`
        ).join('')}</tbody>
      </table>
    </div>`;

  HISTORIAL_ACTUAL = historial;
  dibujarGrafica(document.getElementById('chartPF'), historial, MESO_COLORS[MESO_ACTIVO]);

  document.getElementById('leyendaVariables').querySelectorAll('[data-campo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const campo = btn.dataset.campo;
      VARIABLES_ACTIVAS[campo] = !VARIABLES_ACTIVAS[campo];
      btn.classList.toggle('off', !VARIABLES_ACTIVAS[campo]);
      dibujarGrafica(document.getElementById('chartPF'), HISTORIAL_ACTUAL, MESO_COLORS[MESO_ACTIVO]);
    });
  });
}

// Panel para una variable secundaria (series de suspensiones, campus, pegues
// bloque/trave, tiempo de escalada continua…) — un valor por sesión entrenada,
// no siempre presente (p.ej. en DESOX travesías/multibloque son alternativas,
// así que huecos sueltos son normales y no un error).
function pintarPanelCampo(panel, historial, indice){
  const cfgCampo = camposDelMesoActivo()[indice];
  if(!cfgCampo){ panel.innerHTML = '<div class="estado-panel">Variable no disponible para este mesociclo.</div>'; return; }
  const tipo = cfgCampo.tipo;
  const color = MESO_COLORS[MESO_ACTIVO];

  const conValor = historial
    .map(h => ({ fecha: h.fecha, valor: (h.campos || [])[indice] }))
    .filter(x => x.valor !== undefined && x.valor !== null);

  if(!conValor.length){
    panel.innerHTML = `<div class="estado-panel">Este cliente todavía no tiene datos de "${escapeHtml(cfgCampo.label)} (${escapeHtml(cfgCampo.match)})".</div>`;
    return;
  }

  const ultimo = conValor[conValor.length - 1];
  const primero = conValor[0];
  const media = conValor.reduce((s,x) => s + x.valor, 0) / conValor.length;
  // primero.valor === 0 es un dato real y válido (varios campos admiten "0
  // si no aplica") — el % de cambio no se puede calcular con denominador 0,
  // así que ahí se muestra la diferencia absoluta en vez de forzar un "0%"
  // que parecería "sin cambios" cuando en realidad puede haber mejorado mucho.
  const primerEsCero = primero.valor === 0;
  const tendenciaPct = primerEsCero ? null : ((ultimo.valor - primero.valor) / primero.valor * 100);
  const deltaAbsoluto = ultimo.valor - primero.valor;
  const tendenciaPositiva = primerEsCero ? deltaAbsoluto >= 0 : tendenciaPct >= 0;
  const tendenciaTexto = primerEsCero
    ? `${deltaAbsoluto >= 0 ? '+' : ''}${escapeHtml(formatCampoValor(deltaAbsoluto, tipo))}`
    : `${tendenciaPct >= 0 ? '+' : ''}${tendenciaPct.toFixed(1)}<small>%</small>`;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">${escapeHtml(cfgCampo.label)} media</div><div class="v">${escapeHtml(formatCampoValor(media, tipo))}</div></div>
      <div class="stat-tile">
        <div class="k">Tendencia (${conValor.length} ses.)</div>
        <div class="v" style="color:${tendenciaPositiva?'var(--moss-light)':'var(--danger)'};">${tendenciaTexto}</div>
        <div class="delta ${tendenciaPositiva?'up':'down'}">${tendenciaPositiva?'↑ progresando':'↓ en descenso'}</div>
      </div>
      <div class="stat-tile"><div class="k">Último valor</div><div class="v">${escapeHtml(formatCampoValor(ultimo.valor, tipo))}</div></div>
      <div class="stat-tile"><div class="k">Sesiones con dato</div><div class="v">${conValor.length}<small>/${historial.length}</small></div></div>
    </div>
    <div class="chart-shell">
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260" width="640" height="260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>${escapeHtml(cfgCampo.label)}</th><th>Sesión</th></tr></thead>
        <tbody>${historial.map(h => {
          const v = (h.campos || [])[indice];
          return v !== undefined && v !== null
            ? `<tr><td>${escapeHtml(h.fecha)}</td><td>${escapeHtml(formatCampoValor(v, tipo))}</td><td>Entrenada</td></tr>`
            : `<tr><td>${escapeHtml(h.fecha)}</td><td class="no-entrenada">—</td><td class="no-entrenada">Sin dato</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;

  dibujarGraficaCampo(document.getElementById('chartPF'), historial, indice, color, tipo);
}

// Dominadas con lastre — no es un campo de la sesión de FMAX en sí, se
// registra en los días de gimnasio (GYM-FMAX/GYM-ANTAGONISTAS, el bloque
// "Fmax tracción" puede aparecer en cualquiera de los dos) — por eso llega
// en su propia clave de porMesociclo en vez de dentro de FMAX.campos, y este
// panel no depende de si hay sesiones de FMAX entrenadas o no.
function pintarPanelDominadas(panel){
  const datos = PORMESOCICLO['DOMINADAS_LASTRE'] || [];
  const cfgUnico = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP['GYM-FMAX'] && window.MESOCICLOS_CONFIG.FIELD_MAP['GYM-FMAX'].unico;
  const etiqueta = (cfgUnico && cfgUnico.label) || 'Dominadas con lastre';

  if(!datos.length){
    panel.innerHTML = '<div class="estado-panel">Este cliente todavía no tiene series de dominadas con lastre registradas.</div>';
    return;
  }

  const ultimo = datos[datos.length - 1];
  const primero = datos[0];
  const media = datos.reduce((s,d) => s + d.valor, 0) / datos.length;
  const primerEsCero = primero.valor === 0;
  const tendenciaPct = primerEsCero ? null : ((ultimo.valor - primero.valor) / primero.valor * 100);
  const deltaAbsoluto = ultimo.valor - primero.valor;
  const tendenciaPositiva = primerEsCero ? deltaAbsoluto >= 0 : tendenciaPct >= 0;
  const tendenciaTexto = primerEsCero
    ? `${deltaAbsoluto >= 0 ? '+' : ''}${deltaAbsoluto}`
    : `${tendenciaPct >= 0 ? '+' : ''}${tendenciaPct.toFixed(1)}<small>%</small>`;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">${escapeHtml(etiqueta)} media</div><div class="v">${media.toFixed(1)}</div></div>
      <div class="stat-tile">
        <div class="k">Tendencia (${datos.length} ses.)</div>
        <div class="v" style="color:${tendenciaPositiva?'var(--moss-light)':'var(--danger)'};">${tendenciaTexto}</div>
        <div class="delta ${tendenciaPositiva?'up':'down'}">${tendenciaPositiva?'↑ progresando':'↓ en descenso'}</div>
      </div>
      <div class="stat-tile"><div class="k">Último valor</div><div class="v">${ultimo.valor}</div></div>
      <div class="stat-tile"><div class="k">Sesiones con dato</div><div class="v">${datos.length}</div></div>
    </div>
    <div class="chart-shell">
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260" width="640" height="260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>${escapeHtml(etiqueta)}</th></tr></thead>
        <tbody>${datos.map(d => `<tr><td>${escapeHtml(d.fecha)}</td><td>${d.valor}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;

  dibujarGraficaCampo(document.getElementById('chartPF'), datos.map(d => ({ fecha: d.fecha, campos: [d.valor] })), 0, MESO_COLORS.FMAX, undefined);
}

// Resumen — todos los datos de este mesociclo en una sola tabla (PFinicial,
// Fmax, PFfinal y los campos secundarios propios del mesociclo), incluidas
// las sesiones no recuperadas. Solo tiene sentido como tabla: mezclar aquí
// unidades tan distintas (N, %, series, tiempo...) en una misma gráfica no
// contaría nada útil.
function pintarPanelResumen(panel){
  const todas = PORMESOCICLO[MESO_ACTIVO] || [];
  const cfgMeso = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP[MESO_ACTIVO];
  const tienePfFinal = !!(cfgMeso && cfgMeso.pfFinal);
  const campos = camposDelMesoActivo();

  const cabeceras = ['Fecha', 'PFinicial (N)', 'PFinicial (%)', 'Fmax izq. (N)', 'Fmax der. (N)'];
  if(tienePfFinal) cabeceras.push('PFfinal (N)', 'PFfinal (%)');
  campos.forEach(c => cabeceras.push(`${c.label} (${c.match})`));
  cabeceras.push('Sesión', 'Notas');

  // PFinicial (%) — misma variación que pintarPanelPfPct, frente a la
  // sesión ENTRENADA anterior (los días no recuperados no cuentan como
  // referencia ni tienen su propio %, igual que ahí). Positivo en verde,
  // negativo en rojo — mismo criterio de color que ya usan pintarPanelPfPct
  // y pintarPanelPfFinalPct.
  const celdaPct = pct => ({ texto: `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`, color: pct >= 0 ? 'var(--moss-light)' : 'var(--danger)' });
  let anteriorPfInicial;
  const filas = todas.map(h => {
    const celdas = [h.fecha, String(h.pfInicial)];
    if(h.entrenada){
      const pfInicialCelda = (anteriorPfInicial !== undefined && anteriorPfInicial !== 0)
        ? celdaPct((h.pfInicial - anteriorPfInicial) / anteriorPfInicial * 100)
        : '—';
      celdas.push(pfInicialCelda, h.fmaxIzq ?? '—', h.fmaxDer ?? '—');
      if(tienePfFinal){
        const pfFinalCelda = (h.pfFinal !== undefined && h.pfFinal !== null && h.pfInicial !== 0)
          ? celdaPct((h.pfInicial - h.pfFinal) / h.pfInicial * 100)
          : '—';
        celdas.push(h.pfFinal ?? '—', pfFinalCelda);
      }
      campos.forEach((c, i) => {
        const v = (h.campos || [])[i];
        celdas.push(v !== undefined && v !== null ? formatCampoValor(v, c.tipo) : '—');
      });
      celdas.push('Entrenada');
      anteriorPfInicial = h.pfInicial;
    } else {
      celdas.push('—', '—', '—');
      if(tienePfFinal) celdas.push('—', '—');
      campos.forEach(() => celdas.push('—'));
      celdas.push('No recuperado');
    }
    return { celdas, entrenada: h.entrenada, notas: h.notas };
  });

  panel.innerHTML = `
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr>${cabeceras.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${filas.map(f => {
          const celdasHtml = f.celdas.map(v => {
            const claseBase = f.entrenada ? '' : ' class="no-entrenada"';
            if(v && typeof v === 'object'){
              return `<td${claseBase} style="color:${v.color};">${escapeHtml(v.texto)}</td>`;
            }
            return `<td${claseBase}>${escapeHtml(v)}</td>`;
          }).join('');
          const notaHtml = f.notas
            ? `<td${f.entrenada ? '' : ' class="no-entrenada"'}><span class="nota-marcador" title="${escapeHtml(f.notas)}">Ver nota</span></td>`
            : `<td${f.entrenada ? '' : ' class="no-entrenada"'}>—</td>`;
          return `<tr>${celdasHtml}${notaHtml}</tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

// PFinicial en % — variación de la fuerza de partida respecto a la sesión
// entrenada anterior de este mismo mesociclo. Mismo cálculo que ya hace
// cliente/sesion.html para decidir si la sesión se bloquea por no estar
// recuperado (perdida = (anterior-actual)/anterior*100, sesión bloqueada si
// perdida > umbralControl) — aquí en positivo cuando hay GANANCIA respecto a
// la sesión de antes, en negativo cuando hay pérdida, para verlo en el tiempo.
function pintarPanelPfPct(panel, historial){
  const cfg = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP[MESO_ACTIVO];
  const umbralControl = cfg ? cfg.umbralControl : undefined;
  const color = MESO_COLORS[MESO_ACTIVO];

  // PFinicial=0 es un valor real que se puede registrar (sin mínimo forzado
  // en el servidor) — no es "sin dato". Con denominador 0 el % no se puede
  // calcular, así que ese punto concreto se omite de la gráfica (no hay
  // forma honesta de dibujar un "+∞%"), pero se avisa en vez de desaparecer
  // en silencio, a diferencia de antes donde cualquier anterior "falsy" se
  // saltaba sin distinguir "sin dato" de "0 real".
  const puntos = [];
  let omitidosPorCero = 0;
  for(let i = 1; i < historial.length; i++){
    const anterior = historial[i-1].pfInicial, actual = historial[i].pfInicial;
    if(anterior === undefined || anterior === null) continue;
    if(anterior === 0){ omitidosPorCero++; continue; }
    puntos.push({ fecha: historial[i].fecha, valor: ((actual - anterior) / anterior) * 100 });
  }

  if(!puntos.length){
    panel.innerHTML = '<div class="estado-panel">Hace falta al menos 2 sesiones entrenadas de este mesociclo para calcular la variación.</div>';
    return;
  }

  const media = puntos.reduce((s,p) => s + p.valor, 0) / puntos.length;
  const ultimo = puntos[puntos.length - 1].valor;
  const sobreUmbral = umbralControl !== undefined ? puntos.filter(p => -p.valor > umbralControl).length : null;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">Variación media</div><div class="v" style="color:${media>=0?'var(--moss-light)':'var(--danger)'};">${media>=0?'+':''}${media.toFixed(1)}<small>%</small></div></div>
      <div class="stat-tile">
        <div class="k">Última variación</div>
        <div class="v" style="color:${ultimo>=0?'var(--moss-light)':'var(--danger)'};">${ultimo>=0?'+':''}${ultimo.toFixed(1)}<small>%</small></div>
        <div class="delta ${ultimo>=0?'up':'down'}">${ultimo>=0?'↑ ganancia':'↓ pérdida'} vs. sesión anterior</div>
      </div>
      <div class="stat-tile"><div class="k">Pérdida &gt; umbral</div><div class="v">${sobreUmbral ?? '—'}<small>/${puntos.length}</small></div></div>
      <div class="stat-tile"><div class="k">Umbral de control</div><div class="v">${umbralControl ?? '—'}<small>%</small></div></div>
    </div>
    ${omitidosPorCero ? `<div class="estado-panel" style="margin-bottom:10px;">${omitidosPorCero} sesión${omitidosPorCero===1?'':'es'} con PFinicial de 0 en la sesión anterior — no se puede calcular el % de variación para ${omitidosPorCero===1?'esa fecha':'esas fechas'}.</div>` : ''}
    <div class="chart-shell">
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260" width="640" height="260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>Variación PFinicial</th></tr></thead>
        <tbody>${puntos.map(p => `<tr><td>${escapeHtml(p.fecha)}</td><td style="color:${p.valor>=0?'var(--moss-light)':'var(--danger)'};">${p.valor>=0?'+':''}${p.valor.toFixed(1)}%</td></tr>`).join('')}</tbody>
      </table>
    </div>`;

  dibujarGraficaValores(document.getElementById('chartPF'), puntos, color);
}

// PFfinal en % — a diferencia de pfpct (que compara una sesión con la
// anterior), aquí cada punto es la caída DENTRO de la misma sesión: PFinicial
// vs. PFfinal de ese mismo día (mismo cálculo que usa cliente/sesion.html
// para el aviso de parada — umbralIntegrado). No es un dato de progreso
// lineal entre sesiones, cada punto es independiente — pero sirve para ver
// hasta dónde se ha llevado al cliente cada día. Positivo = ha caído
// respecto a su PFinicial de ese día (lo normal); negativo = PFfinal salió
// más alto que el PFinicial (raro, pero real, no se fuerza a 0).
function pintarPanelPfFinalPct(panel, historial){
  const cfg = window.MESOCICLOS_CONFIG && window.MESOCICLOS_CONFIG.FIELD_MAP[MESO_ACTIVO];
  const umbralIntegrado = cfg ? cfg.umbralIntegrado : undefined;
  const color = MESO_COLORS[MESO_ACTIVO];

  // No todas las sesiones llevan PFfinal (puede bloquearse antes, o el
  // cliente no llegar a hacerlo) — se cuentan aparte, no como "PFinicial=0".
  const puntos = [];
  let omitidosPorCero = 0;
  historial.forEach(h => {
    if(h.pfFinal === undefined || h.pfFinal === null) return;
    if(h.pfInicial === 0){ omitidosPorCero++; return; }
    puntos.push({ fecha: h.fecha, valor: ((h.pfInicial - h.pfFinal) / h.pfInicial) * 100 });
  });

  if(!puntos.length){
    panel.innerHTML = omitidosPorCero
      ? `<div class="estado-panel">${omitidosPorCero} sesión${omitidosPorCero===1?'':'es'} con PFfinal registrado, pero con PFinicial de 0 — no se puede calcular la caída.</div>`
      : '<div class="estado-panel">Este cliente todavía no tiene datos de PFfinal en este mesociclo.</div>';
    return;
  }

  const media = puntos.reduce((s,p) => s + p.valor, 0) / puntos.length;
  const ultimo = puntos[puntos.length - 1].valor;
  const sobreUmbral = umbralIntegrado !== undefined ? puntos.filter(p => p.valor > umbralIntegrado).length : null;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">Caída media</div><div class="v">${media.toFixed(1)}<small>%</small></div></div>
      <div class="stat-tile">
        <div class="k">Última caída</div>
        <div class="v"${umbralIntegrado !== undefined && ultimo > umbralIntegrado ? ' style="color:var(--danger);"' : ''}>${ultimo.toFixed(1)}<small>%</small></div>
        <div class="delta">vs. su propio PFinicial de ese día</div>
      </div>
      <div class="stat-tile"><div class="k">Sesiones &gt; umbral</div><div class="v"${sobreUmbral ? ' style="color:var(--danger);"' : ''}>${sobreUmbral ?? '—'}<small>/${puntos.length}</small></div></div>
      <div class="stat-tile"><div class="k">Umbral integrado</div><div class="v">${umbralIntegrado ?? '—'}<small>%</small></div></div>
    </div>
    <div class="estado-panel" style="margin-bottom:10px;">No es un dato de progreso lineal entre sesiones — cada punto es la caída dentro de esa misma sesión, no una tendencia continua.</div>
    ${omitidosPorCero ? `<div class="estado-panel" style="margin-bottom:10px;">${omitidosPorCero} sesión${omitidosPorCero===1?'':'es'} con PFinicial de 0 — no se puede calcular la caída para ${omitidosPorCero===1?'esa fecha':'esas fechas'}.</div>` : ''}
    <div class="chart-shell">
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260" width="640" height="260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>Caída PFfinal</th></tr></thead>
        <tbody>${puntos.map(p => `<tr><td>${escapeHtml(p.fecha)}</td><td${umbralIntegrado !== undefined && p.valor > umbralIntegrado ? ' style="color:var(--danger);"' : ''}>${p.valor.toFixed(1)}%</td></tr>`).join('')}</tbody>
      </table>
    </div>`;

  dibujarGraficaValores(document.getElementById('chartPF'), puntos, color);
}

// Gráfica genérica de una serie de puntos {fecha, valor} ya calculada (sin
// huecos que respetar, a diferencia de dibujarGraficaCampo) — admite valores
// negativos (variación en %) y dibuja una línea de referencia en el cero.
function dibujarGraficaValores(svg, puntos, color){
  const M = { left:44, right:14, top:16, bottom:30 };
  const W = 640, H = 260;
  const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;

  const valores = puntos.map(p => p.valor);
  const rawMin = Math.min(0, ...valores), rawMax = Math.max(0, ...valores);
  const margen = Math.max(2, (rawMax - rawMin) * 0.15);
  const yMin = rawMin - margen, yMax = rawMax + margen;

  const n = puntos.length;
  const x = i => M.left + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);
  const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

  let svgStr = '';
  const pasosY = 4;
  for(let p = 0; p <= pasosY; p++){
    const valor = yMin + (yMax - yMin) * (p / pasosY);
    const yy = y(valor);
    svgStr += `<line class="grid-linea" x1="${M.left}" y1="${yy.toFixed(1)}" x2="${W - M.right}" y2="${yy.toFixed(1)}"/>`;
    svgStr += `<text class="eje-label" x="${M.left - 8}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle">${valor.toFixed(0)}%</text>`;
  }
  if(yMin < 0 && yMax > 0){
    svgStr += `<line x1="${M.left}" y1="${y(0).toFixed(1)}" x2="${W-M.right}" y2="${y(0).toFixed(1)}" stroke="rgba(242,237,225,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>`;
  }

  const salto = Math.max(1, Math.ceil(n / 8));
  puntos.forEach((p, i) => {
    if(i % salto !== 0 && i !== n - 1) return;
    svgStr += `<text class="eje-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(p.fecha)}</text>`;
  });

  const pts = puntos.map((p, i) => [x(i), y(p.valor)]);
  if(pts.length >= 2){
    svgStr += `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach(([px,py], idx) => {
    const esUltimo = idx === pts.length - 1;
    svgStr += `<circle class="${esUltimo?'punto-final':''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${esUltimo?4.5:3}" fill="${color}"/>`;
  });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgStr;
}

document.getElementById('selectorVariable').addEventListener('change', (e) => {
  VARIABLE_ACTIVA = e.target.value;
  pintarDatos();
});

// Arma un bloque (título + lo que pinte fn) dentro del contenedor de
// impresión, reutilizando directamente los mismos pintarPanelX() que la
// vista interactiva — misma tabla, misma gráfica SVG, cero código
// duplicado. El único ajuste hace falta porque esas funciones siempre
// dibujan en un <svg id="chartPF"> fijo (buscado con getElementById): con
// varios bloques a la vez en el documento eso chocaría (ids repetidos, el
// segundo bloque pintaría encima del primero), así que en cuanto un bloque
// termina de dibujarse le quitamos el id al suyo, dejando libre "chartPF"
// para el siguiente.
function agregarBloqueImpresion(contenedor, titulo, fn){
  const bloque = document.createElement('div');
  bloque.className = 'bloque-impresion';
  bloque.innerHTML = `<h3>${escapeHtml(titulo)}</h3>`;
  const cuerpo = document.createElement('div');
  bloque.appendChild(cuerpo);
  contenedor.appendChild(bloque);
  fn(cuerpo);
  const svg = cuerpo.querySelector('#chartPF');
  if(svg) svg.removeAttribute('id');
}

// Convierte el valor de un <input type="date"> ("aaaa-mm-dd") a Date en
// hora LOCAL — new Date("aaaa-mm-dd") lo interpretaría en UTC, lo que
// podía desplazar un día respecto a las fechas que ya construye
// parseFechaDDMMYYYY (siempre en local), y el filtro fallaría justo en el
// primer/último día del rango elegido.
function fechaInputALocal(valorInput){
  if(!valorInput) return null;
  const [y, m, d] = valorInput.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// Copia PORMESOCICLO acotada a la UNIÓN de los rangos [inicio, fin] de los
// macrociclos elegidos (fin puede venir vacío en el macrociclo en curso —
// entonces no tiene tope superior) — para separar, en el informe,
// macrociclos distintos que un mismo cliente haya entrenado contigo en
// épocas distintas. `macrociclos` es null/[] cuando no hay que filtrar
// nada (un solo macrociclo, o ninguno publicado).
function filtrarPorMacrociclos(datos, macrociclos){
  if(!macrociclos || !macrociclos.length) return datos;
  const rangos = macrociclos.map(m => ({
    inicio: fechaInputALocal(m.inicio),
    fin: m.fin ? fechaInputALocal(m.fin) : null,
  }));
  const filtrado = {};
  Object.keys(datos).forEach(meso => {
    filtrado[meso] = (datos[meso] || []).filter(e => {
      const f = parseFechaDDMMYYYY(e.fecha);
      if(!f) return false;
      return rangos.some(r => f >= r.inicio && (!r.fin || f <= r.fin));
    });
  });
  return filtrado;
}

// Genera el informe (por cada mesociclo con sesiones entrenadas: su tabla
// "Resumen" y la gráfica de Fuerza con su tabla) dentro de #areaImpresion —
// oculto en pantalla, visible solo dentro de @media print — y abre el
// diálogo de impresión del navegador para guardarlo como PDF. Todo con los
// datos que ya están en memoria (PORMESOCICLO), sin volver a pedir nada al
// servidor. macrociclosElegidos (opcional): array de {inicio,fin} — cuando
// se pasa, acota el informe a la unión de esos rangos.
async function exportarPDFCompleto(macrociclosElegidos){
  if(!PORMESOCICLO) return;
  const btn = document.getElementById('btnExportar');
  const areaImpresion = document.getElementById('areaImpresion');
  const nombreCliente = (document.getElementById('selectorCliente').selectedOptions[0]?.textContent || 'Cliente').trim();

  btn.disabled = true;
  const textoOriginalBtn = btn.textContent;
  btn.textContent = 'Generando…';

  // Guardamos el estado interactivo real para devolverlo tal cual estaba
  // después de imprimir — el informe fuerza mostrar TODAS las líneas de la
  // gráfica de fuerza, aunque el entrenador tuviera alguna desactivada.
  const mesoOriginal = MESO_ACTIVO;
  const activasOriginal = { ...VARIABLES_ACTIVAS };
  Object.keys(VARIABLES_ACTIVAS).forEach(k => { VARIABLES_ACTIVAS[k] = true; });

  // pintarPanelResumen/pintarPanelFuerza leen PORMESOCICLO como variable
  // global (no reciben los datos por parámetro) — para acotar el informe a
  // un rango de fechas sin tocar esas funciones, se sustituye temporalmente
  // por una copia ya filtrada, y se devuelve la real al terminar.
  const pormesocicloOriginal = PORMESOCICLO;
  PORMESOCICLO = filtrarPorMacrociclos(pormesocicloOriginal, macrociclosElegidos);

  // Nombre y apellidos en dos tonos (blanco/verde) — mismo criterio que ya
  // usa cliente/semana.html para el saludo del cliente.
  const partesNombre = nombreCliente.split(' ');
  const primerNombre = partesNombre[0] || nombreCliente;
  const apellidos = partesNombre.slice(1).join(' ');

  areaImpresion.innerHTML = `
    <div class="marca-informe">
      <div class="eyebrow">Kaska.Climb</div>
      <h4>Seguimiento</h4>
    </div>
    <h1>${escapeHtml(primerNombre)}${apellidos ? ` <span>${escapeHtml(apellidos)}</span>` : ''}</h1>`;

  const MESOS_INFORME = ['FMAX', 'REOX', 'DESOX', 'AERO', 'TAPERING'];
  let huboAlgo = false;

  MESOS_INFORME.forEach(meso => {
    const todas = PORMESOCICLO[meso] || [];
    const historialEntrenado = todas.filter(h => h.entrenada);
    if(!historialEntrenado.length) return;
    huboAlgo = true;
    MESO_ACTIVO = meso;

    // Rango real de fechas que cubre ESTE mesociclo dentro del informe (no
    // necesariamente el historial.length entero: puede venir acotado por
    // el/los macrociclo(s) elegidos) — se calcula ordenando de verdad, sin
    // asumir que el array ya viene en orden cronológico.
    const fechasOrdenadas = historialEntrenado.map(h => parseFechaDDMMYYYY(h.fecha)).filter(Boolean).sort((a, b) => a - b);
    const rangoTexto = fechasOrdenadas.length
      ? ` <span class="meso-rango">(${escapeHtml(formatFechaDDMMYYYY(fechasOrdenadas[0]))} – ${escapeHtml(formatFechaDDMMYYYY(fechasOrdenadas[fechasOrdenadas.length - 1]))})</span>`
      : '';
    const colorMeso = MESO_COLORS[meso] || 'var(--moss-light)';

    const seccion = document.createElement('div');
    seccion.className = 'seccion-impresion';
    seccion.innerHTML = `<h2 style="border-left-color:${colorMeso}; color:${colorMeso};">MESOCICLO ${escapeHtml(meso)}${rangoTexto}</h2>`;
    areaImpresion.appendChild(seccion);

    agregarBloqueImpresion(seccion, 'Resumen (todos los datos)', pintarPanelResumen);
    agregarBloqueImpresion(seccion, 'Fuerza (PFinicial / Fmax)', (c) => pintarPanelFuerza(c, historialEntrenado));
  });

  if(!huboAlgo){
    areaImpresion.innerHTML += macrociclosElegidos && macrociclosElegidos.length
      ? '<p>Este cliente no tiene ninguna sesión entrenada en el/los macrociclo(s) elegido(s).</p>'
      : '<p>Este cliente todavía no tiene ninguna sesión entrenada registrada.</p>';
  }

  // Restaura el estado interactivo antes de imprimir — si el entrenador
  // vuelve de la vista previa de impresión, la pantalla de detrás debe
  // seguir exactamente donde la dejó.
  PORMESOCICLO = pormesocicloOriginal;
  MESO_ACTIVO = mesoOriginal;
  Object.assign(VARIABLES_ACTIVAS, activasOriginal);
  btn.disabled = false;
  btn.textContent = textoOriginalBtn;

  // #areaImpresion pasa de display:none a visible solo dentro de @media
  // print, y se acaba de rellenar con muchos elementos (SVG incluidos) en
  // el mismo tick — si se llama a print() inmediatamente, el navegador
  // puede generar el PDF antes de haber pintado ese contenido nuevo de
  // verdad, y las gráficas salen en blanco. requestAnimationFrame no vale
  // aquí (se pausa en pestañas en segundo plano, y podría no disparar
  // nunca); un setTimeout corto sí se ejecuta siempre, y de sobra para que
  // el navegador haya terminado de pintar.
  setTimeout(() => window.print(), 60);
}

// Etiqueta de un macrociclo para el selector: "01/01/2026 – 30/06/2026", o
// sin tope si es el que está en curso (fin vacío).
function etiquetaMacrociclo(m){
  const inicioTxt = formatFechaDDMMYYYY(fechaInputALocal(m.inicio));
  const finTxt = m.fin ? formatFechaDDMMYYYY(fechaInputALocal(m.fin)) : 'actualidad';
  return `${inicioTxt} – ${finTxt}`;
}

document.getElementById('btnExportar').addEventListener('click', async () => {
  const btn = document.getElementById('btnExportar');
  const correo = document.getElementById('selectorCliente').value;

  // Si el cliente ha tenido un único macrociclo (o ninguno publicado todavía,
  // solo sesiones sueltas), no hay nada que elegir — se exporta todo
  // directamente, sin mostrar el selector.
  let macrociclos = [];
  try {
    const res = await fetch('/api/macrociclo?' + new URLSearchParams({ accion: 'historial', cliente: correo }).toString());
    const data = await res.json();
    if(data.success) macrociclos = data.macrociclos || [];
  } catch(e) { /* si falla la consulta, seguimos como si no hubiera ninguno — exporta todo */ }

  if(macrociclos.length <= 1){
    exportarPDFCompleto(macrociclos.length ? macrociclos : null);
    return;
  }

  MACROCICLOS_DISPONIBLES = macrociclos;
  document.getElementById('listaMacrociclos').innerHTML = macrociclos.map((m, i) => `
    <label class="macrociclo-opt">
      <input type="checkbox" data-idx="${i}"${i === 0 ? ' checked' : ''}>
      <span>${escapeHtml(etiquetaMacrociclo(m))}${i === 0 ? ' <small>Actual</small>' : ''}</span>
    </label>`).join('');
  document.getElementById('overlayExportar').classList.add('abierto');
});
function cerrarOverlayExportar(){ document.getElementById('overlayExportar').classList.remove('abierto'); }
document.getElementById('btnCancelarExportar').addEventListener('click', cerrarOverlayExportar);
document.getElementById('overlayExportar').addEventListener('click', (e) => {
  if(e.target.id === 'overlayExportar') cerrarOverlayExportar();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('overlayExportar').classList.contains('abierto')) cerrarOverlayExportar();
});
document.getElementById('btnGenerarExportar').addEventListener('click', () => {
  const elegidos = Array.from(document.querySelectorAll('#listaMacrociclos input:checked'))
    .map(el => MACROCICLOS_DISPONIBLES[Number(el.dataset.idx)]);
  cerrarOverlayExportar();
  exportarPDFCompleto(elegidos.length ? elegidos : null);
});

(async function init(){
  poblarSelectorVariable();
  const sel = document.getElementById('selectorCliente');
  await cargarSelectorClientes(sel);
  sel.addEventListener('change', () => cargarCliente(sel.value));
  if(sel.value) cargarCliente(sel.value);
})();

// Panel de notificaciones — dos tipos: sesiones registradas esta semana, y
// clientes que han pasado a Inactivo (a mano o por el aviso automático de
// caducados). Cada notificación lleva su propio estado de leída/no leída,
// guardado en este navegador (localStorage, no en el Sheet — nunca hace
// falta ninguna columna ni escritura extra). Se marca leída solo al
// pincharla, que además te lleva directo a ese cliente (y a su meso, si es
// de tipo sesión).
const CLAVE_NOTIF_LEIDAS = 'kc_notif_leidas';
let notificacionesCache = []; // [{tipo:'sesion'|'inactivo', clave, nombre, correo, fecha?, mesociclo?}]

function cargarLeidas(){
  try { return new Set(JSON.parse(localStorage.getItem(CLAVE_NOTIF_LEIDAS) || '[]')); }
  catch (e) { return new Set(); }
}

// Guarda, y de paso descarta cualquier clave que ya no corresponda a
// ninguna notificación vigente — si no, esta lista solo crecería para
// siempre sin ningún propósito (una sesión de la semana pasada, o un
// cliente que se reactivó, ya no vuelven a aparecer de todos modos).
function guardarLeidas(set){
  const vigentes = new Set(notificacionesCache.map(n => n.clave));
  const podadas = new Set(Array.from(set).filter(k => vigentes.has(k)));
  try { localStorage.setItem(CLAVE_NOTIF_LEIDAS, JSON.stringify(Array.from(podadas))); } catch (e) {}
  return podadas;
}

function marcarNotificacionLeida(n){
  const leidas = cargarLeidas();
  leidas.add(n.clave);
  guardarLeidas(leidas);
}

// Solo estos mesociclos tienen su propia pestaña en esta página — el resto
// (GYM-ANTAGONISTAS, ROCA, DESCANSO) no tiene una vista propia a la que ir.
const MESOS_CON_TAB = ['FMAX', 'REOX', 'DESOX', 'AERO', 'TAPERING'];

function filaNotifHtml(n, leidas){
  const leida = leidas.has(n.clave);
  const claseTipo = n.tipo === 'inactivo' ? ' tipo-inactivo' : n.tipo === 'vence' ? ' tipo-vence' : '';
  const linea1 = n.tipo === 'inactivo'
    ? `${escapeHtml(n.nombre || n.correo)} — pasó a Inactivo`
    : n.tipo === 'vence'
    ? `${escapeHtml(n.nombre || n.correo)} — vence en ${n.diasRestantes === 0 ? 'hoy' : n.diasRestantes === 1 ? '1 día' : n.diasRestantes + ' días'}`
    : `${escapeHtml(n.nombre || n.correo)} — ${escapeHtml(n.mesociclo || '—')}`;
  const linea2 = n.tipo === 'inactivo' ? escapeHtml(n.correo)
    : n.tipo === 'vence' ? `Fin de contrato: ${escapeHtml(n.fechaFin || '—')}`
    : `Sesión del ${escapeHtml(n.fecha || '—')}`;
  return `
    <button type="button" class="fila-notif${claseTipo}${leida ? ' leida' : ' no-leida'}" data-clave="${escapeHtml(n.clave)}">
      <div class="linea1">${linea1}</div>
      <div class="linea2">${linea2}</div>
    </button>`;
}

function renderNotificaciones(){
  const cont = document.getElementById('contenidoNotificaciones');
  const badge = document.getElementById('badgeNotificaciones');
  const btn = document.getElementById('btnNotificaciones');
  const leidas = cargarLeidas();

  const hayNoLeidas = notificacionesCache.some(n => !leidas.has(n.clave));
  badge.hidden = !hayNoLeidas;
  btn.classList.toggle('tiene-nuevas', hayNoLeidas);

  if (!notificacionesCache.length) {
    cont.innerHTML = `<div class="vacio-notif">Sin notificaciones.</div>`;
    return;
  }

  const inactivos = notificacionesCache.filter(n => n.tipo === 'inactivo');
  const vencen = notificacionesCache.filter(n => n.tipo === 'vence');
  const sesiones = notificacionesCache.filter(n => n.tipo === 'sesion');

  let html = '';
  if (inactivos.length) {
    html += `<div class="cab-notif">Clientes pasados a Inactivo</div>`;
    html += inactivos.map(n => filaNotifHtml(n, leidas)).join('');
  }
  if (vencen.length) {
    html += `<div class="cab-notif">Vencen esta semana</div>`;
    html += vencen.map(n => filaNotifHtml(n, leidas)).join('');
  }
  html += `<div class="cab-notif">Sesiones registradas esta semana</div>`;
  html += sesiones.length
    ? sesiones.map(n => filaNotifHtml(n, leidas)).join('')
    : `<div class="vacio-notif">Sin sesiones registradas esta semana.</div>`;
  cont.innerHTML = html;
}

async function cargarNotificaciones(){
  const cont = document.getElementById('contenidoNotificaciones');
  try {
    const [resSesiones, resClientes] = await Promise.all([
      fetch('/api/obtener-historial-sesiones?accion=recientes'),
      fetch('/api/listar-clientes?completo=1'),
    ]);
    const dataSesiones = await resSesiones.json();
    const dataClientes = await resClientes.json();

    if (!dataSesiones.success && !dataClientes.success) {
      cont.innerHTML = `<div class="vacio-notif">${escapeHtml(dataSesiones.error || dataClientes.error || 'No se pudo cargar.')}</div>`;
      return;
    }

    const sesiones = dataSesiones.success ? dataSesiones.sesiones.map(s => ({
      tipo: 'sesion', clave: `sesion|${s.correo}|${s.fecha}|${s.mesociclo}`,
      nombre: s.nombre, correo: s.correo, fecha: s.fecha, mesociclo: s.mesociclo,
    })) : [];

    // "Inactivo" cubre tanto el estado exacto "Inactivo" como cualquier otra
    // cosa que no sea "Activo" — igual que ya hace api/verificar-cliente.js.
    const inactivos = dataClientes.success ? dataClientes.clientes
      .filter(c => (c.estado || '').trim().toLowerCase() !== 'activo')
      .map(c => ({ tipo: 'inactivo', clave: `inactivo|${c.email}`, nombre: c.nombreCompleto, correo: c.email }))
      : [];

    // Aviso de "vence esta semana" — clientes activos cuya fecha de fin cae
    // dentro de los próximos 7 días (0 = hoy). No usa clave con fecha para
    // que, una vez leída, no vuelva a aparecer cada día por el mismo motivo
    // mientras siga sin renovarse — si se renueva, sale del rango de 7 días
    // y desaparece sola de la lista.
    const vencen = dataClientes.success ? dataClientes.clientes
      .filter(c => (c.estado || '').trim().toLowerCase() === 'activo' && c.fechaFin)
      .map(c => {
        const fin = parseFechaDDMMYYYY(c.fechaFin);
        if (!fin) return null;
        const diasRestantes = Math.ceil((fin - new Date()) / 86400000);
        return { ...c, diasRestantes };
      })
      .filter(c => c && c.diasRestantes >= 0 && c.diasRestantes <= 7)
      .map(c => ({ tipo: 'vence', clave: `vence|${c.email}`, nombre: c.nombreCompleto, correo: c.email, fechaFin: c.fechaFin, diasRestantes: c.diasRestantes }))
      : [];

    notificacionesCache = [...inactivos, ...vencen, ...sesiones];
    renderNotificaciones();
  } catch (e) {
    cont.innerHTML = `<div class="vacio-notif">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

// Si el cliente de la notificación ya no está Activo, el desplegable de
// clientes (que solo lista activos) no tiene su opción — se añade al vuelo
// para que el selector refleje de verdad a quién se está viendo.
function asegurarOpcionCliente(correo, nombre){
  const sel = document.getElementById('selectorCliente');
  if (!Array.from(sel.options).some(o => o.value === correo)) {
    const opt = document.createElement('option');
    opt.value = correo;
    opt.textContent = `${nombre || correo} (Inactivo)`;
    sel.appendChild(opt);
  }
}

// Pinchar una notificación: la marca leída y selecciona a ese cliente — las
// de sesión, además, saltan directamente a su meso (o, si era un día de
// gimnasio con dominadas, a FMAX con "Dominadas con lastre" ya elegido); las
// de cliente pasado a inactivo o próximo a vencer llevan a Clientes,
// filtrado a ese cliente (para renovarlo con "+1 mes"/"+3 meses" o editar
// su fecha de fin directamente).
async function irANotificacion(n){
  marcarNotificacionLeida(n);
  renderNotificaciones();

  if (n.tipo === 'inactivo' || n.tipo === 'vence') {
    location.href = 'Clientes.html?correo=' + encodeURIComponent(n.correo);
    return;
  }

  asegurarOpcionCliente(n.correo, n.nombre);
  document.getElementById('selectorCliente').value = n.correo;
  localStorage.setItem('kaska_cliente_actual', n.correo);

  if (n.tipo === 'sesion') {
    let mesoDestino = n.mesociclo;
    let variableDestino = null;
    if (mesoDestino === 'GYM-FMAX') {
      mesoDestino = 'FMAX';
      variableDestino = 'dominadas';
    } else if (!MESOS_CON_TAB.includes(mesoDestino)) {
      // GYM-ANTAGONISTAS/ROCA/DESCANSO no tienen pestaña propia — nos quedamos
      // en la que ya estuviera activa, al menos el cliente sí queda elegido.
      mesoDestino = MESO_ACTIVO;
    }
    MESO_ACTIVO = mesoDestino;
    pintarTabs();
    poblarSelectorVariable();
    if (variableDestino) {
      VARIABLE_ACTIVA = variableDestino;
      document.getElementById('selectorVariable').value = variableDestino;
    }
  }

  panelNotificaciones.classList.remove('abierto');
  await cargarCliente(n.correo);
  document.getElementById('panelDatos').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('contenidoNotificaciones').addEventListener('click', (e) => {
  const fila = e.target.closest('.fila-notif');
  if (!fila) return;
  const n = notificacionesCache.find(item => item.clave === fila.dataset.clave);
  if (n) irANotificacion(n);
});

const panelNotificaciones = document.getElementById('panelNotificaciones');
document.getElementById('btnNotificaciones').addEventListener('click', (e) => {
  e.stopPropagation();
  panelNotificaciones.classList.toggle('abierto');
});
document.addEventListener('click', (e) => {
  if (!panelNotificaciones.contains(e.target) && e.target.id !== 'btnNotificaciones') {
    panelNotificaciones.classList.remove('abierto');
  }
});

cargarNotificaciones();
</script>
