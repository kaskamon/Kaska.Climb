<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="libs/clientes-selector.js"></script>
<style>
  :root{
    --stone-900:#1c211e; --stone-800:#262d28; --stone-700:#333b34;
    --chalk:#f2ede1; --chalk-dim:#c9c3b4; --chalk-faint:#8d9187;
    --moss:#7c9070; --moss-light:#a7bd98; --moss-deep:#4d5c46;
    --amber:#c99a5b; --danger:#c9705b;
    --meso-fmax:#c17c74; --meso-reox:#7c9070; --meso-desox:#70908c; --meso-aero:#93859e; --meso-tapering:#c99a5b;
    --line:rgba(242,237,225,0.10); --line-strong:rgba(242,237,225,0.16);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--stone-900); color:var(--chalk); font-family:'Work Sans', sans-serif; }
  h1,h2,h3{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.4px; margin:0; }

  .topbar{ position:sticky; top:0; z-index:40; background:rgba(28,33,30,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-strong); }
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:11px; letter-spacing:4px; font-weight:700; color:var(--moss-light); text-transform:uppercase; }
  .eyebrow::before{ content:""; width:16px; height:2px; background:var(--moss-light); }
  .brand h1{ font-size:22px; }
  .icon-btn{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; transition:all .2s ease;
  }
  .icon-btn:hover{ background:var(--moss); border-color:var(--moss); color:var(--stone-900); }

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
  .cabecera-pagina{ margin-bottom:22px; }
  .cabecera-pagina h2{ font-size:26px; }
  .cabecera-pagina p{ color:var(--chalk-dim); font-size:13.5px; margin:6px 0 0; max-width:64ch; }

  .card{ background:rgba(38,45,40,0.55); border:1px solid var(--line-strong); border-radius:18px; backdrop-filter:blur(8px); padding:26px 28px 30px; }

  .selector-fila{ display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; margin-bottom:26px; }
  .selector-cliente{ display:flex; flex-direction:column; gap:6px; }
  .selector-cliente label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--chalk-faint); }
  .selector-cliente select{
    background:var(--stone-800); border:1px solid var(--line-strong); color:var(--chalk);
    border-radius:10px; padding:11px 14px; font-size:13.5px; font-weight:600; min-width:230px; font-family:inherit;
  }
  .tabs-meso{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-meso{
    font-size:11.5px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase;
    padding:9px 15px; border-radius:9px; border:1px solid var(--line-strong); color:var(--chalk-dim);
    cursor:pointer; transition:all .15s ease; background:none; font-family:inherit;
  }
  .tab-meso.activo{ color:var(--stone-900); border-color:transparent; }

  .estado-panel{ color:var(--chalk-dim); font-size:13px; padding:30px 0; text-align:center; }

  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .stat-tile{ background:var(--stone-800); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat-tile .k{ font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--chalk-faint); }
  .stat-tile .v{ font-family:'Anton',sans-serif; font-size:26px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-tile .v small{ font-family:'Work Sans',sans-serif; font-size:13px; font-weight:700; color:var(--chalk-faint); margin-left:3px; }
  .stat-tile .delta{ font-size:11.5px; font-weight:700; margin-top:4px; }
  .stat-tile .delta.up{ color:var(--moss-light); }
  .stat-tile .delta.down{ color:var(--danger); }

  .chart-shell{ background:var(--stone-800); border:1px solid var(--line); border-radius:16px; padding:22px 22px 12px; margin-bottom:26px; }
  .chart-shell .leyenda{ display:flex; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .leyenda .item{
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--chalk-dim); font-weight:600;
    background:none; border:1px solid var(--line-strong); border-radius:99px; padding:5px 12px 5px 9px;
    cursor:pointer; font-family:inherit; transition:all .15s ease;
  }
  .leyenda .item:hover{ border-color:var(--chalk-faint); }
  .leyenda .item.off{ color:var(--chalk-faint); opacity:0.55; }
  .leyenda .item.off .sw{ opacity:0.4; }
  .leyenda .sw{ width:14px; height:3px; border-radius:2px; flex:0 0 auto; }
  .chart-holder{ position:relative; }
  .chart-holder svg{ display:block; width:100%; height:auto; overflow:visible; }
  .grafica .eje-label{ font-size:10.5px; fill:var(--chalk-faint); font-family:'Work Sans',sans-serif; }
  .grafica .grid-linea{ stroke:rgba(242,237,225,0.08); stroke-width:1; }
  .grafica .punto-final{ stroke:var(--stone-800); stroke-width:2; }

  .tabla-datos-wrap{ overflow-x:auto; }
  table.tabla-datos{ width:100%; border-collapse:collapse; }
  table.tabla-datos th{ text-align:left; font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--chalk-faint); font-weight:700; padding:10px 14px; white-space:nowrap; border-bottom:1px solid var(--line-strong); }
  table.tabla-datos td{ padding:10px 14px; font-size:12.5px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.tabla-datos td.no-entrenada{ color:var(--chalk-faint); font-style:italic; }
  table.tabla-datos tbody tr:last-child td{ border-bottom:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="eyebrow">Kaska.Climb</div>
      <h1>Seguimiento</h1>
    </div>
    <a class="icon-btn" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Inicio
    </a>
  </div>
</div>

<div class="wrap">
  <div class="cabecera-pagina">
    <h2>Progresión por mesociclo</h2>
    <p>PFinicial y Fmax de cada cliente, convertidos en gráfica en vez de columnas anchas del Sheet.</p>
  </div>

  <div class="card">
    <div class="selector-fila">
      <div class="selector-cliente">
        <label>Cliente</label>
        <select id="selectorCliente"><option value="">Cargando clientes…</option></select>
      </div>
      <div class="tabs-meso" id="tabsMeso">
        <button class="tab-meso" data-meso="REOX" style="--c:var(--meso-reox);">REOX</button>
        <button class="tab-meso" data-meso="AERO" style="--c:var(--meso-aero);">AERO</button>
        <button class="tab-meso" data-meso="DESOX" style="--c:var(--meso-desox);">DESOX</button>
        <button class="tab-meso" data-meso="FMAX" style="--c:var(--meso-fmax);">FMAX</button>
      </div>
    </div>

    <div id="panelDatos"><div class="estado-panel">Elige un cliente para ver su progresión.</div></div>
  </div>
</div>

<script>
const MESO_COLORS = { REOX:'#7c9070', AERO:'#93859e', DESOX:'#70908c', FMAX:'#c17c74' };
let PORMESOCICLO = null;
let MESO_ACTIVO = 'REOX';

// Qué líneas se ven en la gráfica — las 3 son informativas por igual
// (PFinicial y Fmax 5" mano der./izq.), así que se pueden activar y
// desactivar por separado en vez de forzar verlas siempre todas juntas.
const VARIABLES = {
  pfInicial: { label: 'PFinicial (test al empezar)', color: null }, // null = color del mesociclo activo
  fmaxDer:   { label: 'Fmax 5" mano derecha', color: '#c99a5b' },
  fmaxIzq:   { label: 'Fmax 5" mano izquierda', color: '#6f8ea6' },
};
const VARIABLES_ACTIVAS = { pfInicial: true, fmaxDer: true, fmaxIzq: true };
let HISTORIAL_ACTUAL = null;

function escapeHtml(str){
  return (str == null ? '' : String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Gráfica de líneas dibujada a mano en SVG (mismo criterio que los radares de
// Batería test.html / cliente/perfil-fisiologico.html) — sin depender de
// ninguna librería externa.
function dibujarGrafica(svg, historial, colorPrincipal){
  const M = { left:44, right:14, top:16, bottom:30 };
  const W = 640, H = 260;
  const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;

  const soloValores = campo => historial.map(h => h[campo]).filter(v => v !== undefined && v !== null);
  const camposActivos = Object.keys(VARIABLES).filter(c => VARIABLES_ACTIVAS[c]);
  const todosLosValores = camposActivos.flatMap(soloValores);
  const hayValores = todosLosValores.length > 0;
  const rawMin = hayValores ? Math.min(...todosLosValores) : 0;
  const rawMax = hayValores ? Math.max(...todosLosValores) : 10;
  const margen = Math.max(6, (rawMax - rawMin) * 0.12);
  const yMin = Math.floor((rawMin - margen) / 5) * 5;
  const yMax = Math.ceil((rawMax + margen) / 5) * 5;

  const n = historial.length;
  const x = i => M.left + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);
  const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

  let svgStr = '';

  // Rejilla horizontal + etiquetas del eje Y (4 franjas).
  const pasosY = 4;
  for(let p = 0; p <= pasosY; p++){
    const valor = yMin + (yMax - yMin) * (p / pasosY);
    const yy = y(valor);
    svgStr += `<line class="grid-linea" x1="${M.left}" y1="${yy.toFixed(1)}" x2="${W - M.right}" y2="${yy.toFixed(1)}"/>`;
    svgStr += `<text class="eje-label" x="${M.left - 8}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="middle">${Math.round(valor)}N</text>`;
  }

  // Etiquetas del eje X — si hay muchos puntos, se muestra solo una de cada
  // varias para que no se amontonen.
  const salto = Math.max(1, Math.ceil(n / 8));
  historial.forEach((h, i) => {
    if(i % salto !== 0 && i !== n - 1) return;
    svgStr += `<text class="eje-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(h.fecha)}</text>`;
  });

  function trazado(valores, color, relleno){
    const pts = [];
    valores.forEach((v, i) => { if(v !== undefined && v !== null) pts.push([x(i), y(v)]); });
    if(pts.length < 2) return '';
    let s = `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(relleno){
      const area = `${M.left},${(M.top+plotH).toFixed(1)} ` + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') + ` ${pts[pts.length-1][0].toFixed(1)},${(M.top+plotH).toFixed(1)}`;
      s = `<polygon points="${area}" fill="${color}" fill-opacity="0.14"/>` + s;
    }
    pts.forEach(([px,py], idx) => {
      const esUltimo = idx === pts.length - 1;
      s += `<circle class="${esUltimo?'punto-final':''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${esUltimo?4.5:3}" fill="${color}"/>`;
    });
    return s;
  }

  if(VARIABLES_ACTIVAS.pfInicial) svgStr += trazado(historial.map(h=>h.pfInicial), colorPrincipal, true);
  if(VARIABLES_ACTIVAS.fmaxDer) svgStr += trazado(historial.map(h=>h.fmaxDer), VARIABLES.fmaxDer.color, false);
  if(VARIABLES_ACTIVAS.fmaxIzq) svgStr += trazado(historial.map(h=>h.fmaxIzq), VARIABLES.fmaxIzq.color, false);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgStr;
}

document.querySelectorAll('.tab-meso').forEach(tab => {
  tab.addEventListener('click', () => { MESO_ACTIVO = tab.dataset.meso; pintarTabs(); pintarDatos(); });
});
function pintarTabs(){
  document.querySelectorAll('.tab-meso').forEach(tab => {
    const on = tab.dataset.meso === MESO_ACTIVO;
    tab.classList.toggle('activo', on);
    tab.style.background = on ? tab.style.getPropertyValue('--c') : '';
  });
}
pintarTabs();

async function cargarCliente(email){
  const panel = document.getElementById('panelDatos');
  if(!email){ panel.innerHTML = '<div class="estado-panel">Elige un cliente para ver su progresión.</div>'; return; }
  panel.innerHTML = '<div class="estado-panel">Cargando historial…</div>';
  try{
    const res = await fetch('/api/obtener-historial?' + new URLSearchParams({ cliente: email }).toString());
    const data = await res.json();
    if(!data.success){
      panel.innerHTML = `<div class="estado-panel">${escapeHtml(data.error || 'No se pudo cargar el historial.')}</div>`;
      return;
    }
    PORMESOCICLO = data.porMesociclo;
    pintarDatos();
  }catch(e){
    panel.innerHTML = `<div class="estado-panel">Error de red: ${escapeHtml(e.message)}</div>`;
  }
}

function pintarDatos(){
  const panel = document.getElementById('panelDatos');
  if(!PORMESOCICLO) return;
  const historial = (PORMESOCICLO[MESO_ACTIVO] || []).filter(h => h.entrenada);

  if(!historial.length){
    panel.innerHTML = '<div class="estado-panel">Este cliente todavía no tiene sesiones entrenadas de este mesociclo.</div>';
    return;
  }

  const ultimo = historial[historial.length - 1];
  const primero = historial[0];
  const media = Math.round(historial.reduce((s,h) => s + h.pfInicial, 0) / historial.length);
  const tendencia = primero.pfInicial ? ((ultimo.pfInicial - primero.pfInicial) / primero.pfInicial * 100) : 0;
  const noRecuperadas = (PORMESOCICLO[MESO_ACTIVO] || []).filter(h => !h.entrenada).length;

  panel.innerHTML = `
    <div class="stat-tiles">
      <div class="stat-tile"><div class="k">PFinicial medio</div><div class="v">${media}<small>N</small></div></div>
      <div class="stat-tile">
        <div class="k">Tendencia (${historial.length} ses.)</div>
        <div class="v" style="color:${tendencia>=0?'var(--moss-light)':'var(--danger)'};">${tendencia>=0?'+':''}${tendencia.toFixed(1)}<small>%</small></div>
        <div class="delta ${tendencia>=0?'up':'down'}">${tendencia>=0?'↑ progresando':'↓ en descenso'}</div>
      </div>
      <div class="stat-tile"><div class="k">Última PFinicial</div><div class="v">${ultimo.pfInicial}<small>N</small></div></div>
      <div class="stat-tile"><div class="k">Sesiones no recuperadas</div><div class="v">${noRecuperadas}<small>/${historial.length + noRecuperadas}</small></div></div>
    </div>
    <div class="chart-shell">
      <div class="leyenda" id="leyendaVariables">
        ${Object.keys(VARIABLES).map(campo => {
          const v = VARIABLES[campo];
          const color = v.color || MESO_COLORS[MESO_ACTIVO];
          const off = !VARIABLES_ACTIVAS[campo];
          return `<button type="button" class="item${off?' off':''}" data-campo="${campo}"><span class="sw" style="background:${color};"></span>${escapeHtml(v.label)}</button>`;
        }).join('')}
      </div>
      <div class="chart-holder"><svg class="grafica" id="chartPF" viewBox="0 0 640 260"></svg></div>
    </div>
    <div class="tabla-datos-wrap">
      <table class="tabla-datos">
        <thead><tr><th>Fecha</th><th>PFinicial (N)</th><th>Fmax izq. (N)</th><th>Fmax der. (N)</th><th>Sesión</th></tr></thead>
        <tbody>${(PORMESOCICLO[MESO_ACTIVO] || []).map(h => h.entrenada
          ? `<tr><td>${escapeHtml(h.fecha)}</td><td>${h.pfInicial}</td><td>${h.fmaxIzq ?? '—'}</td><td>${h.fmaxDer ?? '—'}</td><td>Entrenada</td></tr>`
          : `<tr><td>${escapeHtml(h.fecha)}</td><td>${h.pfInicial}</td><td class="no-entrenada">—</td><td class="no-entrenada">—</td><td class="no-entrenada">No recuperado</td></tr>`
        ).join('')}</tbody>
      </table>
    </div>`;

  HISTORIAL_ACTUAL = historial;
  dibujarGrafica(document.getElementById('chartPF'), historial, MESO_COLORS[MESO_ACTIVO]);

  document.getElementById('leyendaVariables').querySelectorAll('[data-campo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const campo = btn.dataset.campo;
      VARIABLES_ACTIVAS[campo] = !VARIABLES_ACTIVAS[campo];
      btn.classList.toggle('off', !VARIABLES_ACTIVAS[campo]);
      dibujarGrafica(document.getElementById('chartPF'), HISTORIAL_ACTUAL, MESO_COLORS[MESO_ACTIVO]);
    });
  });
}

(async function init(){
  const sel = document.getElementById('selectorCliente');
  await cargarSelectorClientes(sel);
  sel.addEventListener('change', () => cargarCliente(sel.value));
  if(sel.value) cargarCliente(sel.value);
})();
</script>
</body>
</html>
