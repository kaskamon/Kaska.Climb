<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaska.Climb">
<link rel="apple-touch-icon" href="logo-192.png">
<meta name="theme-color" content="#1c211e">
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Semanas</title>

<script src="libs/Sortable.min.js"></script>
<script src="libs/clientes-selector.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --stone-900:#1c211e;
  --stone-800:#262d28;
  --stone-700:#333b34;
  --chalk:#f2ede1;
  --chalk-dim:#c9c3b4;
  --moss:#7c9070;
  --moss-light:#a7bd98;
  --moss-deep:#4d5c46;

  --roca-roco: #7c9070;
  --sesion-roco: #7791a0;
  --descanso: #a3695c;
  --gym-antagonistas: #8d9187;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Work Sans', sans-serif;
  background: radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--stone-900) 55%, #121614 100%);
  color: var(--chalk);
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.fondo-logo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('logo.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100%;
  opacity: 0.2;
  z-index: -10;
}

.layout-editor {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

.contenedor-principal {
  width: 400px;
  flex-shrink: 0;
  background: rgba(38,45,40,0.55);
  padding: 24px;
  border-radius: 20px;
  border: 1px solid rgba(242,237,225,0.12);
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 700;
  color: var(--moss-light);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.eyebrow::before {
  content: "";
  width: 20px;
  height: 2px;
  background: var(--moss-light);
}

.header {
  display: grid;
  grid-template-columns: repeat(4, max-content);
  justify-content: space-between;
  gap: 0 10px;
  background: rgba(0,0,0,0.2);
  padding: 8px 10px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid rgba(242,237,225,0.08);
}

.head-item {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--chalk-dim);
  line-height: 1.2;
}

.head-val {
  background: var(--stone-800);
  border: 1px solid rgba(242,237,225,0.16);
  border-radius: 6px;
  font-weight: 700;
  font-family: 'Work Sans', sans-serif;
  color: var(--moss-light);
  padding: 2px 6px;
  display: inline-block;
  margin-top: 3px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.head-val:hover {
  border-color: var(--moss);
  color: var(--chalk);
}
select.head-select {
  outline: none;
}
select.head-select option {
  background: var(--stone-800);
  color: var(--chalk);
}

.date-input-hidden {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.semana-grid {
  display: grid;
  gap: 10px;
  background: rgba(0,0,0,0.2);
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(242,237,225,0.08);
}

.dia-columna {
  background: var(--stone-800);
  border-radius: 10px;
  padding: 8px;
  border: 1px solid rgba(242,237,225,0.1);
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  transition: border-color 0.2s ease;
}
.dia-columna:hover {
  border-color: rgba(124,144,112,0.4);
}

.dia-nombre {
  width: 38px;
  min-width: 38px;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--chalk-dim);
  text-transform: uppercase;
  font-weight: 700;
  text-align: center;
  background: rgba(242,237,225,0.06);
  padding: 6px 4px;
  border-radius: 6px;
  pointer-events: none;
  user-select: none;
}

/* Contenedor real que gestiona Sortable — el nombre del día vive fuera de él
   a propósito, para que nunca pueda desplazarse al soltar una caja encima. */
.dia-sesiones {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
  min-height: 28px;
}

.sesion {
  background: var(--stone-800);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: move;
  border: 1px solid rgba(242,237,225,0.16);
  flex-grow: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 45px;
  text-transform: uppercase;
  color: var(--chalk-dim);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: transform 0.15s ease, filter 0.15s ease;
  /* Sin esto, en tablet/móvil el navegador interpreta el toque como
     scroll/selección de texto en vez de dejarle el gesto a Sortable. */
  touch-action: none;
}
.sesion::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex: 0 0 auto;
}
.sesion:hover {
  filter: brightness(1.25);
}

.sesion.roca { color: var(--roca-roco) !important; border-color: rgba(124,144,112,0.35) !important; }
.sesion.sesion-roco { color: var(--sesion-roco) !important; border-color: rgba(119,145,160,0.35) !important; }
.sesion.descanso { color: var(--descanso) !important; border-color: rgba(163,105,92,0.35) !important; }
.sesion.gym { color: var(--gym-antagonistas) !important; border-color: rgba(141,145,135,0.35) !important; }

.sesion-contenido {
  display: grid;
  grid-template-columns: 20px 1fr;
  align-items: center;
  width: 100%;
  gap: 5px;
}

.sesion-text {
  grid-column: 2;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  outline: none;
  font-family: 'Work Sans', sans-serif;
}

.btn-del-sesion {
  grid-column: 1;
  color: inherit;
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  opacity: 0.7;
}
.btn-del-sesion:hover {
  opacity: 1;
}
/* La X solo tiene sentido una vez la sesión está colocada en un día de la
   semana — en el banco (las plantillas de origen) se oculta, porque
   arrastrar clona la plantilla y borrar el original la quitaría del banco
   entero. */
#banco .btn-del-sesion {
  display: none;
}


.btn-action {
  background: var(--stone-800);
  border: 1px solid rgba(242,237,225,0.16);
  color: var(--chalk);
  padding: 10px 0;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  width: 100%;
  display: block;
  box-sizing: border-box;
  font-family: 'Work Sans', sans-serif;
  transition: all 0.2s ease;
}
.btn-action:hover {
  background: var(--moss);
  color: var(--stone-900);
  border-color: var(--moss);
}
.btn-action:disabled {
  opacity: 0.6;
  cursor: default;
}
.btn-action:disabled:hover {
  background: var(--stone-800);
  color: var(--chalk);
  border-color: rgba(242,237,225,0.16);
}

#banco {
  width: 300px;
  padding: 20px;
  border: 1px solid rgba(242,237,225,0.12);
  background: rgba(38,45,40,0.55);
  border-radius: 20px;
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

#banco h4 {
  margin: 0 0 6px 0;
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-size: 16px;
  color: var(--chalk);
}

.panel-derecho {
  width: 300px;
  display: flex;
  flex-direction: column;
}

.panel-publicar-semana {
  width: 300px;
  background: rgba(38,45,40,0.55);
  border: 1px solid rgba(242,237,225,0.12);
  border-radius: 16px;
  padding: 16px;
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.panel-publicar-semana input, .panel-publicar-semana select {
  background: var(--stone-800); border: 1px solid rgba(242,237,225,0.16);
  color: var(--chalk); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  font-family: 'Work Sans', sans-serif;
}
.estado-publicar-semana { font-size: 11px; color: var(--chalk-dim); line-height: 1.5; max-height: 160px; overflow-y: auto; }
.estado-publicar-semana div.ok { color: var(--moss-light); }
.estado-publicar-semana div.error { color: #d99a8f; }

.estado-macrociclo { font-size: 10.5px; color: var(--chalk-dim); line-height: 1.4; margin: -4px 0 10px; }
.estado-macrociclo.error { color: #d99a8f; font-weight: 700; }
.estado-macrociclo.ok { color: var(--moss-light); }

@media screen and (max-width: 820px) {
  body {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 12px;
    overflow-x: auto;
  }

  .layout-editor {
    flex-direction: row;
    align-items: flex-start;
    justify-content: flex-start;
    width: max-content;
  }

  .contenedor-principal {
    width: 400px;
  }

  .panel-derecho {
    width: 300px;
  }

  #banco {
    width: 300px;
  }
}

@media print {
  @page {
    size: 67mm 100mm;
    margin: 0;
  }

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 67mm !important;
    background: #000 !important;
    color: #fff !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .fondo-logo,
  .eyebrow,
  .panel-derecho,
  #banco,
  .no-print,
  .btn-action {
    display: none !important;
    visibility: hidden !important;
  }

  .layout-editor {
    display: block !important;
    width: 67mm !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #000 !important;
  }

  .contenedor-principal {
    display: block !important;
    width: 67mm !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 2mm !important;
    border: none !important;
    border-radius: 0 !important;
    background: #000 !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
  }
}
</style>
</head>

<body>
<div class="fondo-logo"></div>

<div class="layout-editor">
  <div class="contenedor-principal" id="panelExportable">
    <div class="eyebrow no-print">Kaska.Climb</div>

    <div class="header">
      <div class="head-item">
        Semana:
        <br>
        <span class="head-val" id="h1">—</span>
      </div>

      <div class="head-item">
        Fecha:
        <br>
        <span class="head-val" id="displayDate" onclick="abrirSelectorFecha()">DD/MM/AAAA</span>
        <input type="date" id="hiddenDate" class="date-input-hidden" onchange="actualizarFecha(this.value)">
      </div>

      <div class="head-item">
        Mesociclo:
        <br>
        <span class="head-val" id="h3">—</span>
      </div>

      <div class="head-item">
        Sem. Meso.:
        <br>
        <span class="head-val" id="h4">—</span>
      </div>
    </div>
    <div class="estado-macrociclo no-print" id="estadoMacrociclo"></div>

    <div class="semana-grid" id="grid">
      <div class="dia-columna" id="d1">
        <div class="dia-nombre">LUN</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d2">
        <div class="dia-nombre">MAR</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d3">
        <div class="dia-nombre">MIÉ</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d4">
        <div class="dia-nombre">JUE</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d5">
        <div class="dia-nombre">VIE</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d6">
        <div class="dia-nombre">SÁB</div>
        <div class="dia-sesiones"></div>
      </div>

      <div class="dia-columna" id="d7">
        <div class="dia-nombre">DOM</div>
        <div class="dia-sesiones"></div>
      </div>
    </div>
  </div>

  <div class="panel-derecho">
    <div id="banco" class="no-print">
      <h4>Banco de sesiones</h4>

      <div class="sesion sesion-roco" data-tipo="sesion">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">SESIÓN (ROCO)</span>
        </div>
      </div>

      <div class="sesion gym" data-tipo="gym-fmax">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">GYM-FMAX</span>
        </div>
      </div>

      <div class="sesion gym" data-tipo="gym-antagonistas">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">GYM-ANTAGONISTAS</span>
        </div>
      </div>

      <div class="sesion roca" data-tipo="roca">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">Roca/roco</span>
        </div>
      </div>

      <div class="sesion descanso" data-tipo="descanso">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">Descanso</span>
        </div>
      </div>
    </div>

    <div class="panel-publicar-semana no-print">
      <select id="publicarClienteSemana"><option value="">Cargando clientes...</option></select>
      <button class="btn-action" id="btnCargarUltimaSemana" type="button">Cargar semana</button>
      <button class="btn-action" id="btnDisenarSesion" type="button" disabled>Diseñar sesión de este mesociclo</button>
      <div id="wrapCalidadTapering" class="no-print" hidden style="font-size:0.85em; margin-top:4px;">
        Tapering de:
        <select id="selectorCalidadTapering"></select>
      </div>
      <button class="btn-action" id="btnPublicarSemana" type="button">Publicar semana completa</button>
      <button class="btn-action" onclick="limpiarTabla()">Limpiar Tabla</button>
      <button class="btn-action" id="btnBorrarSemana" type="button">Borrar semana publicada</button>
      <button class="btn-action" onclick="window.location.href='index.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Inicio
      </button>
      <div class="estado-publicar-semana" id="estadoPublicarSemana"></div>
    </div>
  </div>
</div>

<script>
function act() {
  if (window.Sortable) {
    document.querySelectorAll('.dia-sesiones').forEach(d => {
      new Sortable(d, {
        group: 's',
        // En táctil, un pequeño retraso antes de iniciar el arrastre deja
        // que un toque normal siga sirviendo para tocar la X o el texto
        // editable sin que se confunda con querer arrastrar. Sin
        // touchStartThreshold, el más mínimo temblor del dedo durante esa
        // espera (unos pocos px — inevitable con un dedo real, a diferencia
        // del ratón) cancela el arrastre antes de que llegue a empezar, que
        // es justo lo que pasaba en tablet.
        delay: 150,
        delayOnTouchOnly: true,
        touchStartThreshold: 15,
      });
    });

    new Sortable(document.getElementById('banco'), {
      group: {
        name: 's',
        pull: 'clone',
        put: false
      },
      sort: false,
      delay: 150,
      delayOnTouchOnly: true,
      touchStartThreshold: 15,
    });
  } else {
    alert("No se ha cargado Sortable.min.js. Revisa que esté en la carpeta libs.");
  }
}

function abrirSelectorFecha() {
  const input = document.getElementById('hiddenDate');

  if (input.showPicker) {
    input.showPicker();
  } else {
    input.click();
  }
}

function actualizarFecha(val) {
  if (!val) return;

  let [y, m, d] = val.split('-').map(Number);
  const fecha = new Date(y, m - 1, d);
  const diaSemana = fecha.getDay(); // 0=Dom, 1=Lun, ... 6=Sáb

  // La "Fecha" es siempre el lunes de la semana (fechaParaDiaIndice suma el
  // índice de cada día a partir de aquí) — si se elige otro día de la
  // semana por error, toda la tabla se publica desplazada (el lunes que
  // diseñaste pasa a aparecer con la fecha de ese otro día). Lo corregimos
  // aquí mismo, al lunes de esa misma semana, en vez de dejar que se publique así.
  if (diaSemana !== 1) {
    const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
    fecha.setDate(fecha.getDate() + offset);
    y = fecha.getFullYear();
    m = fecha.getMonth() + 1;
    d = fecha.getDate();
    const yyyy = String(y).padStart(4, '0');
    const mm = String(m).padStart(2, '0');
    const dd = String(d).padStart(2, '0');
    document.getElementById('hiddenDate').value = `${yyyy}-${mm}-${dd}`;
  }

  const ddStr = String(d).padStart(2, '0');
  const mmStr = String(m).padStart(2, '0');
  document.getElementById('displayDate').innerText = `${ddStr}/${mmStr}/${y}`;

  if (typeof recalcularMesocicloDesdeMacrociclo === 'function') recalcularMesocicloDesdeMacrociclo();
}

function limpiarTabla() {
  document.querySelectorAll('.dia-sesiones').forEach(d => { d.innerHTML = ''; });
}

document.addEventListener('click', e => {
  const s = e.target.closest('.sesion');

  if (e.target.classList.contains('sesion-text')) return;
  if (e.target.classList.contains('btn-del-sesion')) return;

  if (s && s.parentElement && !s.parentElement.id.includes('banco')) {
    e.preventDefault();
    s.after(s.cloneNode(true));
  }
});

// El banco tiene 5 tipos de caja fija (Sesión Roco / Gym-Fmax /
// Gym-Antagonistas / Roca-Roco / Descanso) — el mesociclo real de la
// "SESIÓN (ROCO)" (REOX/AERO/DESOX/FMAX/TAPERING) ya no se elige a mano: se
// calcula solo a partir del macrociclo publicado del cliente (ver
// recalcularMesocicloDesdeMacrociclo), para que nunca pueda quedar mal atado
// a la fecha/cliente equivocados. Los 2 tipos de gym, en cambio, sí se
// eligen a mano arrastrando la caja que toque — no dependen de qué
// mesociclo tenga esa semana, así que no hace falta calcularlos.

// Macrociclos.html guarda cada bloque con una clave de fase en minúsculas
// (fmax/desox/reox/aero/tap) distinta de la clave de mesociclo en mayúsculas
// que usa el resto de la app (FMAX/DESOX/REOX/AERO/TAPERING) — se traduce aquí.
const FASE_A_MESOCICLO = { fmax: 'FMAX', desox: 'DESOX', reox: 'REOX', aero: 'AERO', tap: 'TAPERING' };

let MESOCICLO_ACTUAL = null; // se rellena solo desde el macrociclo real del cliente
let MESOCICLO_ORIGEN_TAPERING = null; // cualidad del bloque anterior, solo si esta semana es TAPERING

// Durante una semana de TAPERING, el entrenador puede elegir etiquetar la
// caja de "sesión" como el TAPERING genérico o como la cualidad de la que
// viene (ver #selectorCalidadTapering) — para el resto de tipos de caja no
// hay elección posible, siempre se resuelven solos.
function mesocicloParaSesion() {
  const selector = document.getElementById('selectorCalidadTapering');
  if (MESOCICLO_ACTUAL === 'TAPERING' && selector && !document.getElementById('wrapCalidadTapering').hidden) {
    return selector.value || MESOCICLO_ACTUAL;
  }
  return MESOCICLO_ACTUAL;
}

function resolverMesocicloCaja(tipo) {
  if (tipo === 'sesion') return mesocicloParaSesion();
  if (tipo === 'gym-fmax') return 'GYM-FMAX';
  if (tipo === 'gym-antagonistas') return 'GYM-ANTAGONISTAS';
  if (tipo === 'roca') return 'ROCA';
  if (tipo === 'descanso') return 'DESCANSO';
  return null;
}

// Dado el macrociclo real de un cliente (inicio + bloques [{fase,semanas}])
// y el lunes de una semana (dd/mm/aaaa), calcula en qué bloque cae esa
// semana y qué número de semana es dentro de ese bloque. Devuelve
// fueraDeRango si la fecha es anterior al inicio o posterior al final del
// macrociclo publicado.
function calcularFaseYSemana(inicioISO, bloques, fechaLunesDDMMYYYY) {
  const [yI, mI, dI] = inicioISO.split('-').map(Number);
  const inicio = new Date(yI, mI - 1, dI);
  const [dL, mL, yL] = fechaLunesDDMMYYYY.split('/').map(Number);
  const lunes = new Date(yL, mL - 1, dL);

  const diffDias = Math.round((lunes - inicio) / 86400000);
  if (diffDias < 0) return { fueraDeRango: true, motivo: 'antes' };

  const semanaGlobal = Math.floor(diffDias / 7) + 1;
  let acumulado = 0;
  const lista = bloques || [];
  for (let idx = 0; idx < lista.length; idx++) {
    const b = lista[idx];
    const semanasBloque = Number(b.semanas) || 0;
    if (semanaGlobal <= acumulado + semanasBloque) {
      const mesociclo = FASE_A_MESOCICLO[b.fase] || String(b.fase || '').toUpperCase();
      // Un tapering es una descarga del ciclo de calidad del que viene — si el
      // bloque anterior es FMAX/REOX/DESOX/AERO, se ofrece como alternativa al
      // "TAPERING" genérico para diseñar/publicar esa semana (ver
      // recalcularMesocicloDesdeMacrociclo y #selectorCalidadTapering).
      let origenTapering = null;
      if (mesociclo === 'TAPERING' && idx > 0) {
        const anterior = lista[idx - 1];
        const mesocicloAnterior = FASE_A_MESOCICLO[anterior.fase] || String(anterior.fase || '').toUpperCase();
        if (['FMAX', 'REOX', 'DESOX', 'AERO'].includes(mesocicloAnterior)) origenTapering = mesocicloAnterior;
      }
      return {
        fueraDeRango: false,
        mesociclo,
        origenTapering,
        semanaEnBloque: semanaGlobal - acumulado,
        semanasBloque,
        semanaGlobal,
      };
    }
    acumulado += semanasBloque;
  }
  return { fueraDeRango: true, motivo: 'despues', semanaGlobal, totalSemanas: acumulado };
}

// Se ejecuta cada vez que cambia el cliente elegido o la fecha (lunes) de la
// cabecera — vuelve a leer el macrociclo real de ese cliente y rellena
// Semana / Mesociclo / Sem. Meso. solos, en vez de que el entrenador tenga
// que teclearlos o elegirlos a mano.
async function recalcularMesocicloDesdeMacrociclo() {
  const cliente = inputPublicarClienteSemana.value.trim();
  const fechaLunes = fechaParaDiaIndice(0);
  const estado = document.getElementById('estadoMacrociclo');
  const h1 = document.getElementById('h1'), h3 = document.getElementById('h3'), h4 = document.getElementById('h4');
  const btnDisenar = document.getElementById('btnDisenarSesion');
  const wrapTapering = document.getElementById('wrapCalidadTapering');

  MESOCICLO_ACTUAL = null;
  MESOCICLO_ORIGEN_TAPERING = null;
  h1.innerText = '—'; h3.innerText = '—'; h4.innerText = '—';
  btnDisenar.disabled = true;
  wrapTapering.hidden = true;
  estado.textContent = ''; estado.className = 'estado-macrociclo no-print';

  if (!cliente || !fechaLunes) return;

  estado.textContent = 'Consultando el macrociclo del cliente...';
  try {
    const res = await fetch('/api/macrociclo?' + new URLSearchParams({ cliente }).toString());
    const data = await res.json();
    if (!data.success) {
      estado.textContent = data.error || 'No se pudo consultar el macrociclo.';
      estado.classList.add('error');
      return;
    }
    if (!data.plan) {
      estado.textContent = 'Este cliente no tiene ningún macrociclo publicado — publícalo primero en Macrociclos.html.';
      estado.classList.add('error');
      return;
    }

    const calc = calcularFaseYSemana(data.plan.inicio, data.plan.bloques, fechaLunes);
    if (calc.fueraDeRango) {
      estado.textContent = calc.motivo === 'antes'
        ? `El macrociclo de ${data.plan.nombre || cliente} empieza el ${data.plan.inicio.split('-').reverse().join('/')} — esta semana es anterior.`
        : `El macrociclo de ${data.plan.nombre || cliente} termina tras ${calc.totalSemanas} semanas — esta fecha ya cae fuera de él.`;
      estado.classList.add('error');
      return;
    }

    MESOCICLO_ACTUAL = calc.mesociclo;
    MESOCICLO_ORIGEN_TAPERING = calc.origenTapering || null;
    h1.innerText = String(calc.semanaGlobal).padStart(2, '0');
    h3.innerText = calc.mesociclo === 'TAPERING' ? 'TAP' : calc.mesociclo; // solo para mostrar — MESOCICLO_ACTUAL sigue siendo 'TAPERING'
    h4.innerText = `${calc.semanaEnBloque}/${calc.semanasBloque}`;
    btnDisenar.disabled = false;

    if (MESOCICLO_ORIGEN_TAPERING) {
      const selector = document.getElementById('selectorCalidadTapering');
      selector.innerHTML = `<option value="TAPERING">TAP genérico</option><option value="${MESOCICLO_ORIGEN_TAPERING}">${MESOCICLO_ORIGEN_TAPERING} (descarga)</option>`;
      selector.value = 'TAPERING';
      wrapTapering.hidden = false;
    } else {
      wrapTapering.hidden = true;
    }
    estado.textContent = `✓ Semana ${calc.semanaEnBloque} de ${calc.semanasBloque} de ${calc.mesociclo} (según el macrociclo de ${data.plan.nombre || cliente}).`;
    estado.classList.add('ok');
  } catch (e) {
    estado.textContent = 'Error de red al consultar el macrociclo: ' + e.message;
    estado.classList.add('error');
  }
}

// La "Fecha" de la cabecera representa el lunes de esta semana. Cada columna de
// día (0=Lun ... 6=Dom) es esa fecha + su desplazamiento.
function fechaParaDiaIndice(indiceDia) {
  const val = document.getElementById('hiddenDate').value; // yyyy-mm-dd
  if (!val) return null;
  const [y, m, d] = val.split('-').map(Number);
  const base = new Date(y, m - 1, d);
  base.setDate(base.getDate() + indiceDia);
  const dd = String(base.getDate()).padStart(2, '0');
  const mm = String(base.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${base.getFullYear()}`;
}

/* ================= PUBLICAR SEMANA COMPLETA ================= */
const inputPublicarClienteSemana = document.getElementById('publicarClienteSemana');
cargarSelectorClientes(inputPublicarClienteSemana);
inputPublicarClienteSemana.addEventListener('change', () => recalcularMesocicloDesdeMacrociclo());

const MESOCICLOS_SEMANA = ['REOX', 'AERO', 'DESOX', 'FMAX', 'TAPERING'];

document.getElementById('btnDisenarSesion').addEventListener('click', () => {
  const cliente = inputPublicarClienteSemana.value.trim();
  if (!cliente || !MESOCICLO_ACTUAL) return;
  const qs = new URLSearchParams({ cliente, mesociclo: mesocicloParaSesion() });
  window.open('Sesiones.html?' + qs.toString(), '_blank');
});

document.getElementById('btnCargarUltimaSemana').addEventListener('click', async () => {
  const cliente = inputPublicarClienteSemana.value.trim();
  const estadoDiv = document.getElementById('estadoPublicarSemana');

  if (!cliente) { alert('Indica el cliente antes de cargar su semana.'); return; }
  if (!document.getElementById('hiddenDate').value) {
    alert('Elige primero la fecha de la semana que quieres cargar (campo "Fecha" arriba).');
    return;
  }

  // Siempre se carga la semana de la fecha elegida en la cabecera — nunca
  // "la última publicada" (un cliente puede tener hasta 2 semanas
  // programadas a la vez, y así se elige cuál de las dos ver).
  const fechaBuscada = fechaParaDiaIndice(0);
  estadoDiv.innerHTML = `Cargando la semana del ${fechaBuscada}...`;

  try {
    const qs = new URLSearchParams({ cliente, fecha: fechaBuscada });
    const res = await fetch('/api/obtener-semana?' + qs.toString());
    const data = await res.json();

    if (!data.success) {
      estadoDiv.innerHTML = `<div class="error">${data.error || 'No se pudo cargar la semana.'}</div>`;
      return;
    }
    if (!data.sesiones.length) {
      estadoDiv.innerHTML = `<div class="error">Este cliente no tiene nada publicado en la semana del ${fechaBuscada}.</div>`;
      return;
    }

    // El lunes que devuelve la propia semana encontrada pasa a ser el de la
    // cabecera — así no hace falta escribirlo antes de cargar, y si luego
    // se vuelve a publicar, las fechas de cada día siguen siendo correctas.
    const fechaLunes = data.dias[0];
    const [ddL, mmL, yyyyL] = fechaLunes.split('/');
    document.getElementById('hiddenDate').value = `${yyyyL}-${mmL}-${ddL}`;
    actualizarFecha(`${yyyyL}-${mmL}-${ddL}`);
    // actualizarFecha ya dispara el recálculo, pero es async — lo esperamos
    // aquí explícitamente para poder comparar contra lo ya publicado.
    await recalcularMesocicloDesdeMacrociclo();

    limpiarTabla();

    // Nunca hay 2 mesociclos en la misma semana — con que aparezca uno de
    // los 4 en cualquier sesión encontrada, ya sabemos el de toda la semana.
    let mesocicloSemana = null;
    data.sesiones.forEach(s => { if (MESOCICLOS_SEMANA.includes(s.mesociclo)) mesocicloSemana = s.mesociclo; });

    data.dias.forEach((fechaDia, i) => {
      const columna = document.getElementById('d' + (i + 1)).querySelector('.dia-sesiones');
      data.sesiones.filter(s => s.fecha === fechaDia).forEach(s => {
        let tipo = null;
        if (MESOCICLOS_SEMANA.includes(s.mesociclo)) tipo = 'sesion';
        else if (s.mesociclo === 'GYM-FMAX') tipo = 'gym-fmax';
        else if (s.mesociclo === 'GYM-ANTAGONISTAS') tipo = 'gym-antagonistas';
        else if (s.mesociclo === 'ROCA') tipo = 'roca';
        else if (s.mesociclo === 'DESCANSO') tipo = 'descanso';
        if (!tipo) return;
        const plantilla = document.querySelector(`#banco .sesion[data-tipo="${tipo}"]`);
        if (plantilla) columna.appendChild(plantilla.cloneNode(true));
      });
    });

    // "Semana" / "Mesociclo" / "Sem. Meso." de la cabecera ya se han
    // recalculado solos (arriba) a partir del macrociclo real — si lo que
    // había publicado no coincide, se avisa en vez de pisar uno con otro en
    // silencio (podría ser que el macrociclo se corrigiera después de
    // publicar esta semana).
    // Si esta semana es TAPERING y lo publicado usaba la cualidad de origen
    // (ver MESOCICLO_ORIGEN_TAPERING), no es un desajuste real — solo hace
    // falta reflejar esa misma elección en el selector.
    const esOrigenTapering = MESOCICLO_ACTUAL === 'TAPERING' && mesocicloSemana === MESOCICLO_ORIGEN_TAPERING;
    if (esOrigenTapering) {
      const selector = document.getElementById('selectorCalidadTapering');
      if (selector) selector.value = MESOCICLO_ORIGEN_TAPERING;
    }

    let aviso = '';
    if (mesocicloSemana && MESOCICLO_ACTUAL && mesocicloSemana !== MESOCICLO_ACTUAL && !esOrigenTapering) {
      aviso = `<div class="error">⚠ Lo publicado esa semana era ${mesocicloSemana}, pero el macrociclo actual dice ${MESOCICLO_ACTUAL} — revisa cuál es correcto antes de volver a publicar.</div>`;
    }

    estadoDiv.innerHTML = `<div class="ok">✓ Cargada la semana del ${fechaLunes} para ${cliente}.</div>` + aviso;
  } catch (e) {
    estadoDiv.innerHTML = `<div class="error">Error de red: ${e.message}</div>`;
  }
});

document.getElementById('btnPublicarSemana').addEventListener('click', async () => {
  const cliente = inputPublicarClienteSemana.value.trim();
  const estadoDiv = document.getElementById('estadoPublicarSemana');

  if (!cliente) { alert('Indica el cliente antes de publicar.'); return; }
  if (!document.getElementById('hiddenDate').value) {
    alert('Indica primero la fecha del lunes de esta semana (campo "Fecha" arriba).');
    return;
  }

  const dias = Array.from(document.querySelectorAll('.dia-columna'));
  const hayCajaDeSesion = dias.some(d => d.querySelector('.sesion[data-tipo="sesion"]'));
  if (hayCajaDeSesion && !MESOCICLO_ACTUAL) {
    alert('No se ha podido determinar el mesociclo de esta semana a partir del macrociclo del cliente — revisa el aviso de arriba antes de publicar.');
    return;
  }

  // "Semana" y "Sem. Meso." ya vienen calculados solos a partir del
  // macrociclo real (ver recalcularMesocicloDesdeMacrociclo) — se publican
  // tal cual, sin volver a tocarlos aquí.
  const semana = document.getElementById('h1').innerText.trim();
  const semanaMesociclo = document.getElementById('h4').innerText.trim();

  const resultados = [];
  estadoDiv.innerHTML = 'Publicando...';

  for (let i = 0; i < dias.length; i++) {
    const caja = dias[i].querySelector('.sesion[data-tipo]');
    if (!caja) continue;

    const mesociclo = resolverMesocicloCaja(caja.dataset.tipo);
    if (!mesociclo) continue;

    const fecha = fechaParaDiaIndice(i);
    const esDiaLibre = mesociclo === 'ROCA' || mesociclo === 'DESCANSO';

    try {
      let sesionAPublicar;
      if (esDiaLibre) {
        // Roca/roco y Descanso no se diseñan en Sesiones.html — no hay
        // ejercicios ni datos que rastrear, solo queda registrado el día.
        sesionAPublicar = { tituloPrincipal: mesociclo === 'ROCA' ? 'Roca/roco' : 'Descanso', partes: [] };
      } else {
        const qs = new URLSearchParams({ cliente, mesociclo });
        const resUltimo = await fetch('/api/ultima-sesion-publicada?' + qs.toString());
        const dataUltimo = await resUltimo.json();

        if (!dataUltimo.success) {
          resultados.push({ texto: `${mesociclo} (${fecha}): sin versión previa publicada — hazlo primero desde Sesiones.html`, clase: 'error' });
          continue;
        }
        sesionAPublicar = dataUltimo.sesion;
      }

      const resPub = await fetch('/api/publicar-sesion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cliente, fecha, mesociclo, sesion: sesionAPublicar, semana, semanaMesociclo }),
      });
      const dataPub = await resPub.json();

      resultados.push(dataPub.success
        ? { texto: `${mesociclo} (${fecha}): publicada ✓`, clase: 'ok' }
        : { texto: `${mesociclo} (${fecha}): error — ${dataPub.error}`, clase: 'error' });
    } catch (e) {
      resultados.push({ texto: `${mesociclo} (${fecha}): error de red — ${e.message}`, clase: 'error' });
    }
  }

  estadoDiv.innerHTML = resultados.length
    ? resultados.map(r => `<div class="${r.clase}">${r.texto}</div>`).join('')
    : 'No hay ninguna sesión asignada esta semana.';
});

document.getElementById('btnBorrarSemana').addEventListener('click', async () => {
  const cliente = inputPublicarClienteSemana.value.trim();
  const estadoDiv = document.getElementById('estadoPublicarSemana');

  if (!cliente) { alert('Indica el cliente antes de borrar su semana.'); return; }
  if (!document.getElementById('hiddenDate').value) {
    alert('Indica primero la fecha del lunes de esta semana (campo "Fecha" arriba), o carga la última publicada.');
    return;
  }

  const fechaLunes = fechaParaDiaIndice(0);
  if (!confirm(`¿Seguro que quieres borrar TODO lo publicado para ${cliente} en la semana del ${fechaLunes}? Esto no se puede deshacer.`)) return;

  estadoDiv.innerHTML = 'Borrando semana...';
  try {
    const res = await fetch('/api/publicar-sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'borrarSemana', cliente, fecha: fechaLunes }),
    });
    const data = await res.json();
    estadoDiv.innerHTML = data.success
      ? `<div class="ok">✓ ${data.message}</div>`
      : `<div class="error">${data.error}</div>`;
    if (data.success) limpiarTabla();
  } catch (e) {
    estadoDiv.innerHTML = `<div class="error">Error de red: ${e.message}</div>`;
  }
});

window.onload = () => {
  act();
};
