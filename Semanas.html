<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaska.Climb">
<link rel="apple-touch-icon" href="logo-192.png">
<meta name="theme-color" content="#1c211e">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Semanas</title>

<script src="libs/Sortable.min.js"></script>
<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --fmax: #c17c74;
  --reox: #7c9070;
  --roca: #d4b26f;
  --antagonistas: #70908c;
  --descanso: #ff6b6b;
  --aero: #93859e;
  --gym: #d4b26f;
  --pausa: #c9c3b4;
  
  --stone-900: #1c211e;
  --stone-800: #262d28;
  --stone-700: #333b34;
  --chalk: #f2ede1;
  --chalk-dim: #c9c3b4;
  --moss: #7c9070;
  --moss-light: #a7bd98;
  --moss-deep: #4d5c46;

  --bg-principal: #1c211e;
  --bg-panel: rgba(38, 45, 40, 0.55);
  --input-bg: #262d28;
  --btn-bg: #333b34;
  --border-general: rgba(242, 237, 225, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Work Sans', sans-serif;
  background: radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--stone-900) 55%, #121614 100%);
  color: var(--chalk);
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.fondo-logo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('logo.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100%;
  opacity: 0.2;
  z-index: -10;
}

.layout-editor {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: center;
}

.contenedor-principal {
  position: relative;
  width: 350px;
  flex-shrink: 0;
  background: var(--bg-panel);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--border-general);
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  background: rgba(0, 0, 0, 0.2);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid rgba(242, 237, 225, 0.08);
}

.head-item {
  font-size: 0.75em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--moss-light);
}

.head-val {
  background: var(--input-bg);
  border: 1px solid rgba(242, 237, 225, 0.16);
  border-radius: 8px;
  font-weight: 600;
  color: var(--chalk);
  padding: 6px 10px;
  display: inline-block;
  font-size: 1em;
  cursor: pointer;
  font-family: 'Work Sans', sans-serif;
}

.date-input-hidden {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.semana-grid {
  display: grid;
  gap: 8px;
  background: rgba(0, 0, 0, 0.2);
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(242, 237, 225, 0.08);
}

.dia-columna {
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px;
  border: 1px solid rgba(242, 237, 225, 0.16);
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 45px;
}

.dia-nombre {
  width: 40px;
  min-width: 40px;
  font-size: 0.7em;
  color: var(--stone-900);
  text-transform: uppercase;
  font-weight: 700;
  text-align: center;
  background: var(--moss-light);
  padding: 6px 4px;
  border-radius: 6px;
  pointer-events: none;
  user-select: none;
}

.sesion {
  background: var(--stone-700);
  padding: 8px 12px; 
  border-radius: 8px; 
  cursor: move;
  border: 1px solid rgba(242, 237, 225, 0.16);
  flex-grow: 1;
  display: flex;
  align-items: center;
  min-height: 45px; 
  text-transform: uppercase;
  color: var(--stone-900);
  font-weight: 700;
  font-size: 0.85em;
  transition: filter 0.2s ease;
}

.sesion:hover {
  filter: brightness(1.1);
}

.sesion.fmax {
  background-color: var(--fmax) !important;
  color: var(--stone-900) !important;
}

.sesion.reox {
  background-color: var(--reox) !important;
  color: var(--stone-900) !important;
}

.sesion.roca {
  background-color: var(--roca) !important;
  color: var(--stone-900) !important;
}

.sesion.antagonistas {
  background-color: var(--antagonistas) !important;
  color: var(--stone-900) !important;
}

.sesion.descanso {
  background-color: var(--descanso) !important;
  color: var(--stone-900) !important;
}

.sesion.aero {
  background-color: var(--aero) !important;
  color: var(--stone-900) !important;
}

.sesion.gym {
  background-color: var(--gym) !important;
  color: var(--stone-900) !important;
}

.sesion.pausa {
  background-color: var(--pausa) !important;
  color: var(--stone-900) !important;
}

.sesion-contenido {
  display: grid;
  grid-template-columns: 20px 1fr 40px;
  align-items: center;
  width: 100%;
  gap: 5px;
}

.sesion-text {
  grid-column: 2;
  text-align: center;
  font-size: 0.8em;
  outline: none;
  color: var(--stone-900);
  font-weight: 700;
}

.btn-del-sesion {
  grid-column: 1;
  color: var(--stone-900);
  cursor: pointer;
  font-size: 0.8em;
  font-weight: 800;
  background: rgba(0,0,0,0.15);
  border-radius: 4px;
  text-align: center;
  padding: 1px 0;
}

.btn-del-sesion:hover {
  background: rgba(0,0,0,0.3);
  color: #fff;
}

.btn-link {
  grid-column: 3;
  color: var(--stone-900);
  cursor: pointer;
  font-size: 0.7em;
  text-decoration: underline;
  justify-self: end;
  font-weight: 700;
}

.link-btn {
  grid-column: 3;
  color: var(--stone-900);
  font-size: 0.7em;
  text-decoration: none;
  justify-self: end;
  font-weight: 700;
  cursor: pointer;
  background: rgba(0,0,0,0.15);
  padding: 2px 6px;
  border-radius: 4px;
}

.link-btn:hover {
  background: rgba(0,0,0,0.3);
  color: #fff;
}

.btn-action {
  background: var(--stone-800);
  border: 1px solid rgba(242, 237, 225, 0.16);
  color: var(--chalk);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 11px;
  font-family: 'Work Sans', sans-serif;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  display: block;
  box-sizing: border-box;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s ease;
}

.btn-action:hover {
  background: var(--moss);
  color: var(--stone-900);
  border-color: var(--moss);
}

#banco {
  width: 280px;
  padding: 16px;
  border: 1px solid rgba(242, 237, 225, 0.12);
  background: var(--bg-panel);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.grid-botones-abajo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 280px;
  margin-top: 15px;
  box-sizing: border-box;
}

.panel-derecho {
  width: 280px;
  display: flex;
  flex-direction: column;
}

.btn-inicio {
  width: 280px;
  font-weight: 700;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 20px auto 0 auto;
  padding: 10px 20px;
  border-radius: 10px;
  letter-spacing: 1px;
}

@media screen and (max-width: 820px) {
  body {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 12px;
    overflow-x: auto;
  }

  .layout-editor {
    flex-direction: row;
    align-items: flex-start;
    justify-content: flex-start;
    width: max-content;
  }

  .contenedor-principal {
    width: 350px;
  }

  .panel-derecho {
    width: 280px;
  }

  #banco,
  .grid-botones-abajo {
    width: 280px;
  }
}

@media print {
  @page {
    size: 67mm 100mm;
    margin: 0;
  }

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 67mm !important;
    background: var(--stone-900) !important;
    color: var(--chalk) !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .fondo-logo,
  .panel-derecho,
  #banco,
  .no-print,
  .btn-action,
  .grid-botones-abajo {
    display: none !important;
    visibility: hidden !important;
  }

  .layout-editor {
    display: block !important;
    width: 67mm !important;
    margin: 0 !important;
    padding: 0 !important;
    background: var(--stone-900) !important;
  }

  .contenedor-principal {
    display: block !important;
    width: 67mm !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 2mm !important;
    border: none !important;
    border-radius: 0 !important;
    background: var(--stone-900) !important;
  }
}
</style>
</head>

<body>
<div class="fondo-logo"></div>

<div class="layout-editor">
  <div class="contenedor-principal" id="panelExportable">
    <div class="header">
      <div class="head-item">
        Semana:
        <span class="head-val" contenteditable="true" id="h1">01</span>
      </div>

      <div class="head-item">
        Fecha:
        <span class="head-val" id="displayDate" onclick="abrirSelectorFecha()">DD/MM/AAAA</span>
        <input type="date" id="hiddenDate" class="date-input-hidden" onchange="actualizarFecha(this.value)">
      </div>

      <div class="head-item">
        Mesociclo:
        <span class="head-val" contenteditable="true" id="h3">REOX</span>
      </div>

      <div class="head-item">
        Sem. Meso.:
        <span class="head-val" contenteditable="true" id="h4">1/4</span>
      </div>
    </div>

    <div class="semana-grid" id="grid">
      <div class="dia-columna" id="d1">
        <div class="dia-nombre">LUN</div>
      </div>

      <div class="dia-columna" id="d2">
        <div class="dia-nombre">MAR</div>
      </div>

      <div class="dia-columna" id="d3">
        <div class="dia-nombre">MIÉ</div>
      </div>

      <div class="dia-columna" id="d4">
        <div class="dia-nombre">JUE</div>
      </div>

      <div class="dia-columna" id="d5">
        <div class="dia-nombre">VIE</div>
      </div>

      <div class="dia-columna" id="d6">
        <div class="dia-nombre">SÁB</div>
      </div>

      <div class="dia-columna" id="d7">
        <div class="dia-nombre">DOM</div>
      </div>
    </div>
  </div>

  <div class="panel-derecho">
    <div id="banco" class="no-print">
      <h4 style="margin-top:0; color:var(--moss-light); font-family:'Work Sans', sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Banco de sesiones</h4>

      <div class="sesion descanso">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">FMAX (ROCO)</span>
          <span class="btn-link" onclick="addLink(this)">Link</span>
        </div>
      </div>

      <div class="sesion reox">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">REOX (ROCO)</span>
          <span class="btn-link" onclick="addLink(this)">Link</span>
        </div>
      </div>

      <div class="sesion antagonistas">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">DESOX (ROCO)</span>
          <span class="btn-link" onclick="addLink(this)">Link</span>
        </div>
      </div>

      <div class="sesion aero">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">AERO (ROCO)</span>
          <span class="btn-link" onclick="addLink(this)">Link</span>
        </div>
      </div>

      <div class="sesion gym">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">GYM/ANTAGONISTAS</span>
          <span class="btn-link" onclick="addLink(this)">Link</span>
        </div>
      </div>

      <div class="sesion roca">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">Roca/roco</span>
        </div>
      </div>

      <div class="sesion pausa">
        <div class="sesion-contenido">
          <div class="btn-del-sesion" onclick="this.parentElement.parentElement.remove()">X</div>
          <span class="sesion-text" contenteditable="true">Descanso</span>
        </div>
      </div>
    </div>

    <div class="no-print grid-botones-abajo">
      <button class="btn-action" onclick="guardar()">Guardar</button>
      <button class="btn-action" onclick="limpiarTabla()">Limpiar Tabla</button>
      <button class="btn-action" onclick="restablecerLinks()">Limpiar Links</button>
      <button class="btn-action" onclick="exportarPDFReal(event)">Exportar PDF</button>
    </div>

    <button class="btn-action btn-inicio no-print" onclick="window.location.href='index.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Inicio
    </button>
  </div>
</div>

<script>
function act() {
  if (window.Sortable) {
    document.querySelectorAll('.dia-columna').forEach(d => {
      new Sortable(d, {
        group: 's',
        filter: '.dia-nombre'
      });
    });

    new Sortable(document.getElementById('banco'), {
      group: {
        name: 's',
        pull: 'clone',
        put: false
      },
      sort: false
    });
  } else {
    alert("No se ha cargado Sortable.min.js. Revisa que esté en la carpeta libs.");
  }
}

function abrirSelectorFecha() {
  const input = document.getElementById('hiddenDate');

  if (input.showPicker) {
    input.showPicker();
  } else {
    input.click();
  }
}

function actualizarFecha(val) {
  if (!val) return;

  const [y, m, d] = val.split('-');
  document.getElementById('displayDate').innerText = `${d}/${m}/${y}`;
}

function limpiarTabla() {
  document.querySelectorAll('.dia-columna').forEach(d => {
    Array.from(d.children).forEach(child => {
      if (!child.classList.contains('dia-nombre')) {
        child.remove();
      }
    });
  });
}

document.addEventListener('click', e => {
  const s = e.target.closest('.sesion');

  if (e.target.classList.contains('sesion-text')) return;
  if (e.target.classList.contains('btn-del-sesion')) return;
  if (e.target.classList.contains('btn-link')) return;
  if (e.target.classList.contains('link-btn')) return;

  if (s && s.parentElement && !s.parentElement.id.includes('banco')) {
    e.preventDefault();
    s.after(s.cloneNode(true));
  }
});

function normalizarUrl(url) {
  const limpia = url.trim();

  if (!limpia) return "";

  if (
    limpia.startsWith("http://") ||
    limpia.startsWith("https://") ||
    limpia.startsWith("mailto:") ||
    limpia.startsWith("tel:") ||
    limpia.startsWith("file:")
  ) {
    return limpia;
  }

  return "https://" + limpia;
}

function addLink(el) {
  const u = prompt("Enlace:");

  if (u) {
    const url = normalizarUrl(u);
    el.outerHTML = `<a href="${url}" target="_blank" rel="noopener" class="link-btn">▶ Ver</a>`;
  }
}

function restablecerLinks() {
  document.querySelectorAll('.link-btn').forEach(el => {
    el.outerHTML = '<span class="btn-link" onclick="addLink(this)">Link</span>';
  });
}

function guardar() {
  const grid = document.getElementById('grid');

  localStorage.g = grid.innerHTML;

  localStorage.h = JSON.stringify({
    h1: document.getElementById('h1').innerText,
    h2val: document.getElementById('hiddenDate').value,
    h3: document.getElementById('h3').innerText,
    h4: document.getElementById('h4').innerText
  });

  alert("Guardado");
}

async function guardarPDF(pdf, nombreSugerido) {
  if (window.showSaveFilePicker) {
    try {
      const blob = pdf.output('blob');
      const handle = await window.showSaveFilePicker({
        suggestedName: nombreSugerido,
        types: [{
          description: 'Documento PDF',
          accept: { 'application/pdf': ['.pdf'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('No se pudo usar el selector nativo, se usa la descarga estándar.', err);
    }
  }
  pdf.save(nombreSugerido);
}

async function exportarPDFReal(evento) {
  if (!window.html2canvas) {
    alert("No se ha cargado html2canvas.min.js. Revisa que esté en la carpeta libs.");
    return;
  }

  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("No se ha cargado jspdf.umd.min.js. Revisa que esté en la carpeta libs.");
    return;
  }

  const panel = document.getElementById('panelExportable');

  if (!panel) {
    alert("No encuentro el panel exportable.");
    return;
  }

  const boton = evento && evento.target ? evento.target : null;

  if (boton) {
    boton.disabled = true;
    boton.innerText = "Generando PDF...";
  }

  try {
    const rect = panel.getBoundingClientRect();

    const canvas = await html2canvas(panel, {
      backgroundColor: '#1c211e',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      width: Math.ceil(rect.width),
      height: Math.ceil(panel.scrollHeight),
      windowWidth: Math.ceil(rect.width),
      windowHeight: Math.ceil(panel.scrollHeight),
      scrollX: 0,
      scrollY: 0
    });

    const imgData = canvas.toDataURL('image/png');

    const escalaCanvas = 2;
    const pxToMm = 0.264583;

    const pdfWidth = canvas.width * pxToMm / escalaCanvas;
    const pdfHeight = canvas.height * pxToMm / escalaCanvas;

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
      orientation: pdfWidth > pdfHeight ? 'landscape' : 'portrait',
      unit: 'mm',
      format: [pdfWidth, pdfHeight],
      compress: true
    });

    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

    const panelRect = panel.getBoundingClientRect();
    const enlaces = panel.querySelectorAll('a.link-btn[href]');

    enlaces.forEach(enlace => {
      const enlaceRect = enlace.getBoundingClientRect();

      const x = (enlaceRect.left - panelRect.left) * pxToMm;
      const y = (enlaceRect.top - panelRect.top) * pxToMm;
      const w = enlaceRect.width * pxToMm;
      const h = enlaceRect.height * pxToMm;

      pdf.link(x, y, w, h, {
        url: enlace.href
      });
    });

    await guardarPDF(pdf, 'kaska-climb-semana.pdf');
  } catch (error) {
    alert("No se ha podido generar el PDF. Revisa que las librerías estén bien subidas en GitHub.");
    console.error(error);
  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerText = "Exportar PDF";
    }
  }
}

window.onload = () => {
  if (localStorage.g) {
    document.getElementById('grid').innerHTML = localStorage.g;

    if (localStorage.h) {
      const h = JSON.parse(localStorage.h);

      document.getElementById('h1').innerText = h.h1 || '01';
      document.getElementById('hiddenDate').value = h.h2val || '';

      if (h.h2val) {
        actualizarFecha(h.h2val);
      }

      document.getElementById('h3').innerText = h.h3 || 'REOX';
      document.getElementById('h4').innerText = h.h4 || '1/4';
    }
  }

  act();
};
</script>
</body>
</html>
