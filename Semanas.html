<style>
:root {
  --fmax: #d28c7d;          /* Terracota cálida */
  --reox: #9cb08e;          /* Verde musgo suave */
  --roca: #dfbe7d;          /* Ocre dorado / Arena */
  --antagonistas: #7b968e;  /* Gris verdoso/azulado */
  --descanso: #a496b2;      /* Malva grisáceo elegante */
  --aero: #8fa8b2;          /* Azul acero sutil */
  --gym: #c4b59d;           /* Arena tostada */
  --pausa: #333b34;         /* Gris piedra oscuro */
  
  --bg-principal: #1c211e;
  --bg-panel: rgba(38,45,40,0.75);
  --input-bg: #262d28;
  --btn-bg: #333b34;
  --border-general: rgba(242,237,225,0.12);
  --chalk: #f2ede1;
  --chalk-dim: #c9c3b4;
  --moss: #7c9070;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Work Sans', sans-serif;
  background: radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--bg-principal) 55%, #121614 100%);
  color: var(--chalk);
  padding: 40px 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.fondo-logo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('logo.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100%;
  opacity: 0.2;
  z-index: -10;
}

.layout-editor {
  display: flex;
  gap: 25px;
  align-items: flex-start;
  justify-content: center;
}

.contenedor-principal {
  width: 440px; /* Ligeramente más ancho para respirar mejor */
  flex-shrink: 0;
  background: var(--bg-panel);
  padding: 24px;
  border-radius: 16px;
  border: 1px solid var(--border-general);
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  background: rgba(28,33,30,0.6);
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 14px;
  border: 1px solid var(--border-general);
}

.head-item {
  font-size: 0.8em;
  font-weight: bold;
  color: var(--chalk-dim);
}

.head-val {
  background: var(--input-bg);
  border: 1px solid var(--border-general);
  border-radius: 6px;
  font-weight: bold;
  color: var(--chalk);
  padding: 4px 8px;
  display: inline-block;
  font-size: 0.9em;
  cursor: pointer;
}

.date-input-hidden {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.semana-grid {
  display: grid;
  gap: 10px;
  background: rgba(28,33,30,0.6);
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--border-general);
}

.dia-columna {
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border-general);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
}

.dia-nombre {
  width: 40px;
  min-width: 40px;
  font-size: 0.7em;
  color: var(--chalk);
  text-transform: uppercase;
  font-weight: bold;
  text-align: center;
  background: var(--btn-bg);
  padding: 6px 4px;
  border-radius: 6px;
  pointer-events: none;
  user-select: none;
  border: 1px solid var(--border-general);
}

.sesion {
  background: #475569;
  padding: 8px 12px; 
  border-radius: 6px; 
  cursor: move;
  border: 1px solid rgba(0,0,0,0.15);
  flex-grow: 1;
  display: flex;
  align-items: center;
  min-height: 42px; 
  text-transform: uppercase;
  color: #1c211e;
  font-weight: 700;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

/* Clases de sesiones con la nueva paleta elegante */
.sesion.fmax { background-color: var(--fmax) !important; color: #1c211e; }
.sesion.reox { background-color: var(--reox) !important; color: #1c211e; }
.sesion.roca { background-color: var(--roca) !important; color: #1c211e; }
.sesion.antagonistas { background-color: var(--antagonistas) !important; color: #1c211e; }
.sesion.descanso { background-color: var(--descanso) !important; color: #1c211e; }
.sesion.aero { background-color: var(--aero) !important; color: #1c211e; }
.sesion.gym { background-color: var(--gym) !important; color: #1c211e; }
.sesion.pausa { background-color: var(--pausa) !important; color: var(--chalk); }

.sesion-contenido {
  display: grid;
  grid-template-columns: 20px 1fr 40px;
  align-items: center;
  width: 100%;
  gap: 5px;
}

.sesion-text {
  grid-column: 2;
  text-align: center;
  font-size: 0.75em;
  outline: none;
}

.btn-del-sesion {
  grid-column: 1;
  color: inherit;
  opacity: 0.7;
  cursor: pointer;
  font-size: 0.85em;
  font-weight: bold;
}
.btn-del-sesion:hover { opacity: 1; }

.btn-link {
  grid-column: 3;
  color: inherit;
  opacity: 0.8;
  cursor: pointer;
  font-size: 0.65em;
  text-decoration: underline;
  justify-self: end;
}

.link-btn {
  grid-column: 3;
  color: inherit;
  font-size: 0.65em;
  text-decoration: none;
  justify-self: end;
  font-weight: bold;
  cursor: pointer;
  background: rgba(0,0,0,0.15);
  padding: 2px 6px;
  border-radius: 4px;
}

.btn-action {
  background: var(--btn-bg);
  border: 1px solid var(--border-general);
  color: var(--chalk);
  padding: 10px 0;
  border-radius: 8px;
  font-size: 0.75em;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  width: 100%;
  display: block;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.btn-action:hover {
  background: var(--moss);
  color: var(--bg-principal);
  border-color: var(--moss);
}

#banco {
  width: 320px;
  padding: 18px;
  border: 1px solid var(--border-general);
  background: var(--bg-panel);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
  backdrop-filter: blur(8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.grid-botones-abajo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 320px;
  margin-top: 15px;
  box-sizing: border-box;
}

.panel-derecho {
  width: 320px;
  display: flex;
  flex-direction: column;
}

.btn-inicio {
  width: 100%;
  font-weight: 800;
  text-transform: uppercase;
  display: block;
  margin: 20px auto 0 auto;
}
</style>
