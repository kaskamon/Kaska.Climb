<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaska.Climb | Perfil Fisiológico Boulder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --stone-900:#1c211e;
    --stone-800:#262d28;
    --stone-700:#333b34;
    --chalk:#f2ede1;
    --chalk-dim:#c9c3b4;
    --moss:#7c9070;
    --moss-light:#a7bd98;
    --moss-deep:#4d5c46;
    --rope:#c1121f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--stone-900) 55%, #121614 100%);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    padding:36px 20px 60px;
  }

  .fondo-logo {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-image: url('logo.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100%; 
    opacity: 0.2;
    z-index: -10;
  }

  .wrap{ 
    max-width:1040px; 
    margin:0 auto; 
    position:relative; 
    z-index:10; 
  }

  header{ 
    margin-bottom:32px; 
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  
  .header-actions {
    display: flex;
    gap: 10px;
  }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-size:12px; letter-spacing:4px; font-weight:700;
    color:var(--moss-light); text-transform:uppercase; margin-bottom:10px;
  }
  .eyebrow::before{ content:""; width:24px; height:2px; background:var(--moss-light); }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:0.5px;
    margin:0;
    line-height:0.98;
  }
  h1 span{ color:var(--moss); }

  .btn-action {
    background: var(--stone-800);
    color: var(--chalk);
    border: 1px solid rgba(242,237,225,0.2);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-action:hover {
    background: var(--moss);
    color: var(--stone-900);
    border-color: var(--moss);
  }

  .panel{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:820px){
    .panel{ grid-template-columns:1fr; }
  }

  .card{
    background:rgba(38,45,40,0.55);
    border:1px solid rgba(242,237,225,0.1);
    border-radius:18px;
    padding:22px;
    backdrop-filter:blur(6px);
  }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--chalk-dim); font-weight:700; padding-bottom:10px;
  }
  thead th:last-child{ text-align:center; }
  tbody tr{ border-top:1px solid rgba(242,237,225,0.08); }
  tbody td{ padding:12px 0; }
  .dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:10px; flex-shrink:0;
  }
  .label-cell{ display:flex; align-items:center; font-weight:600; font-size:14.5px; }
  .sub{ display:block; font-size:11px; color:var(--chalk-dim); font-weight:500; margin-top:1px; }

  .score-input{
    width:74px; text-align:center;
    background:var(--stone-800);
    border:1px solid rgba(242,237,225,0.16);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    font-size:16px; font-weight:700;
    border-radius:8px; padding:8px 6px;
    -moz-appearance:textfield;
    transition:border-color .15s, box-shadow .15s, color .15s;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .score-input:focus{
    outline:none; border-color:var(--moss-light);
    box-shadow:0 0 0 3px rgba(167,189,152,0.18);
  }

  .bar-track{
    margin-top:6px; height:5px; border-radius:4px;
    background:rgba(242,237,225,0.08); overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:4px; background:var(--moss); transition:width .2s ease; }

  .chart-card{ display:flex; flex-direction:column; align-items:center; }
  .chart-card svg{ width:100%; height:auto; max-width:560px; overflow: visible; }
  .axis-label{ font-size:13px; font-weight:700; fill:var(--chalk); }
  .ring-label{ font-size:10.5px; fill:var(--chalk-dim); }
  .vertex{ fill:var(--stone-900); stroke:var(--moss); stroke-width:2.5; }
  .vertex.weak{ fill:var(--stone-900); stroke:var(--rope); }

  .panel-guardar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
    background:rgba(124,144,112,0.08); border:1px solid rgba(242,237,225,0.1);
    border-radius:14px; padding:16px; margin-bottom:24px;
  }
  .campo-guardar{ display:flex; flex-direction:column; gap:4px; }
  .campo-guardar label{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--chalk-dim); }
  .campo-guardar input{
    font-family:'Work Sans', sans-serif; font-size:13px;
    padding:8px 10px; border:1px solid rgba(242,237,225,0.18); border-radius:8px;
    background:var(--stone-800); color:var(--chalk);
  }
  .estado-guardar{ flex-basis:100%; font-size:12px; color:var(--chalk-dim); min-height:16px; }
  .estado-guardar.ok{ color:var(--moss-light); font-weight:700; }
  .estado-guardar.error{ color:var(--rope); font-weight:700; }
</style>
</head>
<body>

<div class="fondo-logo"></div>

<div class="panel-guardar" style="max-width:1040px; margin:0 auto 20px;">
  <div class="campo-guardar">
    <label>Cliente (email)</label>
    <input type="email" id="guardarCliente" placeholder="email@ejemplo.com">
  </div>
  <div class="campo-guardar">
    <label>Fecha de realización del test</label>
    <input type="date" id="guardarFecha">
  </div>
  <button class="btn-action" id="btn-guardar-perfil" type="button">Guardar en el historial del cliente</button>
  <button class="btn-action" id="btn-cargar-perfil" type="button">Cargar test anterior</button>
  <div class="estado-guardar" id="estadoGuardarPerfil"></div>
</div>

<div class="wrap" id="export-area">

  <header>
    <div>
      <div class="eyebrow">Kaska.Climb</div>
      <h1>Perfil Fisiológico <span>Boulder</span></h1>
    </div>
    <div class="header-actions">
      <a href="Perfiles fisiológicos.html" class="btn-action" id="btn-volver">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver
      </a>
      <button class="btn-action" id="btn-exportar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Exportar
      </button>
    </div>
  </header>

  <div class="panel">
    <div class="card">
      <table>
        <thead>
          <tr><th>Capacidad</th><th>Puntos</th></tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>

    <div class="card chart-card">
      <svg id="radar-svg" viewBox="0 0 580 580"></svg>
    </div>
  </div>

</div>

<script>
  const CAPACIDADES = [
    { key: 'fmax',       label: 'Fmáx',       corto: 'Fmáx',       sub: 'Fuerza máxima de agarre', color: '#7c9070', valor: 7.00 },
    { key: 'rfd',        label: 'RFD 200ms',  corto: 'RFD 200ms',  sub: 'Fuerza de contacto',      color: '#7c9070', valor: 6.78 },
    { key: 'anaerobico', label: 'Anaeróbico', corto: 'Anaeróbico', sub: 'Resistencia anaeróbica',  color: '#7c9070', valor: 8.00 },
    { key: 'trac',       label: 'Tracción',   corto: 'Tracción',   sub: 'Fuerza de tracción',      color: '#7c9070', valor: 9.00 },
  ];

  const MAX_ESCALA = 10;
  const ANILLOS = [0, 2, 4, 6, 8, 10];

  const tbody = document.getElementById('tabla-body');
  const svg = document.getElementById('radar-svg');

  CAPACIDADES.forEach(cap => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="label-cell">
          <span class="dot" style="background:${cap.color}"></span>
          <div>
            ${cap.label}
            <span class="sub">${cap.sub}</span>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" id="bar-${cap.key}"></div></div>
      </td>
      <td style="text-align:center;">
        <input type="number" class="score-input" id="input-${cap.key}"
               min="0" max="10" step="0.01" value="${cap.valor}">
      </td>
    `;
    tbody.appendChild(tr);
  });

  CAPACIDADES.forEach(cap => {
    document.getElementById(`input-${cap.key}`).addEventListener('input', (e) => {
      let v = parseFloat(e.target.value.replace(',', '.'));
      if (isNaN(v)) v = 0;
      v = Math.max(0, Math.min(10, v));
      cap.valor = v;
      redibujar();
    });
  });

  const CENTRO = 290;
  const RADIO = 160;
  const N = CAPACIDADES.length;

  function puntoEnEje(i, radioFraccion) {
    const angulo = (Math.PI * 2 * i) / N - Math.PI / 2;
    return {
      x: CENTRO + radioFraccion * RADIO * Math.cos(angulo),
      y: CENTRO + radioFraccion * RADIO * Math.sin(angulo)
    };
  }

  function crearSVG(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
  }

  function redibujar() {
    svg.innerHTML = '';

    ANILLOS.forEach(nivel => {
      const frac = nivel / MAX_ESCALA;
      const pts = CAPACIDADES.map((_, i) => puntoEnEje(i, frac));
      const path = pts.map(p => `${p.x},${p.y}`).join(' ');
      svg.appendChild(crearSVG('polygon', {
        points: path, fill: 'none', stroke: 'rgba(242,237,225,0.14)', 'stroke-width': 1
      }));
      if (nivel > 0) {
        const labelPt = puntoEnEje(0, frac);
        const t = crearSVG('text', {
          x: labelPt.x + 6, y: labelPt.y - 4, class: 'ring-label'
        });
        t.textContent = nivel.toFixed(2).replace('.', ',');
        svg.appendChild(t);
      }
    });

    CAPACIDADES.forEach((_, i) => {
      const p = puntoEnEje(i, 1);
      svg.appendChild(crearSVG('line', {
        x1: CENTRO, y1: CENTRO, x2: p.x, y2: p.y,
        stroke: 'rgba(242,237,225,0.14)', 'stroke-width': 1
      }));
    });

    const puntosDatos = CAPACIDADES.map((c, i) => puntoEnEje(i, c.valor / MAX_ESCALA));
    const pathDatos = puntosDatos.map(p => `${p.x},${p.y}`).join(' ');

    svg.appendChild(crearSVG('polygon', {
      points: pathDatos, fill: 'rgba(124,144,112,0.28)',
      stroke: '#7c9070', 'stroke-width': 3, 'stroke-linejoin': 'round'
    }));

    CAPACIDADES.forEach((c, i) => {
      const p = puntosDatos[i];
      const esDebil = c.valor < 5;
      svg.appendChild(crearSVG('circle', {
        cx: p.x, cy: p.y, r: 6.5, class: esDebil ? 'vertex weak' : 'vertex'
      }));

      const labelPt = puntoEnEje(i, 1.35);
      const t = crearSVG('text', {
        x: labelPt.x, y: labelPt.y, class: 'axis-label',
        'text-anchor': i === 0 || i === 2 ? 'middle' : (labelPt.x > CENTRO ? 'start' : 'end'),
        'dominant-baseline': i === 1 ? 'middle' : (i === 3 ? 'middle' : (labelPt.y < CENTRO ? 'auto' : 'hanging'))
      });
      t.textContent = c.corto;
      svg.appendChild(t);
    });

    CAPACIDADES.forEach(c => {
      const bar = document.getElementById(`bar-${c.key}`);
      const input = document.getElementById(`input-${c.key}`);
      
      bar.style.width = (c.valor / MAX_ESCALA * 100) + '%';
      bar.style.background = '#7c9070';
      
      input.style.color = c.valor < 5 ? '#c1121f' : 'var(--chalk)';
    });
  }

  redibujar();

  /* ================= GUARDAR / CARGAR EN EL HISTORIAL DEL CLIENTE ================= */
  const MODALIDAD = 'boulder';
  const inputGuardarCliente = document.getElementById('guardarCliente');
  const inputGuardarFecha = document.getElementById('guardarFecha');
  const estadoGuardarPerfil = document.getElementById('estadoGuardarPerfil');

  inputGuardarCliente.value = localStorage.getItem('kaska_cliente_actual') || '';
  inputGuardarCliente.addEventListener('input', () => {
    localStorage.setItem('kaska_cliente_actual', inputGuardarCliente.value);
  });

  function mostrarEstadoGuardar(texto, clase){
    estadoGuardarPerfil.textContent = texto;
    estadoGuardarPerfil.classList.remove('ok', 'error');
    if(clase) estadoGuardarPerfil.classList.add(clase);
  }

  document.getElementById('btn-guardar-perfil').addEventListener('click', async () => {
    const cliente = inputGuardarCliente.value.trim();
    const fechaVal = inputGuardarFecha.value; // yyyy-mm-dd, fecha REAL del test
    if(!cliente || !fechaVal){
      alert('Indica el email del cliente y la fecha de realización del test antes de guardar.');
      return;
    }
    const [y, m, d] = fechaVal.split('-');
    const fecha = `${d}/${m}/${y}`;
    const capacidades = {};
    CAPACIDADES.forEach(c => { capacidades[c.key] = c.valor; });

    mostrarEstadoGuardar('Guardando...', null);
    try{
      const res = await fetch('/api/guardar-perfil-fisiologico', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cliente, fecha, modalidad: MODALIDAD, capacidades }),
      });
      const data = await res.json();
      mostrarEstadoGuardar(
        data.success ? `✓ Guardado — ${cliente} podrá comparar este test (${fecha}) con otros en su historial.` : ('✗ ' + (data.error || 'Error al guardar.')),
        data.success ? 'ok' : 'error'
      );
    }catch(e){
      mostrarEstadoGuardar('✗ Error de red: ' + e.message, 'error');
    }
  });

  document.getElementById('btn-cargar-perfil').addEventListener('click', async () => {
    const cliente = inputGuardarCliente.value.trim();
    if(!cliente){
      alert('Indica el email del cliente antes de cargar su último test.');
      return;
    }
    mostrarEstadoGuardar('Cargando...', null);
    try{
      const qs = new URLSearchParams({ cliente, modalidad: MODALIDAD });
      const res = await fetch('/api/obtener-perfiles-fisiologicos?' + qs.toString());
      const data = await res.json();
      if(!data.success || !data.perfiles.length){
        mostrarEstadoGuardar(data.error || 'Este cliente todavía no tiene ningún test guardado de esta modalidad.', 'error');
        return;
      }
      const ultimo = data.perfiles[data.perfiles.length - 1];
      CAPACIDADES.forEach(c => {
        if(ultimo.capacidades[c.key] !== undefined){
          c.valor = ultimo.capacidades[c.key];
          document.getElementById(`input-${c.key}`).value = c.valor;
        }
      });
      redibujar();
      mostrarEstadoGuardar(`✓ Cargado el test del ${ultimo.fecha}. Edítalo y guarda uno nuevo con la fecha de hoy.`, 'ok');
    }catch(e){
      mostrarEstadoGuardar('✗ Error de red: ' + e.message, 'error');
    }
  });

  document.getElementById('btn-exportar').addEventListener('click', async () => {
    const btnExp = document.getElementById('btn-exportar');
    const btnVol = document.getElementById('btn-volver');
    const element = document.getElementById('export-area');

    btnExp.style.opacity = '0.5';
    btnExp.innerText = 'Generando...';
    btnExp.style.visibility = 'hidden';
    btnVol.style.visibility = 'hidden';

    element.style.padding = '36px';

    try {
      const contentCanvas = await html2canvas(element, {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
        allowTaint: true
      });

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = contentCanvas.width;
      finalCanvas.height = contentCanvas.height;
      const ctx = finalCanvas.getContext('2d');

      // Fondo sólido con el color #494d4b
      ctx.fillStyle = '#494d4b';
      ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

      ctx.drawImage(contentCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'Perfil_Fisiologico_Boulder.png';
      link.href = finalCanvas.toDataURL('image/png');
      link.click();

    }catch(e){
      console.error(e);
      alert("Error al generar la imagen: " + e.message);
    } finally {
      element.style.padding = '0px';

      btnExp.style.visibility = 'visible';
      btnVol.style.visibility = 'visible';
      btnExp.style.opacity = '1';
      btnExp.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Exportar`;
    }
  });
</script>
</body>
</html>
