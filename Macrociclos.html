<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaska.Climb | Macrociclos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="libs/clientes-selector.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --stone-900:#1c211e;
            --stone-800:#262d28;
            --stone-700:#333b34;
            --chalk:#f2ede1;
            --chalk-dim:#c9c3b4;
            --moss:#7c9070;
            --moss-light:#a7bd98;
            --moss-deep:#4d5c46;
        }

        *{box-sizing:border-box;}
        
        body{
            font-family:'Work Sans', sans-serif;
            background: radial-gradient(120% 90% at 15% 0%, #262d28 0%, var(--stone-900) 55%, #121614 100%);
            color:var(--chalk);
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        
        .fondo-logo {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('logo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100%;
            opacity: 0.2;
            z-index: -10;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: rgba(38,45,40,0.55);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(242,237,225,0.12);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }

        #header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .eyebrow{
            display:flex; align-items:center; gap:10px;
            font-size:11px; letter-spacing:3px; font-weight:700;
            color:var(--moss-light); text-transform:uppercase; margin-bottom:6px;
        }
        .eyebrow::before{ content:""; width:20px; height:2px; background:var(--moss-light); }

        #titulo-container {
            font-family:'Anton', sans-serif;
            font-size:clamp(24px, 4vw, 36px);
            font-weight: 400;
            text-transform: uppercase;
            margin: 0;
            color: var(--chalk);
            letter-spacing: 0.5px;
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .titulo-fijo {
            color: var(--chalk);
        }

        #nombre-editable {
            color: var(--moss-light);
            outline: none;
        }

        .fechas {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--chalk-dim);
            font-weight: 500;
        }

        .fechas input {
            background: var(--stone-800);
            color: var(--chalk);
            border: 1px solid rgba(242,237,225,0.16);
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button, select {
            background: var(--stone-800);
            color: var(--chalk);
            border: 1px solid rgba(242,237,225,0.16);
            padding: 8px 14px;
            font-size: 12px;
            font-family: 'Work Sans', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        button:hover, select:hover {
            background: var(--moss);
            color: var(--stone-900);
            border-color: var(--moss);
        }

        select {
            cursor: pointer;
        }

        #pantalla-wrapper {
            position: relative;
            width: 100%;
            padding: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(242,237,225,0.08);
            overflow: hidden;
        }

        #pantalla {
            display: flex;
            width: 100%;
            height: 65px;
            gap: 2px;
        }

        .bloque {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: grab;
            color: var(--stone-900);
            font-weight: 700;
            position: relative;
            transition: filter 0.2s ease;
        }
        .bloque:hover {
            filter: brightness(1.1);
        }

        .semanas-label {
            font-size: 11px;
            opacity: 0.85;
            font-weight: 600;
        }

        .btn-borrar {
            margin-top: 2px;
            background: rgba(0,0,0,0.2);
            color: inherit;
            border: none;
            font-size: 9px;
            cursor: pointer;
            border-radius: 4px;
            padding: 1px 4px;
            font-weight: 800;
        }
        .btn-borrar:hover {
            background: rgba(0,0,0,0.4);
            color: #fff;
        }

        .fmax { background-color: #c17c74; color: #1c211e; } 
        .desox { background-color: #70908c; color: #1c211e; }
        .reox { background-color: #7c9070; color: #1c211e; } 
        .aero { background-color: #93859e; color: #1c211e; }
        .tap { background-color: #d4b26f; color: #1c211e; }

        .fechas-semanales { 
            display: flex; 
            justify-content: space-around; 
            width: 100%; 
            font-size: 9px; 
            color: var(--chalk-dim); 
            margin-top: 6px; 
            font-weight: 500;
        }

        .total-container {
            margin-top: 20px; 
            font-weight: 700; 
            font-size: 15px;
            letter-spacing: 1px;
            color: var(--chalk-dim);
        }
        .total-container span {
            color: var(--chalk);
            font-family: 'Anton', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .btn-nav-bottom {
            background: var(--stone-800);
            color: var(--chalk);
            border: 1px solid rgba(242,237,225,0.16);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-nav-bottom:hover {
            background: var(--moss);
            color: var(--stone-900);
            border-color: var(--moss);
        }
    </style>
</head>
<body>
<div class="fondo-logo"></div>
<div class="container" id="export-area">
    <div id="header-info">
        <div>
            <div class="eyebrow">Kaska.Climb</div>
            <h1 id="titulo-container">
                <span class="titulo-fijo">Macrociclo</span>
                <span id="nombre-editable">—</span>
            </h1>
        </div>
        <div class="fechas">
            <div>Inicio: <input type="date" id="fechaInicio" onchange="calcularTotal();"></div>
            <div>Fin: <input type="date" id="fechaFin" readonly></div>
        </div>
    </div>
    <div class="controls" id="controles-ui">
        <select id="selectorCliente"><option value="">Cargando clientes…</option></select>
        <select id="fase">
            <option value="fmax">FMAX</option>
            <option value="desox">DESOX</option>
            <option value="reox">REOX</option>
            <option value="aero">AERO</option>
            <option value="tap">TAP</option>
        </select>
        <select id="duracion">
            <script>for(let i=1; i<=8; i++) document.write(`<option value="${i}">${i}S</option>`);</script>
        </select>
        <button onclick="agregarBloque()">Añadir</button>
        <button onclick="cargarPlanCliente()">Cargar</button>
        <button onclick="publicarPlan()" id="btnPublicar">Publicar</button>
        <button onclick="limpiarPlan()">Limpiar</button>
    </div>
    <div id="estadoMacrociclo" style="font-size:12px; color:var(--chalk-dim); margin:-12px 0 16px;"></div>
    <div id="pantalla-wrapper">
        <div id="pantalla"></div>
        <div id="contenedor-fechas" style="display: flex; width: 100%;"></div>
    </div>
    <div class="total-container">TOTAL: <span id="totalSemanas">0</span> SEMANAS</div>
    
    <div style="text-align: center; margin-top: 24px;" id="nav-bottom-container">
        <a href="index.html" class="btn-nav-bottom">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Inicio
        </a>
    </div>
</div>

<script>
    let CLIENTE_ACTUAL = '';

    function agregarBloque(fase = document.getElementById('fase').value, duracion = parseInt(document.getElementById('duracion').value)) {
        const b = document.createElement('div');
        b.className = 'bloque ' + fase;
        b.style.flex = duracion;
        b.innerHTML = `<span>${fase.toUpperCase()}</span><span class="semanas-label">${duracion}S</span><button class="btn-borrar" onclick="event.stopPropagation(); this.parentElement.remove(); calcularTotal();">X</button>`;
        b.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-borrar')) return;
            editarDuracion(b);
        });
        document.getElementById('pantalla').appendChild(b);
        calcularTotal();
    }

    function editarDuracion(bloque) {
        const actual = parseInt(bloque.style.flex);
        const entrada = prompt('Duración del mesociclo (semanas):', actual);
        if (entrada === null) return;

        const nueva = parseInt(entrada);
        if (!nueva || nueva < 1) {
            alert('Introduce un número de semanas válido.');
            return;
        }

        bloque.style.flex = nueva;
        bloque.querySelector('.semanas-label').innerText = nueva + 'S';
        calcularTotal();
    }

    function limpiarPlan() {
        document.getElementById('pantalla').innerHTML = '';
        document.getElementById('contenedor-fechas').innerHTML = '';
        document.getElementById('totalSemanas').innerText = '0';
        document.getElementById('fechaFin').value = '';
        document.getElementById('fechaInicio').value = '';
    }

    function nombreClienteSeleccionado() {
        const sel = document.getElementById('selectorCliente');
        return sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : '';
    }

    async function cargarPlanCliente() {
        const email = document.getElementById('selectorCliente').value;
        const estado = document.getElementById('estadoMacrociclo');
        if (!email) { alert('Elige primero un cliente.'); return; }
        CLIENTE_ACTUAL = email;
        estado.textContent = 'Cargando…';
        try {
            const res = await fetch('/api/macrociclo?' + new URLSearchParams({ cliente: email }));
            const data = await res.json();
            if (!data.success) { estado.textContent = ''; alert(data.error || 'No se pudo cargar.'); return; }

            limpiarPlan();
            document.getElementById('nombre-editable').innerText = nombreClienteSeleccionado();

            if (!data.plan) {
                estado.textContent = 'Este cliente todavía no tiene ningún macrociclo publicado — puedes crear uno nuevo.';
                return;
            }
            document.getElementById('fechaInicio').value = data.plan.inicio || '';
            data.plan.bloques.forEach(b => agregarBloque(b.fase, b.semanas));
            estado.textContent = 'Último macrociclo publicado de ' + nombreClienteSeleccionado() + '.';
        } catch (e) {
            estado.textContent = '';
            alert('Error de red: ' + e.message);
        }
    }

    async function publicarPlan() {
        if (!CLIENTE_ACTUAL) { alert('Primero elige un cliente y pulsa Cargar (o elige uno y añade bloques).'); return; }
        const bloques = Array.from(document.querySelectorAll('.bloque')).map(b => ({
            fase: b.className.split(' ')[1],
            semanas: parseInt(b.style.flex)
        }));
        if (!bloques.length) { alert('Añade al menos un bloque antes de publicar.'); return; }

        const btn = document.getElementById('btnPublicar');
        const estado = document.getElementById('estadoMacrociclo');
        btn.disabled = true; btn.textContent = 'Publicando…';
        try {
            const res = await fetch('/api/macrociclo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: CLIENTE_ACTUAL,
                    nombre: nombreClienteSeleccionado(),
                    inicio: document.getElementById('fechaInicio').value,
                    fin: document.getElementById('fechaFin').value,
                    bloques,
                }),
            });
            const data = await res.json();
            estado.textContent = data.success ? 'Publicado correctamente.' : '';
            if (!data.success) alert(data.error || 'No se pudo publicar.');
        } catch (e) {
            alert('Error de red: ' + e.message);
        }
        btn.disabled = false; btn.textContent = 'Publicar';
    }

    (async function initSelector() {
        const sel = document.getElementById('selectorCliente');
        await cargarSelectorClientes(sel);
        sel.addEventListener('change', () => { if (sel.value) cargarPlanCliente(); });
        if (sel.value) cargarPlanCliente();
    })();

    function calcularTotal() {
        let t = 0;
        const bloques = document.querySelectorAll('.bloque');
        const contenedorFechas = document.getElementById('contenedor-fechas');
        contenedorFechas.innerHTML = ''; 

        const inicio = document.getElementById('fechaInicio').value;
        let fechaActual = inicio ? new Date(inicio) : null;

        bloques.forEach(b => {
            const duracion = parseInt(b.style.flex);
            t += duracion;

            if (fechaActual) {
                const subContenedor = document.createElement('div');
                subContenedor.className = 'fechas-semanales';
                subContenedor.style.flex = duracion;
                
                for(let i = 0; i < duracion; i++) {
                    const span = document.createElement('span');
                    span.innerText = `${fechaActual.getDate().toString().padStart(2,'0')}/${(fechaActual.getMonth()+1).toString().padStart(2,'0')}`;
                    subContenedor.appendChild(span);
                    fechaActual.setDate(fechaActual.getDate() + 7);
                }
                contenedorFechas.appendChild(subContenedor);
            }
        });

        document.getElementById('totalSemanas').innerText = t;
        if (inicio && t > 0) {
            document.getElementById('fechaFin').value = fechaActual.toISOString().split('T')[0];
        }
    }

    new Sortable(document.getElementById('pantalla'), { animation: 200, onSort: () => calcularTotal() });
</script>
</body>
</html>
